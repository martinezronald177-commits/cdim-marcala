<script>
/* ═══════════════════════════════════════════════════════════════
   La cotización del portal, en PDF, IDÉNTICA a la que imprime el LIS.

   Esta página no tiene plantilla propia: entre los dos marcadores de abajo
   sync_informe_web.py inyecta el código real del LIS (cssCotizacion e
   imprimirCotizacion, con todo lo que usan). Aquí solo se piden los datos
   a /api/cotizacion-web/:numero/:token, se arma `S` con lo mínimo que la
   plantilla lee, se pinta, se dibujan los códigos de barras y se repagina.
   El servidor la abre con Chrome por 127.0.0.1 y la convierte en PDF en
   /c/:numero/:token/pdf, como hace con el informe. Ver ARQUITECTURA.md.
   ═══════════════════════════════════════════════════════════════ */
let S={config:{},cotizaciones:[],pacientes:[]};
let capturaImp=null;       // ventanaImpresion() no se usa aquí; la plantilla se pide con {devolver:true}
let modoAplanado=false;
// Igual que la impresión del LIS sin marcar ninguna casilla de firma/sello:
// va la línea de firma con el nombre del regente, sin imágenes.
let opcionesFirma={firma:false,selloMicro:false,selloLab:false};
function toast(){}
function volcarEstado(){}
function registrarImpresion(){}
const escTxt=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* ===SYNC:INICIO=== (generado por sync_informe_web.py — no editar a mano) */
/* ---- normTxt/SINONIMOS/sinonimosDe (extraído de 10_nucleo.js) ---- */

/* ===SYNC:NORMALIZACION=== (sync_informe_web.py, Fase 7 — ver ARQUITECTURA.md)
   normTxt/SINONIMOS/sinonimosDe se quedan AQUÍ, en su posición original,
   antes de "let S=cargar()" de arriba — NO se movieron a 10b_formato_
   compartido.js aunque son igual de puras, porque SINONIMOS es un `const` y
   moverlo a un archivo que se concatena DESPUÉS de este (10b va justo
   después de 10_nucleo en _orden.json) le pondría el mismo riesgo de TDZ
   que ya se documentó como causa raíz de un bug de producción anterior en
   este proyecto (ver la nota sobre hoisting al principio de este archivo).
   Estos marcadores le permiten a sync_informe_web.py tomar este bloque
   exacto sin depender de una regex frágil sobre nombres de función. */
function normTxt(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
/* Grupos de sinónimos: sirven en ambos sentidos, así el analizador (inglés) empata
   con plantillas escritas en español y viceversa */
const SINONIMOS=[
  ['wbc','leucocitos','globulos blancos','glóbulos blancos','gb','recuento de leucocitos'],
  ['lym%','ly%','lymph%','linfocitos%','linfocitos %','% linfocitos','linfocitos'],
  ['gran%','gra%','neu%','granulocitos%','neutrofilos%','neutrófilos%','neutrofilos','neutrófilos','segmentados'],
  ['mid%','mxd%','mon%','monocitos%','monocitos'],
  ['lym#','ly#','lymph#','linfocitos#','linfocitos absolutos'],
  ['gran#','gra#','neu#','granulocitos#','neutrofilos absolutos','neutrófilos absolutos'],
  ['mid#','mxd#','mon#','monocitos#','monocitos absolutos'],
  ['rbc','eritrocitos','globulos rojos','glóbulos rojos','hematies','hematíes','gr'],
  ['hgb','hb','hemoglobina'],
  ['hct','hto','hematocrito','pcv'],
  ['mcv','vcm','volumen corpuscular medio'],
  ['mch','hcm','hemoglobina corpuscular media'],
  ['mchc','chcm','concentracion de hemoglobina corpuscular media'],
  ['rdw-cv','rdwcv','rdw cv','rdw','amplitud de distribucion eritrocitaria'],
  ['rdw-sd','rdwsd','rdw sd'],
  ['plt','plaquetas','plq','recuento de plaquetas'],
  ['mpv','vpm','volumen plaquetario medio'],
  ['pdw','amplitud de distribucion plaquetaria'],
  ['pct','plaquetocrito'],
  ['p-lcr','plcr','p lcr'],
  ['p-lcc','plcc','p lcc'],
  ['eos%','eosinofilos','eosinófilos','eos'],
  ['baso%','basofilos','basófilos','baso'],
  ['vsg','vES','velocidad de eritrosedimentacion','eritrosedimentacion','sedimentacion'],
  ['hba1c','hemoglobina a1c','hemoglobina glicosilada','hemoglobina glucosilada','glicohemoglobina','a1c','hgba1c'],
  ['glucosa','glicemia','glucemia','glucosa en ayunas','glucosa serica','glucosa suero'],
  ['creatinina','creatinina serica','creatinina suero'],
  ['acido urico','uricemia'],
  ['colesterol total','colesterol'],
  ['trigliceridos','tag','tg serico'],
  ['ast','tgo','transaminasa oxalacetica','aspartato aminotransferasa'],
  ['alt','tgp','transaminasa piruvica','alanina aminotransferasa'],
  ['ggt','gamma glutamiltransferasa','gamma gt'],
  ['fosfatasa alcalina','fa','alp'],
  ['tsh','hormona estimulante de tiroides','tirotropina'],
  ['t4 libre','tiroxina libre','ft4'],
  ['psa','antigeno prostatico especifico','psa total'],
  ['pcr','proteina c reactiva'],
  ['fr','factor reumatoideo','factor reumatoide'],
  ['aso','antiestreptolisina o','antiestreptolisinas'],
  ['bun','nitrogeno ureico','nitrogeno ureico bun','urea nitrogeno'],
];
function sinonimosDe(nombre){
  const n=normTxt(nombre);
  const g=SINONIMOS.find(gr=>gr.some(x=>normTxt(x)===n));
  return g?g.map(normTxt):[n];
}
/* ===FIN-SYNC:NORMALIZACION=== */

/* ---- hoy()/ahoraHora() y su caché (extraído de 10_nucleo.js) ---- */

/* ===SYNC:HORACHE-VARS=== (sync_informe_web.py, Fase 7 — se junta con
   ===SYNC:HORACHE-FUNCS=== más abajo, junto a ahoraHN()/hoy()/ahoraHora();
   quedan separados en dos marcadores porque estas variables DEBEN seguir
   aquí arriba, antes de "let S=cargar()" — ver el comentario de arriba). */
let _fmtHN=null,_cacheHN=null,_cacheHNt=0;
/* ===FIN-SYNC:HORACHE-VARS=== */

/* ===SYNC:HORACHE-FUNCS=== (sync_informe_web.py, Fase 7 — hoy()/ahoraHora()
   hacían falta para el portal: edadEnMeses()/esMenor() las llaman cuando no
   se les pasa fecha de referencia explícita). */
function ahoraHN(){
  const ahora=Date.now();
  if(_cacheHN&&ahora-_cacheHNt<20000)return _cacheHN;
  if(!_fmtHN)_fmtHN=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Tegucigalpa',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const p=_fmtHN.formatToParts(new Date());
  const g=t=>(p.find(x=>x.type===t)||{}).value||'';
  _cacheHN={fecha:g('year')+'-'+g('month')+'-'+g('day'),hora:g('hour')+':'+g('minute'),segundos:g('second')};
  _cacheHNt=ahora;
  return _cacheHN;
}
function hoy(){return ahoraHN().fecha;}
function ahoraHora(){return ahoraHN().hora;}
/* ===FIN-SYNC:HORACHE-FUNCS=== */

/* ===SYNC:NOMBRE=== (sync_informe_web.py — nombreCompleto para la cotización pública) */
function nombreCompleto(p){return [p.nombre1,p.nombre2,p.apellido1,p.apellido2].filter(Boolean).join(' ')||p.nombre||'';}
/* A diferencia del paciente (que guarda nombre1/nombre2/apellido1/apellido2
   por separado), el usuario del sistema solo tiene un "nombre" de texto
   libre (p. ej. "Dr. Ronald Enrique Martínez Márquez") -- para mostrar solo
   "primer nombre + primer apellido" en un documento impreso (pedido del
   usuario: "quien facturó" debajo de Términos de pago, sin ocupar tanto
   espacio como el nombre completo con título), se quita cualquier título
   profesional y, asumiendo la convención hondureña de dos apellidos al
   final, se toma la primera palabra como nombre y la penúltima como primer
   apellido. Con 1 o 2 palabras (sin segundo apellido) se devuelve tal cual. */
function nombreCortoUsuario(nombreCompleto){
  const TITULOS=/^(dr|dra|lic|licda|ing|msc|mba)\.?$/i;
  const p=String(nombreCompleto||'').trim().split(/\s+/).filter(w=>w&&!TITULOS.test(w));
  if(p.length<=2)return p.join(' ');
  return p[0]+' '+p[p.length-2];
}
/* ===FIN-SYNC:NOMBRE=== */

/* ---- 10b_formato_compartido.js ---- */

/* ── Helpers puros de formato de texto/fecha/edad ──
   Se agrupan aquí porque ninguno toca `S` ni el DOM: solo transforman el dato
   que reciben como argumento (excepto codigoIdentidad, que sí lee
   S.config.prefijoId — se mantiene aquí de todos modos porque es, en esencia,
   un formateador). Antes vivían dispersos en 10_nucleo.js (esc, fmtFecha,
   sexoTexto, edadDetallada, hora12), 20_pacientes.js (esMenor) y
   51_informe.js (codigoIdentidad) — se mueven aquí VERBATIM, sin cambiar una
   sola línea de su cuerpo, como paso mecánico previo a que
   sync_informe_web.py (Fase 7) pueda tomar este archivo completo en vez de
   tener que extraer funciones sueltas de archivos grandes con regex frágil.
   Ver ARQUITECTURA.md, "Plantillas de impresión — Fase 6". */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtFecha(f){if(!f)return '';const[a,m,d]=f.split('-');return d+'/'+m+'/'+a;}
function sexoTexto(s){return s==='F'?'Femenino':s==='M'?'Masculino':'—';}
function edadDetallada(fnac){
  if(!fnac)return '—';
  const n=new Date(fnac+'T12:00:00'),h=new Date();
  let a=h.getFullYear()-n.getFullYear(), m=h.getMonth()-n.getMonth(), d=h.getDate()-n.getDate();
  if(d<0){m--;const um=new Date(h.getFullYear(),h.getMonth(),0).getDate();d+=um;}
  if(m<0){a--;m+=12;}
  const pl=(v,s,p)=>v+' '+(v===1?s:p);
  return `${pl(a,'año','años')} ${pl(m,'mes','meses')} ${pl(d,'día','días')}`;
}
function esMenor(fnac){
  // Comparación directa de cadenas AAAA-MM-DD: evita construir fechas
  if(!fnac)return false;
  const hoyF=hoy();
  const [a,m,d]=fnac.split('-').map(Number);
  const limite=String(a+18).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return hoyF<limite;
}
/* Hora en formato de 12 horas, como se usa en Honduras: "02:30 p.m.".
   Vive aquí porque la usan el informe, los recibos y el sobre. */
function hora12(h){
  if(!h)return '';
  const [H,M]=String(h).split(':');
  const hh=Number(H);
  if(isNaN(hh))return '';
  const ampm=hh>=12?'p.m.':'a.m.';
  const h12=hh%12===0?12:hh%12;
  return `${String(h12).padStart(2,'0')}:${M||'00'} ${ampm}`;
}
function codigoIdentidad(p){
  // Formato institucional: PREFIJO-DDMM-AAAA-#####  (basado en fecha de nacimiento + correlativo del paciente)
  const pre=S.config.prefijoId||'CDIM';
  const corr=String(p.codigo||'').replace(/\D/g,'').padStart(5,'0');
  if(!p.fnac)return `${pre}-0000-0000-${corr}`;
  const [a,m,d]=p.fnac.split('-');
  return `${pre}-${d}${m}-${a}-${corr}`;
}
/* Texto con formato ligero para referencias, notas y observaciones (movida
   aquí en la corrección de Fase 6 — la usa cuerpoResultados() en
   51b_plantillas_informe.js).
   Se escapa primero el HTML y luego se traducen las marcas del usuario:
     **negrita**   *cursiva*   __subrayado__   ~~tachado~~
   Los saltos de línea se convierten en <br>. */
function fmtTexto(s,sep){
  let t=esc(s);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');      // **negrita**
  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');// *cursiva*
  t=t.replace(/__([^_]+)__/g,'<u>$1</u>');            // __subrayado__
  t=t.replace(/~~([^~]+)~~/g,'<s>$1</s>');            // ~~tachado~~
  return t.replace(/\n/g,sep||'<br>');
}

/* Nombre del mes en español a partir de 'AAAA-MM' (también acepta una fecha
   completa 'AAAA-MM-DD'). Lo usa el consolidado mensual de facturas, tanto
   para el título del documento como para el nombre del archivo que propone
   el navegador (Facturas_Septiembre_2026). Ningún mes en español lleva
   tilde, así que nombreArchivo() no tiene nada que limpiar aquí. */
const MESES_LARGOS=['Enero','Febrero','Marzo','Abril','Mayo','Junio',
  'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreMes(mes){
  const m=parseInt(String(mes||'').slice(5,7),10);
  return (m>=1&&m<=12)?MESES_LARGOS[m-1]:'';
}
function etiquetaMes(mes){
  const n=nombreMes(mes);
  return n?n+' '+String(mes).slice(0,4):String(mes||'');
}
/* Último día del mes 'AAAA-MM' — el 28, 29, 30 o 31 que corresponda, con los
   años bisiestos incluidos (día 0 del mes siguiente = último del actual). */
function ultimoDiaDelMes(mes){
  const a=parseInt(String(mes).slice(0,4),10), m=parseInt(String(mes).slice(5,7),10);
  return new Date(Date.UTC(a,m,0)).getUTCDate();
}

/* =============== LISTAS POR HOJAS ===============
   Una tira de cientos de registros no se recorre: se pierde uno. Por hojas se
   sabe siempre dónde se está y cuánto falta.

   Vive aquí, y no dentro de Pacientes, porque la misma barra vale para
   cualquier lista larga: se le pasa el arreglo ya filtrado, la hoja actual y el
   nombre de la función que cambia de hoja. Escrito tres veces se comportaría
   distinto las tres. */

/* Recorta la lista y, de paso, corrige la hoja: si se borró el último registro
   de la hoja 4 y ya solo hay 3, devuelve la 3 en vez de una hoja vacía. */
function trozoHoja(lista, hoja, porHoja){
  const total=(lista||[]).length;
  const hojas=Math.max(1, Math.ceil(total/porHoja));
  const h=Math.min(Math.max(1, Math.floor(hoja)||1), hojas);
  const desde=(h-1)*porHoja;
  return {hoja:h, hojas, total, desde, hasta:Math.min(desde+porHoja,total),
          items:(lista||[]).slice(desde, desde+porHoja)};
}

/* Qué números se enseñan. Con pocas hojas, todas. Con muchas, la primera, la
   última y una ventana alrededor de la actual: una fila de cuarenta botones no
   se lee, y lo que se busca casi siempre está cerca de donde uno está. */
function numerosHoja(hoja, hojas){
  if(hojas<=7) return Array.from({length:hojas},(_,i)=>i+1);
  const s=new Set([1, hojas, hoja, hoja-1, hoja+1]);
  if(hoja<=3)      [2,3,4].forEach(x=>s.add(x));
  if(hoja>=hojas-2)[hojas-1,hojas-2,hojas-3].forEach(x=>s.add(x));
  const ns=[...s].filter(x=>x>=1&&x<=hojas).sort((a,b)=>a-b);
  const salida=[];
  ns.forEach((x,i)=>{ if(i && x-ns[i-1]>1) salida.push('…'); salida.push(x); });
  return salida;
}

/* `ir` es el NOMBRE de la función que cambia de hoja, no la función: el botón
   se pinta como HTML y necesita el nombre para el onclick. */
function barraHojas(t, ir, nombre){
  if(!t.total) return '';
  const boton=x=> x==='…'
    ? '<span class="hojas-sep">…</span>'
    : `<button class="btn btn-min ${x===t.hoja?'btn-p':'btn-g'}" `+
      `onclick="${ir}(${x})" ${x===t.hoja?'aria-current="page"':''}>${x}</button>`;
  return `<div class="hojas">
    <span class="hojas-info">Mostrando <b class="nw">${t.desde+1}–${t.hasta}</b> de <b>${t.total}</b>${nombre?' '+esc(nombre):''}${t.hojas>1?` · hoja <b>${t.hoja}</b> de <b>${t.hojas}</b>`:''}</span>
    ${t.hojas>1?`<div class="hojas-btn">
      <button class="btn btn-g btn-min" ${t.hoja<=1?'disabled':''} title="Hoja anterior" onclick="${ir}(${t.hoja-1})">‹</button>
      ${numerosHoja(t.hoja,t.hojas).map(boton).join('')}
      <button class="btn btn-g btn-min" ${t.hoja>=t.hojas?'disabled':''} title="Hoja siguiente" onclick="${ir}(${t.hoja+1})">›</button>
    </div>`:''}
  </div>`;
}

/* =============== SUCURSALES ===============
   El digito identifica la sucursal y prefija cada orden; el nombre es como se
   llama. Donde antes se pintaba solo el numero, ahora se pinta "1 · Principal".
   Si el numero no esta en el catalogo -un documento viejo de una sucursal que
   se dio de baja- se pinta el numero solo: no se inventa un nombre. */
function sucursales(){
  const l=(S&&S.config&&Array.isArray(S.config.sucursales))?S.config.sucursales:[];
  return l.filter(x=>x&&String(x.num||'').trim());
}
function nombreSucursal(num){
  const n=String(num??'').trim();
  const x=sucursales().find(s=>String(s.num).trim()===n);
  return x?String(x.nombre||'').trim():'';
}
function etiquetaSucursal(num){
  const n=String(num??'').trim()||'1';
  const nombre=nombreSucursal(n);
  return nombre?n+' · '+nombre:n;
}
/* Reglas del catalogo. Puras: reciben la lista y la activa, devuelven
   {ok, motivo}. Las usa Configuracion al guardar. */
function validarSucursales(lista, activa){
  lista=(lista||[]).map(x=>({num:String(x.num??'').trim(),nombre:String(x.nombre??'').trim()}));
  if(!lista.length)return {ok:false,motivo:'Tiene que haber al menos una sucursal'};
  for(const x of lista){
    if(!/^\d{1,2}$/.test(x.num))return {ok:false,motivo:'El número de sucursal es de 1 o 2 dígitos: "'+x.num+'" no vale'};
    if(x.num==='0'||x.num==='00')return {ok:false,motivo:'La sucursal 0 no existe: el número empieza cada orden y no puede ser cero'};
    if(!x.nombre)return {ok:false,motivo:'La sucursal '+x.num+' necesita un nombre (Principal, Frente al parque…)'};
  }
  const nums=lista.map(x=>x.num);
  const rep=nums.find((n,i)=>nums.indexOf(n)!==i);
  if(rep)return {ok:false,motivo:'El número '+rep+' está dos veces: cada sucursal lleva su propio número'};
  const a=String(activa??'').trim();
  if(!nums.includes(a))return {ok:false,motivo:'La sucursal activa ('+(a||'ninguna')+') tiene que estar en la lista'};
  return {ok:true, lista};
}

/* =============== IMAGENES DEL LABORATORIO ===============
   config.logo / config.sello:  '' = la de fabrica (archivo en /img/),
   data-URI = una propia, 'ninguno' = sin imagen a proposito.
   La URL es ABSOLUTA porque los documentos se escriben en un iframe cuya URL
   es about:blank: una ruta relativa no resolveria ahi. */
const IMG_FABRICA={logo:'/img/logo.png',sello:'/img/sello.png'};
function imagenLab(campo){
  const v=(typeof S!=='undefined'&&S&&S.config&&S.config[campo])||'';
  if(v==='ninguno')return '';
  if(v)return v;
  if(!IMG_FABRICA[campo])return '';
  const origen=(typeof location!=='undefined'&&location&&location.origin&&location.origin!=='null')?location.origin:'';
  return origen+IMG_FABRICA[campo];
}

/* Las fuentes propias (/fonts/fuentes.css) para los documentos que se
   escriben en un iframe o ventana con URL about:blank: ahi una ruta relativa
   no resuelve, asi que se antepone el origen, igual que hace imagenLab(). */
function urlFuentes(){
  const origen=(typeof location!=='undefined'&&location&&location.origin&&location.origin!=='null')?location.origin:'';
  return origen+'/fonts/fuentes.css';
}

/* ---- 50b_plantillas_comunes.js ---- */

/* =============== BASE DE IMPRESIÓN DE ALTA CALIDAD ===============
   cssBaseImpresion/cssCabeceraDoc se movieron aquí VERBATIM desde
   50_impresion.js (Fase 8, ago. 2026): son texto CSS puro, sin ninguna
   dependencia de S/DOM, usados por ventanaImpresion() para TODOS los
   documentos impresos del LIS. Se mueven para que sync_informe_web.py
   (Fase 7/8) pueda tomar este archivo completo y el portal web del paciente
   pueda generar su PDF con la MISMA hoja de estilos que usa el informe
   impreso desde adentro del LIS — no una copia adaptada aparte — que es la
   única forma de garantizar que salgan realmente idénticos, no solo
   parecidos. Ver ARQUITECTURA.md, "Fase 8". */

/* El navegador compone en RGB y el driver convierte a CMYK. Esta base garantiza que
   la conversión sea fiel: fuerza la reproducción exacta de color, usa negro puro (K)
   para texto y filetes, evita colores fuera del gamut CMYK y preserva la resolución
   de logo, sello y códigos de barras. */
const cssBaseImpresion=`
 /* Ningún dato del informe se convierte en enlace: los teléfonos y números
    de identidad deben verse como texto normal, no en azul subrayado. */
 a,a:link,a:visited{color:inherit !important;text-decoration:none !important}
 *,*::before,*::after{
   -webkit-print-color-adjust:exact !important;
   print-color-adjust:exact !important;
   color-adjust:exact !important;
 }
 html,body{
   -webkit-font-smoothing:antialiased;
   text-rendering:geometricPrecision;
 }
 /* Negro puro para texto y filetes: el driver lo resuelve con la plancha K, sin
    mezcla de CMY, evitando bordes con halo de color y texto "sucio" */
 body,td,th,p,div,span,b,h1,h2,h3{color:#000}
 /* Imágenes y vectores a máxima resolución (logo, sello, código de barras) */
 img{image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
 svg{shape-rendering:geometricPrecision}
 svg.codigo{shape-rendering:crispEdges}
 /* Evitar cortes feos entre páginas */
 table{page-break-inside:auto}
 tr{page-break-inside:avoid;page-break-after:auto}
 thead{display:table-header-group}
 tfoot{display:table-footer-group}
 h1,h2,h3,.area,.ex-izq,.area-sub-tit{page-break-after:avoid}
 .firma-bloque,.pie-inst,.caja-tot{page-break-inside:avoid}
 @media print{
   body{margin:0}
   .hoja,.pagina{box-shadow:none !important}
 }
`;

/* ===== Encabezado institucional compartido por todos los documentos =====
   Antes cada documento repetía estas reglas; ahora se definen una sola vez y
   se inyectan con cssBaseImpresion, así un cambio de marca se aplica a todos. */
const cssCabeceraDoc=`
 /* Encabezado compacto: el interlineado de 1.95 y el logo de 112 px hacían
    que la dirección cayera en cuatro líneas y el bloque ocupara media hoja.
    Con estos valores la dirección entra en dos y queda sitio para resultados. */
 .cab{display:flex;align-items:center;justify-content:space-between;gap:6px;
   border-bottom:2.2px solid #111;padding-bottom:5px}
 .cab-logo{flex:0 0 auto;max-width:20%;display:flex;align-items:center}
 .cab-logo img{max-height:100px;max-width:100%;width:auto}
 .cab-nom{font-size:12pt;font-weight:700;color:#111;line-height:1.15;letter-spacing:-.3px}
 .cab-datos{flex:1;min-width:0;text-align:left;font-size:8.1pt;color:#111;
   line-height:1.55;padding:0 5px 0 4mm}
 .cab-datos b{font-weight:800}
 .cab-datos .ln-razon{font-size:9.4pt;border-bottom:.6px solid #999;padding-bottom:2px;margin-bottom:3px}
 /* Alineada a la izquierda, igual que la dirección: centrada rompía la
    columna del encabezado. */
 .cab-datos .ln-contacto{text-align:left;white-space:nowrap;margin-top:1px}
 .cab-prof{flex:0 0 24%;text-align:right}
 .prof-n{font-size:9.2pt;font-weight:700;letter-spacing:-.2px;color:#111;line-height:1.25}
 .prof-t{font-size:7.6pt;color:#333;line-height:1.45}
 /* Firma y hasta dos sellos opcionales (bloqueFirmaSello, más abajo): flotan
    JUSTO encima de la línea de firma de cada documento (la propia línea le
    pone la clase "firma-lab" para volverse el ancla de position:relative).
    Van EN FILA, uno al lado del otro y sin encimarse: encimados, el sello de
    arriba tapaba la firma y el otro sello, y en papel no se distinguía cuál
    era cuál. El "gap" los separa; cada pieza conserva su tamaño físico. */
 .firma-lab{position:relative}
 /* En el flujo normal (no position:absolute): flotando, el bloque no reservaba
    su propio alto y un sello de 45 mm terminaba montado sobre el total en
    letras y los totales. Así se coloca solo encima de la línea de firma y
    empuja lo que venga arriba; y cuando no se marca ningún sello el span ni
    se genera, de modo que no queda hueco en blanco. */
 /* Reserva 30 mm -- el alto de un sello redondo, que es el caso normal -- y
    deja que lo que sea más alto sobresalga HACIA ARRIBA (align-items:flex-end
    + overflow visible). El sello del laboratorio mide 45 mm porque arrastra
    la caja fiscal; reservarle los 45 mm completos empujaba el documento 15 mm
    y tumbaba la cotización y la factura a una segunda página. Esos 15 mm
    sobresalen sobre la franja en blanco que siempre queda entre los totales y
    la línea de firma, donde no hay texto que tapar. */
 .firma-lab-img{display:flex;align-items:flex-end;justify-content:center;
   gap:3mm;line-height:0;margin-bottom:1mm;height:26mm}
 .firma-lab-img img{flex:none}
 /* 18 mm de alto: la firma tiene que leerse como firma al lado de sellos de
    30 y 40 mm. A la altura del informe (48px ≈ 12.7 mm) quedaba empequeñecida
    entre los dos sellos, que allí no la acompañan. */
 .firma-lab-img .img-firma-doc{height:18mm;width:auto;position:relative;z-index:3}
 /* Ancho fijo + height:auto (no un cuadro fijo): conserva la relación de
    aspecto real de cada sello en vez de estirarlo/aplastarlo a un cuadro --
    un sello redondo y uno rectangular no deforman igual si se fuerzan
    ambos lados a la misma medida. "multiply" imita la tinta del sello real
    sobre el papel, igual que en el informe de resultados. */
 .firma-lab-img .img-sello-doc{height:auto;position:relative;z-index:1;
   opacity:.94;mix-blend-mode:multiply}
 /* Sello de microbiólogo (Colegio de Microbiólogos y Químicos Clínicos de
    Honduras): círculo de 30 mm de diámetro, sin caja. La imagen es cuadrada,
    así que fijar el ANCHO a 30 mm deja el círculo a su medida real -- el
    mismo tamaño con el que sale en el informe de resultados (.img-sello). */
 .firma-lab-img .img-sello-izq{width:30mm}
 /* Sello del laboratorio (medido directamente del sello físico, ago. 2026):
    círculo de 30 mm de diámetro con una caja rectangular de 40×15 mm debajo.
    Se fija el ANCHO a 40 mm -- el lado más ancho, el de la caja -- y el alto
    queda proporcional; así el círculo también sale a su tamaño real sin
    tener que medirlo aparte. Para que la escala coincida, el PNG que se suba
    en Configuración debe venir recortado justo al borde visible del sello,
    sin aire alrededor. */
 .firma-lab-img .img-sello-der{width:40mm}`;

/* ---- Plantillas de impresión compartidas entre documentos (ago. 2026) ----
   Antes, el bloque "logo + dirección/contacto + profesional" (clase .cab)
   estaba copiado y pegado con variaciones menores en imprimirCotizacion,
   imprimirReciboVenta, imprimirResultados y hojaInstructivo. bloqueCab()
   junta esas variaciones en un solo lugar mediante parámetros explícitos —
   nunca decide nada por sí sola, solo arma el HTML que cada documento ya
   armaba a mano.

   Parámetros de `opciones` (todos opcionales):
   - razonSocial: true para mostrar "De <razón social>· R.T.N." cuando
     cf.razonSocial existe (hoy: cotización y recibo lo muestran; informe e
     instructivo no lo muestran nunca, aunque cf.razonSocial esté configurado
     — es el comportamiento actual, no se corrige aquí).
   - claseContacto: nombre de clase para el <div> de "CONTACTO" (por defecto
     'ln-contacto', que es lo que usan cotización/informe/instructivo). El
     recibo de venta hoy NO le pone clase a ese div — se le pasa '' para
     preservar ese comportamiento exacto (no se corrige aquí, ver
     ARQUITECTURA.md).
   - codigoBarra: valor a codificar en el código de barras SVG de la esquina
     (hoy solo lo usa cotización, con el número de cotización). Si se omite,
     no se dibuja el <svg>.
*/
function bloqueCab(cf,opciones){
  opciones=opciones||{};
  const claseContacto=('claseContacto' in opciones)?opciones.claseContacto:'ln-contacto';
  const atrContacto=claseContacto?` class="${claseContacto}"`:'';
  return `<div class="cab">
    <div class="cab-logo">${imagenLab('logo')?`<img src="${imagenLab('logo')}">`:`<div class="cab-nom">${esc(cf.nombre)}</div>`}</div>
    <div class="cab-datos">
      ${(opciones.razonSocial&&cf.razonSocial)?`<div class="ln-razon">De <b>${esc(cf.razonSocial)}</b>${cf.rtn?' · R.T.N.: '+esc(cf.rtn):''}</div>`:''}
      <div>&#9906; <b>DIRECCIÓN:</b> ${esc((cf.direccion||'').toUpperCase())}</div>
      <div${atrContacto}>&#9743; <b>CONTACTO:</b> ${esc(cf.whatsapp)}${cf.telefono2?' / '+esc(cf.telefono2):''}${cf.correo?'&nbsp;&nbsp;&#9993; '+esc(cf.correo):''}</div>
    </div>
    <div class="cab-prof">
      <div class="prof-n">${esc(cf.profesional||cf.regente)}</div>
      <div class="prof-t">${esc(cf.profesionalTitulo||'Microbiólogo y Químico Clínico')}</div>
      <div class="prof-t">${esc(cf.colegiacion)}</div>
      ${opciones.codigoBarra?`<svg class="codigo" data-valor="${opciones.codigoBarra}" style="width:74px;height:17px;margin-top:3px"></svg>`:''}
    </div>
  </div>`;
}

/* ---- Firma y sellos, opcionales (ago. 2026, pedido del usuario) ----
   opcionesFirma (declarada en 50_impresion.js junto a modoAplanado, mismo
   patrón) es una preferencia de SESIÓN, no algo grabado en la factura/recibo/
   cotización/sobre: se marcan con los "chips" de la vista previa o del modal
   de PDF (ver filaOpcionesFirma()/previsualizar()/modalPDF()), y deciden si
   ESTA copia en particular lleva la firma, el sello de microbiólogo y/o el
   sello del laboratorio configurados en Configuración -- la siguiente copia
   del MISMO documento puede salir con una combinación distinta. Se usa junto
   con la clase "firma-lab" (position:relative) que cada documento le pone a
   su propia línea de firma.

   Las tres imágenes se dibujan encimadas, como quedaría un documento firmado
   y sellado a mano de verdad: la firma al centro y arriba (z-index más
   alto), un sello a cada lado, ligeramente detrás. */
function bloqueFirmaSello(cf){
  const o=opcionesFirma;
  const partes=[
    (o.selloMicro&&cf.selloMicro)?`<img src="${cf.selloMicro}" class="img-sello-doc img-sello-izq">`:'',
    (o.firma&&cf.firma)?`<img src="${cf.firma}" class="img-firma-doc">`:'',
    (o.selloLab&&imagenLab('sello'))?`<img src="${imagenLab('sello')}" class="img-sello-doc img-sello-der">`:'',
  ].filter(Boolean);
  if(!partes.length)return '';
  return `<span class="firma-lab-img">${partes.join('')}</span>`;
}

/* Formato de moneda para los montos de cotización/recibo (ago. 2026) — antes
   cada monto se formateaba con su propia llamada suelta a
   .toLocaleString('es-HN',{minimumFractionDigits:2}) repetida ~15 veces entre
   imprimirCotizacion y imprimirReciboVenta. moneda() no cambia el formato,
   solo le pone nombre a lo que ya se hacía en cada sitio.
   No reemplaza a L() (10_nucleo.js) — L() antepone el símbolo de moneda y se
   usa en otras pantallas del sistema con esa otra convención; no se tocó
   para no mezclar dos refactors distintos. */
function moneda(n){
  return Number(n).toLocaleString('es-HN',{minimumFractionDigits:2});
}

/* Pie institucional compacto (ago. 2026) — el bloque de 2 columnas
   "servicios / nombre+whatsapp / horario" está copiado exactamente igual
   (sin ninguna variación, a diferencia de bloqueCab) en imprimirResultados y
   hojaInstructivo. No es el mismo pie que usa imprimirCotizacion — ese es un
   bloque de 3 columnas con enlace web/redes, con su propia lógica; no se

function bloquePieCompacto(cf){
  return `<div class="pie-inst">
    <div class="pie-serv">${esc(cf.servicios||'')}</div>
    <div class="pie-dir" style="grid-template-columns:1fr 1fr">
      <div><b>${esc(cf.nombre)}</b> · WhatsApp ${esc(cf.whatsapp)}</div>
      <div style="text-align:right"><b>Horario:</b> ${esc(cf.horario)}</div>
    </div>

}

/* ===== Bloque de "datos del paciente/cliente" — estandarizado (ago. 2026) =====
   El usuario, viendo el encabezado del informe de resultados, pidió
   explícitamente que cotización e instructivos salgan "estandarizados,
   uniformemente" con ese mismo encabezado — no solo el logo/dirección
   (bloqueCab, arriba, ya era compartido desde Fase 8), sino también el
   recuadro de "Paciente / Identificación / Médico / ..." que va debajo.
   Antes de esta fecha, informe, cotización e instructivo tenían CADA UNO
   su propia copia de este bloque: mismos conceptos, pero con etiquetas
   distintas ("Nombre" vs "Paciente", "N° Identidad" vs "Identificación"),
   orden distinto, y hasta una cuadrícula CSS distinta por documento
   (2 columnas por ancho desigual en el informe, grid de 3 columnas en
   cotización, grid de 3 columnas con otras proporciones en instructivo)
   — a pesar de que el CSS de instructivo llevaba un comentario que decía
   "igual que en el informe", nunca lo fue de verdad.

   El informe de resultados es el diseño DE REFERENCIA: su HTML no cambió
   ni un carácter con este refactor (mismo orden de campos, misma
   etiqueta, mismo estilo). Cotización e instructivo adoptan ese mismo
   orden/etiquetas/estilo; lo único que cada uno agrega de más (Dirección
   en cotización; nada nuevo en instructivo) entra por `extra`, y lo que
   no aplica (Expediente si el cliente de una cotización no es todavía un
   paciente registrado) simplemente se omite — nunca se inventa un dato.

   Esta función NUNCA toca S ni el DOM: todo llega ya resuelto por quien
   llama (igual que cabeceraInforme) — así el portal web del paciente
   puede usar exactamente este mismo bloque más adelante si alguna vez lo
   necesita, sin arrastrar ninguna dependencia del LIS.

   Parámetros de `d` (todos con valor por defecto seguro):
   - nombre: se muestra en MAYÚSCULAS, igual que el informe siempre hizo.
   - identificacion: texto YA resuelto por quien llama (cada documento
     tiene hoy su propia regla de cuál identificación mostrar — DNI vs.
     código alterno en el informe, con reservas distintas en cotización —
     esa lógica de negocio no se tocó, solo el HTML/CSS que la muestra).
   - medico: texto YA resuelto (de la orden, del catálogo, o del texto
     libre según el documento).
   - expediente: si se omite o es cadena vacía, esa línea no aparece.
   - fnac, tel: directos. edadTexto: si se omite, se calcula con
     edadDetallada(fnac) (el mismo que ya usaban los tres documentos).
   - sexo: código crudo ('M'/'F') a convertir con sexoTexto(); si quien
     llama YA tiene el texto resuelto de otra forma (p.ej. cotización, que
     guarda "Femenino"/"Masculino" tal cual desde su propio formulario, no
     un código), pasa sexoTexto directamente y este gana sobre `sexo`.
   - extra: arreglo opcional de líneas <div> ya armadas en HTML (usar la
     clase "ancho" para que ocupen toda la fila, igual que "Responsable"
     ya hacía en el informe).
   - conCasillaQR: true si este documento RESERVA la casilla lateral para
     un QR (hoy: solo el informe) — se reserva el espacio aunque, para
     esta orden en particular, no se dibuje nada adentro (informe
     preliminar/parcial), igual que hacía el informe antes de este
     refactor. Documentos que nunca tienen QR (cotización, instructivo)
     simplemente omiten este parámetro y el bloque de datos ocupa todo el
     ancho, sin dejar un hueco muerto a la derecha.
   - qrHTML: contenido de esa casilla (el SVG + el pie "Escanea este QR…")
     cuando sí corresponde dibujarlo; cadena vacía = casilla reservada
     pero vacía. */
function bloqueDatosPersona(d){
  d=d||{};
  const campos=[
    `<div><span class="et">${esc(d.etiquetaNombre||'Paciente')}:</span> <b>${esc((d.nombre||'').toUpperCase())}</b></div>`,
    `<div><span class="et">Identificación:</span> <b>${esc(d.identificacion||'—')}</b></div>`,
    `<div><span class="et">Médico:</span> <b>${esc((d.medico||'N/A').toUpperCase())}</b></div>`,
    d.expediente?`<div><span class="et">Expediente:</span> <b>${esc(d.expediente)}</b></div>`:'',
    `<div><span class="et">F. Nacimiento:</span> <b>${d.fnac?fmtFecha(d.fnac):'—'}</b> &nbsp; <span class="et">Género:</span> <b>${d.sexoTexto||sexoTexto(d.sexo||'')}</b></div>`,
    `<div><span class="et">Teléfono:</span> <b>${esc(d.tel||'—')}</b></div>`,
    `<div><span class="et">Edad:</span> <b>${d.edadTexto||edadDetallada(d.fnac)}</b></div>`,
    ...(d.extra||[]),
  ].filter(Boolean).join('');
  return `<div class="pac">
    <div class="pac-campos">${campos}</div>
    ${d.conCasillaQR?`<div class="pac-cb">${d.qrHTML||''}</div>`:''}
  </div>`;
}
/* CSS del bloque de arriba — antes vivía solo (con variaciones) dentro de

const cssBloqueDatos=`

/* repaginarHojas() se mueve aquí VERBATIM desde 50_impresion.js (Fase 8,
   ago. 2026): mide el DOM ya renderizado (window.getComputedStyle/
   scrollHeight/clientWidth) para decidir dónde cortar cada ".hoja" en
   páginas físicas y renumerar "Página X de Y" -- no toca S ni nada
   específico del LIS, es DOM puro sobre lo que ya le pasen. El PDF del
   portal web del paciente (server.js -> navegador(), un Chromium real vía
   Puppeteer) la llama igual que el LIS, sobre el mismo HTML que arma
   construirHojasInforme() (51b_plantillas_informe.js), para paginar
   IDÉNTICO -- ver ARQUITECTURA.md, "Fase 8". */
function repaginarHojas(win){
  try{
    const doc=win.document;
    const originales=[...doc.querySelectorAll('.hoja')];
    // Primera pasada: decide, PARA CADA hoja, en cuántas páginas físicas
    // queda (sin tocar el documento todavía). Hace falta terminar esto para
    // TODAS antes de renumerar "Página X de Y", porque el total final solo
    // se sabe una vez que se resolvieron todos los desbordes.
    originales.forEach(h=>{
      const minPx=parseFloat(win.getComputedStyle(h).minHeight);
      if(!minPx)return;                              // este documento no usa el patrón de una página por hoja
      const margen=Math.max(minPx*0.01,4);            // holgura mínima para no disparar por un redondeo de subpíxel
      if(h.scrollHeight<=minPx+margen)return;         // cabe en una sola página física: nada que hacer
      const encabezado=h.querySelector(':scope>.cab-repetir');
      if(!encabezado)return;                          // sin marcador no hay forma segura de repaginar
      const firmaPie=h.querySelector(':scope>.firma-pie-grupo');
      const cuerpo=[...h.children].filter(hijo=>hijo!==encabezado&&hijo!==firmaPie);
      if(!cuerpo.length)return;
      const anchoReal=h.clientWidth;
      // Área/título de examen (y también el subtítulo de subgrupo del
      // antibiograma, "area-sub-tit": p. ej. "FLUOROQUINOLONAS") no debe quedar
      // huérfano al final de una página: si el corte cayera justo después de
      // uno de estos, se obliga a que el siguiente bloque (su tabla) lo
      // acompañe (mismo criterio que ya usa el CSS nativo con
      // "page-break-after:avoid" para estas mismas clases).
      const noRomperTras=n=>/(^|\s)(area|ex-izq|area-sub-tit)(\s|$)/.test(n.className||'');
      // Cada candidato de página se mide armándolo DE VERDAD —misma clase
      // "hoja" (mismo min-height), mismo ancho— en un contenedor descartable:
      // sumar alturas individuales no basta, porque el margen entre elementos
      // colapsa distinto según con qué queden pegados (eso fue justamente lo
      // que hacía que la primera versión de este cálculo se quedara corta).
      const prueba=doc.createElement('div');
      prueba.className='hoja';
      prueba.style.cssText='position:absolute;visibility:hidden;left:-99999px;top:0;width:'+anchoReal+'px';
      doc.body.appendChild(prueba);
      const altoDe=nodos=>{
        prueba.innerHTML='';
        prueba.appendChild(encabezado.cloneNode(true));
        nodos.forEach(n=>prueba.appendChild(n.cloneNode(true)));
        return prueba.scrollHeight;
      };
      const paginas=[];let pendientes=cuerpo.slice();
      while(pendientes.length){
        let grupo=[pendientes[0]],i=1;
        while(i<pendientes.length){
          const candidato=grupo.concat([pendientes[i]]);
          if(altoDe(candidato)>minPx+margen&&!noRomperTras(grupo[grupo.length-1]))break;
          grupo=candidato;i++;
        }
        paginas.push(grupo);
        pendientes=pendientes.slice(i);
      }
      prueba.remove();
      if(firmaPie)firmaPie.remove();
      cuerpo.forEach(n=>n.remove());
      const nuevas=paginas.map((grupo,i)=>{
        const nueva=doc.createElement('div');
        nueva.className='hoja';
        nueva.appendChild(i===0?encabezado:encabezado.cloneNode(true));
        grupo.forEach(n=>nueva.appendChild(n));
        if(i===paginas.length-1&&firmaPie)nueva.appendChild(firmaPie);
        return nueva;
      });
      nuevas.forEach(n=>h.parentNode.insertBefore(n,h));
      h.remove();
    });
    // Segunda pasada: con el documento ya repaginado, renumera "Página X de Y"
    // en cada .hoja final (si el HTML trae los marcadores .pag-num/.pag-total
    // — informe los trae; otros documentos sin ellos simplemente no cambian).
    const finales=[...doc.querySelectorAll('.hoja')];
    const totalFinal=finales.length;
    finales.forEach((h,i)=>{
      const num=h.querySelector('.pag-num'),tot=h.querySelector('.pag-total');
      if(num)num.textContent=String(i+1);
      if(tot)tot.textContent=String(totalFinal);
    });
  }catch(e){ /* si algo falla, se imprime como estaba: el repaginado nunca debe bloquear una impresión */ }
}

/* repaginarPaginas(): el hermano de repaginarHojas() para los documentos
   comerciales (cotización, factura, recibo), que en vez de ".hoja" usan
   ".pagina" y llevan el cuerpo dentro de una <table class="items">.

   Esos documentos reparten sus renglones con un tope FIJO de filas por hoja
   (POR_PAG), calculado a ojo: no sabe si una descripción larga ocupa dos
   líneas ni si se marcaron los sellos, que suman 26 mm. Cuando la cuenta se
   queda corta, ".pagina" (max-height + overflow:hidden) recortaba en silencio
   lo que sobraba -- se perdían renglones, los totales o las condiciones.

   Aquí se mide la hoja ya renderizada y, mientras desborde, se pasa su última
   fila al principio de la siguiente (creándola con el mismo encabezado si no
   existe). El bloque de totales y firma viaja siempre a la hoja final, y al
   terminar se renumeran los artículos y el "Página X de Y", de modo que la
   secuencia siga siendo continua y correlativa.

   El límite se toma como max-height MÁS el relleno vertical: en pantalla la
   vista previa le pone padding a la hoja y en impresión el margen lo pone
   @page, así que sumarlo deja la misma altura útil en los dos lados y la
   previa pagina idéntico a lo que sale por la impresora. */
function repaginarPaginas(win){
  try{
    /* El consolidado mensual de cotizaciones mete varias cotizaciones en un
       mismo documento, cada una envuelta en .grupo-doc. Repaginarlas todas
       juntas las fundiria en una sola: las filas de todas terminarian bajo el
       encabezado de la primera -con SU numero y SU codigo de barras- y el
       "Pagina X de Y" contaria el documento entero en vez de cada cotizacion.
       Por eso se repagina grupo por grupo. Sin grupos -una cotizacion suelta,
       que es el caso de siempre- el documento entero es el grupo y el
       comportamiento no cambia en nada. */
    const grupos=win.document.querySelectorAll('.grupo-doc');
    if(grupos.length)grupos.forEach(g=>repaginarGrupo(win,g));
    else repaginarGrupo(win,win.document);
  }catch(e){ /* igual que repaginarHojas: nunca debe bloquear una impresion */ }
}
function repaginarGrupo(win,raiz){
  try{
    const originales=[...raiz.querySelectorAll('.pagina')];
    if(!originales.length)return;
    const FILAS='table.items tbody';
    const COLA='.totales,.nota,.cot-firma,.rv-tot,.rv-letras,.rv-sar,.rv-caja,.rv-firmas';
    if(!originales[0].querySelector(FILAS))return;   // no usa este patrón

    /* Si el documento se está midiendo en un ancho que no es el de una hoja
       (un iframe angosto, un contenedor de 0 px), el texto se envuelve palabra
       por palabra y las alturas se disparan: repaginar con esas medidas
       partiría la cotización en decenas de hojas de una fila. Ante esa duda se
       deja el documento como venía -- ver el mismo cuidado en ventanaImpresion(),
       que le da tamaño carta al iframe de impresión justamente por esto. */
    if(originales[0].clientWidth<500)return;

    const cs=win.getComputedStyle(originales[0]);
    const relleno=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    /* La hoja tiene min-height y su pie usa margin-top:auto, así que
       scrollHeight NUNCA baja de ese mínimo: aunque lleve un solo renglón,
       mide una hoja completa. Comparar scrollHeight contra el mínimo daba
       siempre "desborda" y la cotización salía a un análisis por hoja.
       Para medir el contenido DE VERDAD se anula el mínimo un instante: sin
       él la hoja se encoge a lo que ocupa, y restándole el relleno queda el
       alto real del contenido. La capacidad es ese mismo min-height, que
       vale igual en pantalla y en papel -- por eso la previa y la impresora
       reparten las filas idéntico. */
    const capacidad=(parseFloat(cs.minHeight)||parseFloat(cs.maxHeight))||0;
    if(!capacidad)return;
    const margen=Math.max(capacidad*0.005,3);
    const altoContenido=h=>{
      const antes=h.style.minHeight;
      h.style.minHeight='0';
      const alto=h.scrollHeight-relleno;
      h.style.minHeight=antes;
      return alto;
    };
    /* El margen se RESTA, no se suma: en impresión la hoja lleva
       max-height:262mm con overflow:hidden, así que pasarse aunque sea medio
       milímetro recorta el pie. Cortar un pelo antes solo cuesta, de vez en
       cuando, un renglón que baja a la hoja siguiente. */
    const desborda=h=>altoContenido(h)>capacidad-margen;

    /* Se reconstruye de cero en vez de ir empujando filas entre hojas: así el
       reparto depende solo de lo que mide cada fila, y el proceso termina por
       construcción (cada fila se coloca una única vez). */
    const filas=[];
    originales.forEach(pg=>{ const tb=pg.querySelector(FILAS); if(tb)filas.push(...tb.rows); });
    const cola=[];
    originales.forEach(pg=>cola.push(...pg.querySelectorAll(COLA)));
    filas.forEach(f=>f.remove()); cola.forEach(e=>e.remove());

    /* Las hojas nuevas se insertan ANTES de la primera original y las
       originales se quitan al final: si se quitaran primero, el nodo que se
       usara de ancla podría ser una de ellas y ya estaría fuera del documento,
       insertBefore lanzaría y el catch dejaría la cotización sin ninguna hoja. */
    const padre=originales[0].parentNode, ancla=originales[0];
    const molde=originales[0].cloneNode(true);       // encabezado + tabla vacía + pie

    const hojas=[];
    const nuevaHoja=()=>{ const h=molde.cloneNode(true); padre.insertBefore(h,ancla); hojas.push(h); return h; };
    let hoja=nuevaHoja(), tb=hoja.querySelector(FILAS);
    for(const fila of filas){
      tb.appendChild(fila);
      // Si esta fila hizo desbordar y no es la única de la hoja, se pasa entera
      // a una hoja nueva: nunca se corta un renglón por la mitad.
      if(desborda(hoja)&&tb.rows.length>1){
        fila.remove();
        hoja=nuevaHoja(); tb=hoja.querySelector(FILAS);
        tb.appendChild(fila);
      }
    }
    // Totales, nota, firma y sellos van en la hoja final; si ya no caben, se
    // les da una hoja propia (con su encabezado y su correlativo).
    if(cola.length){
      const meter=h=>{ const ref=h.querySelector('.cond')||null;
        cola.forEach(e=>ref?h.insertBefore(e,ref):h.appendChild(e)); };
      meter(hoja);
      if(desborda(hoja)&&tb.rows.length){
        cola.forEach(e=>e.remove());
        hoja=nuevaHoja(); meter(hoja);
      }
    }

    originales.forEach(pg=>pg.remove());

    let n=0;
    hojas.forEach((h,idx)=>{
      h.querySelectorAll('td.c-art').forEach(td=>{ td.textContent=String(++n); });
      const num=h.querySelector('.pag-num'), tot=h.querySelector('.pag-total');
      if(num)num.textContent=String(idx+1);
      if(tot)tot.textContent=String(hojas.length);
    });
  }catch(e){ /* igual que repaginarHojas: nunca debe bloquear una impresión */ }
}

/* =============== CONSOLIDADO MENSUAL DE DOCUMENTOS ===============
   Un solo PDF con todos los documentos de un tipo emitidos del día 1 al
   último día de un mes, en orden correlativo, encabezado por una hoja de
   resumen con los totales del periodo. Es lo que se archiva y lo que se le
   entrega al contador: en papel suelto, documento por documento, cuadrar un
   mes obliga a sumar a mano.

   Lo usan Facturas, Recibos y Cotizaciones. Cada módulo aporta un descriptor
   (CONS_FACTURA, CONS_RECIBO, CONS_COTIZACION) con lo que cambia de uno a
   otro; el resto —el rango de fechas, el orden correlativo, la hoja de
   resumen, el modal y el nombre del archivo— es común.

   Factura y Recibo son casi el mismo documento: misma plantilla .rv, mismo
   calcRecibo(), una hoja cada uno. La Cotización no: usa .pagina, puede
   ocupar varias hojas, se repagina midiendo (ver repaginarPaginas más
   arriba), su cálculo tiene otras columnas fiscales y sus números SÍ pueden
   tener huecos porque una cotización se puede borrar. Por eso el descriptor
   lleva ganchos y no solo rótulos.

   No se reimprime nada: cada documento lo arma el MISMO renderizador que usa
   la impresión individual (con opciones.devolver), así que lo que sale aquí
   es idéntico a lo que se le entregó al cliente el día de la emisión. */
function docsDelMes(lista,mes){
  mes=String(mes||'').slice(0,7);
  /* Orden correlativo, no de captura: el número lleva la secuencia con
     relleno de ceros, así que ordenarlo como texto ya deja el rango en orden
     ascendente. */
  return (lista||[]).filter(x=>String(x.fecha||'').startsWith(mes))
    .slice().sort((a,b)=>String(a.numero||'').localeCompare(String(b.numero||'')));
}
/* Suma las columnas que pida el descriptor. Lo anulado no suma: conserva su
   número (el correlativo no puede tener huecos) pero no es ingreso ni genera
   I.S.V. Qué cuenta como anulado también lo decide el descriptor: la
   cotización no tiene ese concepto. */
function totalesDocsMes(lista,cfg){
  const t={};
  cfg.clavesTotal.forEach(k=>{t[k]=0;});
  (lista||[]).filter(d=>!cfg.anulado(d)).forEach(d=>{const c=cfg.calc(d);
    cfg.clavesTotal.forEach(k=>{t[k]+=Number(c[k])||0;});});
  return t;
}
/* Números de la secuencia que no aparecen en el mes. En un documento fiscal
   la secuencia tiene que ser continua: un salto significa uno emitido que no
   quedó registrado, que es justo lo que revisa la SAR. */
function huecosCorrelativo(lista){
  const nums=(lista||[]).map(x=>{const m=/(\d+)\s*$/.exec(String(x.numero||''));
      return m?parseInt(m[1],10):null;})
    .filter(n=>n!==null&&!isNaN(n)).sort((a,b)=>a-b);
  const huecos=[];
  for(let i=1;i<nums.length;i++){
    const desde=nums[i-1]+1, hasta=nums[i]-1;
    if(hasta>=desde) huecos.push(desde===hasta?String(desde):desde+' a '+hasta);
  }
  return huecos;
}
/* El bloque de "Resumen del periodo" de un documento fiscal: cuántos valen,
   cuántos se anularon y qué tramo del rango autorizado cubre el mes. Lo
   comparten Facturas y Recibos; Cotizaciones tiene el suyo. */
function resumenFiscalMes(cfg,lista){
  const T=cfg.txt;
  const vivos=lista.filter(d=>!cfg.anulado(d)).length;
  return `${esc(T.validos)}: <b>${vivos}</b> &nbsp;·&nbsp; ${esc(T.anulados)}: <b>${lista.length-vivos}</b><br>
    Correlativo: <b>${lista.length?esc(lista[0].numero)+' a '+esc(lista[lista.length-1].numero):'—'}</b><br>
    <span style="color:#444">${esc(T.notaAnulados)}</span>`;
}

/* ---- cálculo de la cotización (extraído de 22_cotizaciones.js) ---- */

/* ===SYNC:CALC-COT=== (sync_informe_web.py — pctItem/descItem/calcCot/round2/totalCot para la cotización pública) */
function pctItem(i){
  // Porcentaje de descuento de la línea (compatibilidad con montos guardados antes)
  if(i.descPct!==undefined&&i.descPct!=='')return Math.min(100,Math.max(0,Number(i.descPct)||0));
  if(i.descuento&&i.precio)return round2((i.descuento/i.precio)*100);
  return 0;
}
function descItem(i){return round2((Number(i.precio)||0)*pctItem(i)/100);}
function calcCot(c){
  // Todo el descuento se expresa en porcentaje: por línea y global sobre el neto
  const sub=c.items.reduce((a,i)=>a+((Number(i.precio)||0)*(i.cantidad||1)),0);
  const descLineas=c.items.reduce((a,i)=>a+(descItem(i)*(i.cantidad||1)),0);
  const neto=Math.max(0,sub-descLineas);
  const pctG=Math.min(100,Math.max(0,Number(c.descPct)||0));
  const descGlobal=round2(neto*pctG/100);
  const descuento=round2(descLineas+descGlobal);
  const base=Math.max(0,sub-descuento);
  const gravado=c.items.filter(i=>i.gravado)
    .reduce((a,i)=>a+((Number(i.precio)-descItem(i))*(i.cantidad||1)),0)*(1-pctG/100);
  const exento=Math.max(0,base-gravado);
  const impuesto=round2(gravado*0.15);
  return {sub:round2(sub),descLineas:round2(descLineas),descGlobal,pctGlobal:pctG,
    descuento,pctTotal:sub?round2(descuento/sub*100):0,
    gravado:round2(gravado),exento:round2(exento),impuesto,total:round2(base+impuesto)};
}
function round2(n){return Math.round(n*100)/100;}

/* ===SYNC:EN-LETRAS=== (sync_informe_web.py — enLetras para la cotización pública) */
function enLetras(num){
  const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
  const D=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const ent=Math.floor(num),cent=Math.round((num-ent)*100);
  const tres=n=>{
    if(n===0)return '';if(n<=20)return U[n];
    if(n<100){const d=Math.floor(n/10),u=n%10;if(d===2)return 'veinti'+U[u];return D[d]+(u?' y '+U[u]:'');}
    if(n===100)return 'cien';
    return C[Math.floor(n/100)]+(n%100?' '+tres(n%100):'');
  };
  let t='';
  if(ent>=1000){const mil=Math.floor(ent/1000);t=(mil===1?'mil':tres(mil)+' mil')+(ent%1000?' '+tres(ent%1000):'');}
  else t=tres(ent);
  // "un lempira", no "uno lempira"; "veintiún", "treinta y un"…
  t=t.replace(/\buno$/,'un').replace(/\bveintiuno$/,'veintiún');
  return (t.charAt(0).toUpperCase()+t.slice(1))+(ent===1?' lempira':' lempiras')+' con '+String(cent).padStart(2,'0')+'/100';
}
/* ===FIN-SYNC:EN-LETRAS=== */

/* ===SYNC:NOMBRE-ARCHIVO=== (sync_informe_web.py — nombreArchivo para la cotización pública) */
/* Nombre de archivo seguro: sin tildes, espacios ni signos que estorben
   al guardar o al enviar por WhatsApp. */
function nombreArchivo(...partes){
  return partes.filter(Boolean).map(p=>String(p)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // quita tildes
    .replace(/[^a-zA-Z0-9]+/g,' ').trim()
    .replace(/\s+/g,'_')).join('_').slice(0,120);
}

function cssMarcaAguaDoc(){
  const logo=imagenLab('logo');
  if(!logo)return '';
  return `
 /* z-index:0 (no solo position:relative) es a propósito: SIN un z-index
    numérico, .rv/.hoja/etc. no abren su propio contexto de apilamiento y el
    z-index:-1 del ::before termina apilándose contra el documento COMPLETO
    (el contexto raíz), donde queda tapado por el resto del contenido de la
    misma hoja en vez de solo por su fondo -- el logo nunca llegaba a verse. */
 .rv,.pagina,.hoja,.hoja-doc{position:relative;z-index:0}
 .rv::before,.pagina::before,.hoja::before,.hoja-doc::before{
   content:'';position:absolute;inset:0;
   background-image:url("${logo}");
   background-repeat:no-repeat;background-position:center;background-size:48%;
   opacity:.06;z-index:-1;pointer-events:none}`;
}

    ${(cf.web||cf.redes)?`<div class="pie-web">${esc(cf.web||'')}${cf.redes?' · '+esc(cf.redes):''}</div>`:''}
  </div>`;

  let inicio=0;

      </table></div>
    </div>
    ${/* Sin nota escrita, el rótulo solo gastaba 7 mm de alto en blanco. */''
     }${c.nota?`<div class="nota"><b>Nota:</b> ${esc(c.nota)}</div>`:''}
    <div class="cot-firma">

    return `<div class="pagina">
      ${cabecera(idx+1)}
      ${encTabla}${filas}</tbody></table>
      ${bloqueTot}
      ${pie}

  }).join('');
  /* opciones.devolver: el consolidado mensual arma UNA sola ventana de

const partes=location.pathname.split('/').filter(Boolean);   // ['c', numero, token]
const NUM=partes[1], TOK=partes[2];
/* Lo pone el servidor cuando no pudo armar el PDF (ver /c/:numero/:token/pdf). */
const RESPALDO = new URLSearchParams(location.search).get('respaldo') === '1';

/* ── Respaldo cuando el PDF no se pudo armar ──
   La página se muestra igual (no necesita Chrome) y se le explica al
   paciente cómo guardarla con su propio navegador. El aviso se esconde al
   imprimir: lo que salga en papel o en su PDF es el documento, sin nada
   nuestro encima. */
function avisoRespaldo(queEs){
  const st=document.createElement('style');
  st.textContent='.aviso-respaldo{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8e6;'+
    'border:1.5px solid #f0c060;border-radius:10px;padding:14px 16px;margin:12px auto;max-width:760px;'+
    'font-size:14px;line-height:1.6;color:#5a4300}'+
    '.aviso-respaldo b{display:block;margin-bottom:4px;color:#7a3d00}'+
    '.aviso-respaldo .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}'+
    '.aviso-respaldo button,.aviso-respaldo a{font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;'+
    'padding:10px 16px;border:none;cursor:pointer;text-decoration:none;display:inline-block}'+
    '.aviso-respaldo button{background:#285068;color:#fff}'+
    '.aviso-respaldo a{background:#25d366;color:#fff}'+
    '@media print{.aviso-respaldo{display:none!important}}';
  document.head.appendChild(st);
  const d=document.createElement('div');
  d.className='aviso-respaldo';
  d.innerHTML='<b>No pudimos preparar el archivo PDF en este momento.</b>'+
    'Aquí abajo está '+queEs+', completo. Para guardarlo, pulsa «Guardar como PDF» '+
    'y elige esa opción como destino de impresión.'+
    '<div class="acc"><button type="button" onclick="window.print()">Guardar como PDF</button>'+
    '<a href="https://wa.me/50497589992" target="_blank" rel="noopener">Pídelo por WhatsApp</a></div>';
  document.body.insertBefore(d, document.body.firstChild);
}
/* El botón no es un enlace normal a propósito: se pide el archivo por fetch
   para poder distinguir "salió bien" de "el servidor no pudo armarlo". Sin
   esto, con el atributo download el navegador guardaría la página de
   respaldo con nombre .pdf, que es peor que el error. Si el navegador no
   soporta fetch o blobs, no se toca nada y el enlace funciona como siempre. */
async function descargarPDF(ev, a, urlRespaldo){
  if(!window.fetch || !window.URL || !URL.createObjectURL) return;
  ev.preventDefault();
  const antes=a.textContent;
  a.textContent='Preparando tu PDF…';
  a.style.pointerEvents='none';
  try{
    const r=await fetch(a.href);
    if(r.status===429){ alert('Estamos recibiendo muchas solicitudes. Espera unos minutos e intenta de nuevo.'); return; }
    const blob=await r.blob();
    if(!r.ok || String(blob.type).indexOf('application/pdf')<0) throw new Error('no vino un PDF');
    const url=URL.createObjectURL(blob);
    const tmp=document.createElement('a');
    tmp.href=url; tmp.download=a.getAttribute('download')||'documento.pdf';
    document.body.appendChild(tmp); tmp.click(); tmp.remove();
    setTimeout(()=>URL.revokeObjectURL(url),20000);
  }catch(e){
    location.href=urlRespaldo;
  }finally{
    a.textContent=antes; a.style.pointerEvents='';
  }
}

  }
}
