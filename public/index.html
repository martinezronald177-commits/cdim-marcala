<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIS · CDI Marcala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --azul:#285068; --azul-osc:#102634; --verde:#70A020; --dorado:#b8974a;--dorado-suave:#f7f0e0;
  --dorado-claro:#e8d5a8; --fondo:#f2f5f7; --carta:#ffffff; --tinta:#16242e;
  /* Gris con contraste AA sobre blanco (el anterior no alcanzaba 4.5:1) */
  --gris:#5f7383; --gris-claro:#8fa2ae; --linea:#dbe3e9; --rojo:#c0392b; --rojo-suave:#fdecea;
  --ambar:#9a6200; --ambar-suave:#fdf3e3; --verde-suave:#eef6e2; --verde-osc:#4e7015;
  --s1:0 1px 2px rgba(16,38,52,.06); --s2:0 2px 8px rgba(16,38,52,.08);
  --s3:0 8px 24px rgba(16,38,52,.12); --s4:0 20px 60px rgba(16,38,52,.28);
  --r-s:8px; --r-m:12px; --r-l:16px; --trans:.16s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:var(--fondo);color:var(--tinta);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1.5px solid var(--linea);border-radius:8px;background:#fff;color:var(--tinta);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul)}
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);display:block;margin-bottom:4px}
.campo{margin-bottom:12px}
/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
aside{width:230px;background:linear-gradient(180deg,var(--azul) 0%,var(--azul-osc) 100%);color:#fff;
  padding:22px 0;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;
  height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow:hidden}
.marca{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;flex:0 0 auto}
.marca h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.marca h1 span{color:var(--dorado-claro)}
.marca p{font-size:10.5px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:500}
nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
nav::-webkit-scrollbar{width:4px}
nav::-webkit-scrollbar-track{background:transparent}
nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:2px}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.78);padding:11px 20px;font-size:13px;font-weight:600;text-align:left;border-left:3px solid transparent}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.activo{background:rgba(184,151,74,.18);border-left-color:var(--dorado);color:#fff}
nav .ico{width:20px;text-align:center;font-size:15px}
.pie-nav{padding:14px 20px;font-size:10px;color:rgba(255,255,255,.45);line-height:1.5;flex:0 0 auto}
main{margin-left:230px;flex:1;padding:22px 28px;max-width:1900px;width:100%;box-sizing:border-box}
.cabecera{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.cabecera h2{font-size:21px;font-weight:800;color:var(--azul)}
.cabecera h2::after{content:"";display:block;width:46px;height:3px;background:var(--dorado);border-radius:2px;margin-top:5px}
/* ---------- Componentes ---------- */
.tarjeta{background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,38,52,.05)}
.btn{border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:12.5px;letter-spacing:.2px}
.btn-p{background:var(--azul);color:#fff}.btn-p:hover{background:#1e405a}
.btn-v{background:var(--verde);color:#fff}.btn-v:hover{background:#5e8a18}
.btn-d{background:var(--dorado);color:#fff}.btn-d:hover{background:#a3823a}
.btn-g{background:#eef2f5;color:var(--tinta)}.btn-g:hover{background:#e2e8ed}
.btn-r{background:var(--rojo-suave);color:var(--rojo)}.btn-r:hover{background:#f8d7d3}
.btn-min{padding:5px 10px;font-size:11.5px}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);text-align:left;padding:8px 10px;border-bottom:2px solid var(--linea)}
td{padding:9px 10px;border-bottom:1px solid var(--linea);font-size:13px;vertical-align:middle}
tr:hover td{background:#f8fafb}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
.chip-az{background:#e3ecf2;color:var(--azul)}
.chip-vd{background:var(--verde-suave);color:#4e7015}
.chip-do{background:#f5edda;color:#8a6d2e}
.chip-rj{background:var(--rojo-suave);color:var(--rojo)}
.chip-am{background:var(--ambar-suave);color:var(--ambar)}
.rejilla{display:grid;gap:12px}
.c2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--carta);border:1px solid var(--linea);border-left:4px solid var(--dorado);border-radius:12px;padding:14px 16px}
.kpi .n{font-size:26px;font-weight:800;color:var(--azul)}
.kpi .t{font-size:11px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
.alerta-critica{background:var(--rojo-suave);border:1.5px solid var(--rojo);border-radius:10px;padding:10px 14px;color:var(--rojo);font-weight:700;font-size:12.5px;margin-bottom:10px}
.aviso{background:var(--ambar-suave);border:1.5px solid #e8c88a;border-radius:10px;padding:10px 14px;color:var(--ambar);font-weight:600;font-size:12.5px;margin-bottom:10px}
/* ---------- Modal ---------- */
.velo{position:fixed;inset:0;background:rgba(16,38,52,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.velo.abierto{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:min(980px,94vw);padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.ancho{max-width:min(1400px,96vw)}
.marco-previa{border:1.5px solid var(--linea);border-radius:10px;overflow:auto;background:#e8ecef;height:70vh}
.marco-previa iframe{width:1160px;height:calc(70vh / 0.78);border:0;transform:scale(.78);transform-origin:0 0;background:#e8ecef}
.modal h3{color:var(--azul);font-size:17px;font-weight:800;margin-bottom:16px}
.modal-pie{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;border-top:1px solid var(--linea);padding-top:14px}
/* ---------- Resultados: flags ---------- */
.flag-alto{color:var(--rojo);font-weight:800}
.flag-bajo{color:#1a5f9e;font-weight:800}
.fila-critica td{background:var(--rojo-suave)!important}
.busqueda{max-width:460px;min-width:min(240px,100%);flex:1}
.vacio{text-align:center;color:var(--gris);padding:30px;font-size:13px}
.mini-et{font-size:9px;color:var(--gris);font-weight:700;text-transform:uppercase}
.toast{position:fixed;bottom:22px;right:22px;background:var(--azul-osc);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:13px;z-index:99;display:none;border-left:4px solid var(--verde)}
/* ---------- Sesión ---------- */
#candado{position:fixed;inset:0;background:linear-gradient(160deg,var(--azul) 0%,var(--azul-osc) 100%);z-index:200;display:none;align-items:center;justify-content:center}
#candado.activo{display:flex}
.caja-login{background:#fff;border-radius:18px;padding:34px 38px;width:340px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.caja-login h1{color:var(--azul);font-size:20px;font-weight:800}
.caja-login h1 span{color:var(--dorado)}
.caja-login p{font-size:11px;color:var(--gris);margin:4px 0 18px}
.pin-punto{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--azul);margin:0 5px}
.pin-punto.lleno{background:var(--azul)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.teclado button{padding:12px;font-size:16px;font-weight:700;border:1.5px solid var(--linea);border-radius:10px;background:#fff}
.teclado button:hover{background:#eef2f5}
/* ---------- Gráfico ---------- */
.barras{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.barra{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.barra .b{width:100%;background:linear-gradient(180deg,var(--verde),#5e8a18);border-radius:6px 6px 0 0;min-height:2px}
.barra .e{font-size:9px;color:var(--gris);font-weight:700}
.barra .m{font-size:9px;font-weight:800;color:var(--azul)}
.chip-medio{background:#e3ecf2;color:var(--azul);cursor:pointer}


/* ---------- Correcciones de desbordamiento ---------- */
input,select,textarea{box-sizing:border-box;max-width:100%}
.rejilla>*{min-width:0}
.tarjeta,.kpi,.modal{overflow-wrap:anywhere}
table{table-layout:auto}
td,th{overflow-wrap:anywhere}
img{max-width:100%;height:auto}
/* En pantallas muy anchas el contenido no se estira sin control */
@media (min-width:1600px){
  .rejilla.c2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
  main{padding:24px 40px}
}

/* ---------- Editor de análisis: tarjeta amplia por cada parámetro ---------- */
.param-tarjeta{background:#fbfcfd;border:1.5px solid var(--linea);border-radius:var(--r-m);
  padding:14px 16px;margin-bottom:12px;transition:border-color var(--trans),box-shadow var(--trans)}
.param-tarjeta:hover{border-color:#c3d3dd;box-shadow:var(--s1)}
.param-tarjeta:focus-within{border-color:var(--azul);box-shadow:0 0 0 3px rgba(40,80,104,.10)}
.pt-cab{display:grid;grid-template-columns:2.2fr 1fr 1fr 42px;gap:12px;align-items:end}
.pt-campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.pt-campo>label{font-size:11px;font-weight:800;color:var(--gris);text-transform:uppercase;
  letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt-campo input,.pt-campo textarea{padding:9px 11px;font-size:13.5px;width:100%;box-sizing:border-box}
.pt-campo textarea{resize:vertical;line-height:1.5;font-family:inherit;min-height:64px}
.pt-quitar{align-self:end;height:38px;width:38px;padding:0;font-size:15px}
.pt-rangos{display:grid;grid-template-columns:1.5fr 1.5fr 1fr;gap:14px;margin-top:14px}
.pt-grupo{background:#fff;border:1px solid var(--linea);border-radius:var(--r-s);padding:10px 12px}
.pt-criticos{background:#fffaf5;border-color:#f0dcc4}
.pt-tramos{background:#f4f9fc;border-color:#cfe2ee}
.pt-tramos .pt-et{color:var(--azul)}
.tramos-lista{max-height:104px;overflow-y:auto;font-size:11px;line-height:1.5}
.tramo{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:2px 0;border-bottom:1px solid #e3edf3}
.tramo:last-child{border-bottom:none}
.tramo b{font-weight:700;color:var(--tinta)}
.tramo span{color:var(--gris);white-space:nowrap}
.pt-et{display:block;font-size:11px;font-weight:800;color:var(--azul);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px}
.pt-criticos .pt-et{color:var(--ambar)}
.pt-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.pt-mini{display:flex;flex-direction:column;gap:3px}
.pt-mini label{font-size:10.5px;font-weight:700;color:var(--gris)}
.pt-mini input{padding:8px 10px;font-size:13.5px;text-align:center;width:100%;box-sizing:border-box}
.pt-textos{display:grid;grid-template-columns:1.3fr 1.3fr 1fr;gap:14px;margin-top:14px}
.pt-textos .ayuda{margin-top:2px}
.btn-lista{background:var(--dorado-suave);border:1.5px solid var(--dorado-claro);color:var(--dorado);
  border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:800;cursor:pointer;text-transform:none;letter-spacing:0}
.btn-lista:hover{background:var(--dorado);color:#fff}
.chk-multi{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--verde-osc);
  cursor:pointer;text-transform:none;letter-spacing:0;margin:0}
.chk-multi input{width:auto;margin:0}
@media (max-width:1100px){
  .pt-cab{grid-template-columns:1fr 1fr 42px}
  .pt-cab .pt-nombre{grid-column:1/-1}
  .pt-rangos,.pt-textos{grid-template-columns:1fr}
}


/* ---------- Contabilidad: desglose por método y archivo de comprobantes ---------- */
.met-fila-c{display:grid;grid-template-columns:1.4fr 2fr auto 42px;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--linea);font-size:12.5px}
.met-fila-c:last-child{border-bottom:none}
.met-barra{height:8px;background:#eef2f5;border-radius:5px;overflow:hidden}
.met-barra i{display:block;height:100%;border-radius:5px}
.met-pct{font-size:11px;color:var(--gris);text-align:right}
.galeria-comp{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.comp-mini{border:1.5px solid var(--linea);border-radius:var(--r-m);overflow:hidden;background:#fff;
  transition:transform var(--trans),box-shadow var(--trans)}
.comp-mini:hover{transform:translateY(-2px);box-shadow:var(--s2);border-color:var(--azul)}
.comp-mini .cm-fecha{background:var(--azul);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;text-align:center}
.comp-mini img,.comp-mini .cm-pdf{width:100%;height:118px;object-fit:cover;cursor:pointer;display:block}
.comp-mini .cm-pdf{display:flex;align-items:center;justify-content:center;background:#f2f5f7;
  color:var(--rojo);font-weight:800;font-size:19px;letter-spacing:1px}
.comp-mini .cm-pie{padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.comp-mini .cm-pie b{font-size:13.5px;color:var(--azul)}
.comp-mini .cm-pie span{font-size:10px;color:var(--gris);line-height:1.35}
.comp-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--linea);
  border-radius:var(--r-m);padding:10px;margin-top:8px}
.comp-img{width:120px;height:90px;object-fit:cover;border-radius:8px}
.comp-pdf{width:120px;height:90px;border-radius:8px;background:#f2f5f7;display:flex;align-items:center;
  justify-content:center;color:var(--rojo);font-weight:800;font-size:20px;letter-spacing:1px}
.comp-info{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.comp-info span{font-size:11px;color:var(--gris)}

/* ---------- Selector de exámenes ---------- */
.lista-cat,.lista-sel{border:1.5px solid var(--linea);border-radius:10px;height:330px;overflow-y:auto;background:#fff}
.lista-sel{background:#fbfcfd}
.cat-area{position:sticky;top:0;background:var(--azul);color:#fff;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;z-index:1}
.cat-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #eef2f5}
.sel-item{display:grid;grid-template-columns:minmax(0,1fr) 72px 66px 78px 30px;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #eef2f5}
.sel-enc{display:grid;grid-template-columns:minmax(0,1fr) 72px 66px 78px 30px;gap:6px;padding:4px 8px;position:sticky;top:0;
  background:#eef2f5;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);z-index:1}
.sel-enc span:nth-child(n+2){text-align:right}
.in-num{padding:4px 6px;font-size:11.5px;text-align:right;border-radius:6px}
.in-desc{border-color:#e8c88a;background:#fffdf7}
.desc-barra{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--gris);font-weight:600}
.cat-item{cursor:pointer;user-select:none}
.cat-item:hover{background:#eef6e2}
.sel-item{background:#fff;border-left:3px solid var(--verde)}
.lista-cat,.lista-sel{height:300px}
.ci-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ci-txt b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:10px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-pre{font-size:12px;font-weight:800;color:var(--azul);white-space:nowrap}
.tot-sel{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:8px 12px;
  background:var(--azul);color:#fff;border-radius:10px;font-size:12.5px}
.tot-sel b{font-size:16px;color:var(--dorado-claro)}
/* ---------- Resultados anteriores ---------- */
.prev-chip{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:#eef2f5;border:1px solid var(--linea);
  border-radius:7px;padding:3px 7px;margin:2px 3px 2px 0;cursor:pointer;line-height:1.15;transition:all .12s}
.prev-chip:hover{background:var(--azul);border-color:var(--azul);color:#fff;transform:translateY(-1px)}
.prev-chip:hover .pc-f{color:rgba(255,255,255,.8)}
.prev-chip b{font-size:12px}
.prev-chip .pc-f{font-size:8.5px;color:var(--gris);font-weight:700}
.prev-chip.pc-alt{background:var(--ambar-suave);border-color:#e8c88a;color:var(--ambar)}
.prev-chip.pc-crit{background:var(--rojo-suave);border-color:var(--rojo);color:var(--rojo)}
/* ---------- Observaciones ---------- */
.obs-caja{margin-top:6px;background:#fbfcfd;border:1px dashed var(--linea);border-radius:8px;padding:7px 10px}
.obs-caja label{font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
.obs-caja textarea{font-size:12px;margin-top:3px}
.obs-fila{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.obs-sel{max-width:min(330px,100%);font-size:11.5px;padding:5px 8px}
.obs-seccion{margin-top:12px;background:#eef4f8;border-left:4px solid var(--azul);border-radius:8px;padding:10px 12px}
.obs-seccion textarea{font-size:12.5px}
.chk-hoja{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--gris);
  background:#fff;border:1.5px solid var(--linea);border-radius:7px;padding:3px 8px;cursor:pointer;margin-right:4px}
.chk-hoja.activo{background:var(--dorado-suave);border-color:var(--dorado);color:var(--dorado)}
.chk-hoja input{width:auto;margin:0}
/* ---------- Zona de carga de archivos ---------- */
.zona-drop{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
  border:2px dashed var(--linea);border-radius:var(--r-m);padding:18px 16px;cursor:pointer;
  background:#fbfcfd;transition:border-color var(--trans),background var(--trans);text-transform:none;
  letter-spacing:normal;color:var(--tinta);font-size:13px}
.zona-drop:hover,.zona-drop.sobre{border-color:var(--azul);background:#eef6fb}
.zona-drop .zd-ico{font-size:26px;color:var(--dorado);line-height:1}
.zona-drop b{font-size:13.5px;color:var(--azul)}
.zona-drop small{font-size:11px;color:var(--gris);font-weight:500;text-transform:none;letter-spacing:normal}
.spin{width:15px;height:15px;border:2.5px solid var(--linea);border-top-color:var(--azul);
  border-radius:50%;display:inline-block;animation:gira .8s linear infinite;flex:0 0 auto}
@keyframes gira{to{transform:rotate(360deg)}}
.barra-prog{height:6px;background:#e6ecf0;border-radius:4px;margin-top:8px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--verde);border-radius:4px;transition:width .25s}
.tabs-sgc{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--linea);padding-bottom:0}
.tab-sgc{background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:13px;
  font-weight:700;color:var(--gris);cursor:pointer;border-radius:8px 8px 0 0;transition:all var(--trans);margin-bottom:-2px}
.tab-sgc:hover{background:#eef2f5;color:var(--azul)}
.tab-sgc.activa{color:var(--azul);border-bottom-color:var(--dorado);background:#fff}
.opc-caja{border:1.5px solid var(--linea);border-radius:10px;max-height:46vh;overflow-y:auto}
.opc-fila{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid #eef2f5}
.opc-fila:hover{background:#f6f9fb}
.opc-fila.marcada{background:var(--verde-suave)}
.opc-nom{display:flex;align-items:center;gap:9px;flex:1;font-size:13px;font-weight:600;color:var(--tinta);
  text-transform:none;letter-spacing:normal;margin:0;cursor:pointer}
.opc-nom input{width:auto;margin:0;flex:0 0 auto;transform:scale(1.15)}
.opc-grado{max-width:min(165px,42%);font-size:11.5px;padding:5px 7px}
.fila-sub td{background:#e9eef2 !important;font-weight:800;font-size:10.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--azul);padding:5px 8px !important}
.fila-anulada td{opacity:.55;text-decoration:line-through}
.fila-anulada td:last-child{opacity:1;text-decoration:none}
/* ---------- Búsqueda de exámenes en cotización ---------- */
.lista-busca{max-height:230px;overflow-y:auto;border-radius:8px;margin-top:4px}
.lista-busca:not(:empty){border:1.5px solid var(--linea)}
.busca-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #eef2f5;cursor:pointer}
.busca-item:hover{background:#eef6e2}
.busca-item.ya-esta{background:#fdf6e8}
.busca-item.ya-esta:hover{background:#faecd0}

/* ==================================================================
   CAPA DE INTERFAZ Y ACCESIBILIDAD
   ================================================================== */

/* ---------- Foco visible para navegación por teclado ---------- */
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px;border-radius:6px}
button:focus-visible,a:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(40,80,104,.14)}
nav button:focus-visible{outline:3px solid var(--dorado-claro);outline-offset:-3px}

/* Enlace de salto para lectores de pantalla y teclado */
.salto{position:absolute;left:-9999px;top:0;z-index:200;background:var(--azul);color:#fff;
  padding:10px 16px;border-radius:0 0 10px 0;font-weight:700;font-size:13px}
.salto:focus{left:0}

/* ---------- Respeta la preferencia de menos animación ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- Botones ---------- */
.btn{transition:background var(--trans),transform var(--trans),box-shadow var(--trans);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--s2)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-min{min-height:28px}
.btn+.btn{margin-left:4px}

/* ---------- Tarjetas ---------- */
.tarjeta{box-shadow:var(--s1);transition:box-shadow var(--trans)}
.tarjeta:hover{box-shadow:var(--s2)}

/* ---------- Tablas: encabezado fijo, filas legibles ---------- */
.tarjeta{overflow-x:auto}
.tarjeta>table{min-width:560px}
@media(min-width:901px){.tarjeta{overflow-x:visible}.tarjeta>table{min-width:0;width:100%}}
/* Los botones de acción de cada fila se acomodan sin cortar la tabla */
td .btn+.btn{margin-left:3px}
td:last-child{white-space:normal}
td:last-child .btn{margin-bottom:2px}
td .btn-min{padding:5px 9px}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-s)}
table thead th{position:sticky;top:0;background:#fff;z-index:2;box-shadow:inset 0 -1.5px 0 var(--linea)}
tbody tr{transition:background var(--trans)}
tbody tr:hover td{background:#f6f9fb}
tbody tr:hover .ci-pre{color:var(--azul)}

/* ---------- Chips con mejor contraste ---------- */
.chip{line-height:1.5;white-space:nowrap}
.chip-vd{color:var(--verde-osc)}
.chip-do{background:#f5edda;color:#7a5f22}
.chip-am{color:var(--ambar)}

/* ---------- KPIs ---------- */
.kpi{transition:transform var(--trans),box-shadow var(--trans);box-shadow:var(--s1)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--s2)}
.kpi .n{line-height:1.15}

/* ---------- Encabezado de sección pegajoso ---------- */
.cabecera{position:sticky;top:0;z-index:20;background:rgba(242,245,247,.92);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:14px 0 12px;margin:-26px 0 18px;border-bottom:1px solid var(--linea)}
.cabecera h2{font-size:23px;font-weight:800;color:var(--azul);letter-spacing:-.2px}
.cabecera>div{flex:1;justify-content:flex-end;flex-wrap:wrap}
.cabecera h2::after{content:"";display:block;width:38px;height:3px;background:var(--dorado);
  border-radius:2px;margin-top:5px}

/* ---------- Barra superior móvil ---------- */
.topbar{display:none;position:sticky;top:0;z-index:60;background:var(--azul);color:#fff;
  padding:10px 14px;align-items:center;gap:12px;box-shadow:var(--s2)}
.topbar b{font-size:15px;font-weight:800}
.topbar span{font-size:10.5px;color:rgba(255,255,255,.7);display:block;font-weight:500}
.hamb{background:rgba(255,255,255,.14);border:none;color:#fff;font-size:20px;line-height:1;
  width:40px;height:40px;border-radius:10px;cursor:pointer;flex:0 0 auto}
.velo-nav{display:none;position:fixed;inset:0;background:rgba(16,38,52,.5);z-index:49}
.velo-nav.abierto{display:block}

/* ---------- Modal ---------- */
.modal{box-shadow:var(--s4);max-height:92vh;overflow-y:auto;animation:subir .2s ease-out}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-pie{position:sticky;bottom:-24px;background:#fff;padding-bottom:4px;margin-bottom:-4px}
.modal h3{line-height:1.3}

/* ---------- Aviso y estados vacíos ---------- */
.vacio{text-align:center;color:var(--gris);padding:34px 18px;font-size:13.5px;line-height:1.7}
.vacio::before{content:"◍";display:block;font-size:30px;color:var(--linea);margin-bottom:8px}

/* ---------- Toast ---------- */
.toast{box-shadow:var(--s3);animation:entraToast .22s ease-out;max-width:min(420px,86vw);line-height:1.5}
@keyframes entraToast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Barras de desplazamiento discretas ---------- */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:#c3d0d9;border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#a8b9c5;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- Navegación lateral ---------- */
nav button{transition:background var(--trans),border-color var(--trans),padding var(--trans);min-height:42px}
nav button:hover{padding-left:23px}
aside{box-shadow:var(--s2);z-index:50;transition:transform .22s cubic-bezier(.4,0,.2,1)}

/* ---------- Accesos rápidos del panel ---------- */
.accesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:18px}
.acceso{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--carta);
  border:1px solid var(--linea);border-radius:var(--r-m);padding:13px 14px;text-align:left;
  box-shadow:var(--s1);transition:transform var(--trans),box-shadow var(--trans),border-color var(--trans)}
.acceso:hover{transform:translateY(-2px);box-shadow:var(--s2);border-color:var(--azul)}
.acceso .ai{font-size:17px;color:var(--dorado);line-height:1;margin-bottom:4px}
.acceso b{font-size:13px;color:var(--azul);font-weight:800}
.acceso small{font-size:10.5px;color:var(--gris);line-height:1.35}
@media (max-width:1100px){.accesos{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.accesos{grid-template-columns:repeat(2,1fr)}.acceso{padding:11px}}

/* ---------- Ayuda contextual ---------- */
.ayuda{font-size:11.5px;color:var(--gris);margin-top:4px;line-height:1.55}
kbd{background:#fff;border:1px solid var(--linea);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font-size:11px;font-family:ui-monospace,monospace;color:var(--tinta)}

/* ==================================================================
   RESPONSIVO
   ================================================================== */
@media (max-width:1100px){
  .accesos{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .topbar{display:flex}
  /* ── Tablas en el teléfono ──────────────────────────────────
     Sin esto el navegador reparte el ancho entre todas las columnas y
     termina rompiendo el texto letra por letra. Se ocultan las columnas
     secundarias y la tabla conserva un ancho mínimo legible. */
  .tarjeta{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
  /* Regla clave: la tabla NO se comprime por debajo de un ancho legible.
     Si el contenido no cabe, la tarjeta se desplaza en horizontal; lo que
     nunca debe pasar es que el navegador parta las palabras letra por letra. */
  .tarjeta>table{min-width:560px;table-layout:auto;width:100%}
  .tarjeta>table th,.tarjeta>table td{
    white-space:normal;padding:9px 7px;font-size:12.5px;width:auto !important;
    word-break:keep-all;overflow-wrap:break-word;hyphens:none}
  /* Los encabezados nunca se parten: son palabras cortas y deben leerse de un golpe */
  .tarjeta>table th{white-space:nowrap;font-size:10.5px}
  /* Aviso de que la tabla se desplaza */
  .tarjeta{position:relative}
  /* El nombre del paciente necesita espacio: es lo que identifica el registro */
  .tabla-ordenes th:nth-child(4),.tabla-ordenes td:nth-child(4){min-width:120px}
  /* Los números largos (COT-WEB-20260814-183535) se parten por el guion,
     no letra por letra */
  .tarjeta>table td b{word-break:normal;overflow-wrap:break-word;hyphens:none}
  .num-largo{font-size:11.5px;line-height:1.35;letter-spacing:-.2px;display:block}
  /* En el teléfono, el estado se muestra bajo el número y su columna se oculta:
     así el botón de acción no queda fuera de la pantalla. */
  .solo-movil{display:block}
  /* Cotizaciones: 9 columnas no caben. La de Estado se oculta porque su
     información ya se muestra bajo el número. */
  .tabla-ordenes.cot th:nth-child(6),.tabla-ordenes.cot td:nth-child(6){display:none}
  /* Exámenes/Plantillas: se conservan Examen, Área y Precio. El código, el tubo,
     la entrega y el número de análisis se consultan al abrir el examen. */
  .tabla-ex th:nth-child(1),.tabla-ex td:nth-child(1),
  .tabla-ex th:nth-child(4),.tabla-ex td:nth-child(4),
  .tabla-ex th:nth-child(5),.tabla-ex td:nth-child(5),
  .tabla-ex th:nth-child(6),.tabla-ex td:nth-child(6){display:none}
  /* Bitácora: la hora va junto a la fecha, no en su propia columna */
  .tabla-bit th:nth-child(2),.tabla-bit td:nth-child(2){display:none}
  /* Usuarios: el nombre de usuario se muestra bajo el nombre completo */
  .tabla-usr th:nth-child(2),.tabla-usr td:nth-child(2){display:none}
  /* Las acciones quedan al alcance: se apilan en vez de salirse a la derecha */
  .cel-acc{white-space:normal;text-align:left}
  .cel-acc .btn{margin:2px 4px 2px 0}
  /* Columnas que se ocultan primero: aportan contexto pero no son
     indispensables para reconocer el registro en una pantalla chica. */
  .col-sec{display:none !important}
  /* La cabecera de sección se apila en vez de encimarse */
  .cabecera{flex-direction:column;align-items:stretch;gap:12px}
  .cabecera>div{display:flex;gap:8px;width:100%}
  .cabecera>div .btn{flex:1}
  /* 100dvh respeta la barra del navegador del teléfono; 100vh queda por debajo */
  aside{transform:translateX(-100%);width:270px;height:100vh;height:100dvh;
    padding:calc(14px + env(safe-area-inset-top)) 0 0}
  .marca{padding:0 18px 12px;margin-bottom:8px}
  .marca h1{font-size:16px}
  .marca p{font-size:10px}
  aside.abierto{transform:none}
  /* Espacio extra al final para que la última opción no quede bajo la barra del sistema */
  nav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* Opciones algo más juntas: caben más sin perder área de toque cómoda */
  nav button{padding:11px 18px;font-size:13.5px;gap:11px}
  nav .ico{width:19px;font-size:15px}
  /* El pie se compacta para dejarle la pantalla al menú */
  .pie-nav{padding:9px 20px calc(9px + env(safe-area-inset-bottom));font-size:9.5px;
    border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.14)}
  .pie-nav b{display:inline}
  /* El menú del teléfono se desplaza con el dedo */
  aside{overflow:hidden}
  nav{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .marca{flex:0 0 auto}
  /* Degradado de aviso: no debe interceptar el toque */
  aside::after{content:'';position:absolute;left:0;right:0;bottom:56px;height:22px;
    background:linear-gradient(transparent,rgba(16,38,52,.5));pointer-events:none;z-index:1}
  main{margin-left:0;padding:16px 14px;max-width:100%}
  .cabecera{position:static;margin:0 0 16px;padding:0 0 10px;backdrop-filter:none}
  .cabecera>div{width:100%;flex-direction:column;align-items:stretch}
  .cabecera .busqueda{width:100% !important}
  .cabecera .btn{width:100%;justify-content:center}
  .rejilla .campo[style*="span 2"],.rejilla .campo[style*="span 3"]{grid-column:auto !important}
  .modal{max-width:100%;border-radius:14px 14px 0 0;max-height:94vh;padding:18px}
  #velo{align-items:flex-end}
  .modal-pie{flex-direction:column-reverse}
  .modal-pie .btn{width:100%}
  .btn+.btn{margin-left:0}
  table{font-size:12px}
  .sel-item,.sel-enc{grid-template-columns:1fr 62px 56px 70px 26px;gap:4px}
  .lista-cat,.lista-sel{height:250px}
  /* En el teléfono la hoja completa debe verse de un vistazo, sin cortarse.
     Se escala una hoja carta (816 px a 96 ppp) al ancho real de la pantalla. */
  .marco-previa{height:56vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .marco-previa iframe{width:816px;transform-origin:0 0;
    transform:scale(calc((100vw - 56px) / 816));
    height:calc(56vh * 816 / (100vw - 56px))}
}
@media (max-width:560px){
  .cabecera h2{font-size:19px}
  .tarjeta{padding:14px;border-radius:12px}
  .kpi .n{font-size:22px}
  main{padding:14px 10px}
  /* Toque cómodo en pantallas pequeñas */
  .btn{min-height:42px;font-size:13px}
  .btn-min{min-height:34px;font-size:12px}
  input,select,textarea{font-size:16px;padding:10px 12px}  /* 16px evita el zoom automático en iOS */
  .toast{left:12px;right:12px;bottom:12px;max-width:none;text-align:center}
}
@media (hover:none){
  .btn:hover{transform:none;box-shadow:none}
  .kpi:hover{transform:none}
  nav button:hover{padding-left:20px}
}

@media print{body *{visibility:hidden} }

/* ---------- Ajustes de resolución ---------- */
/* Portátiles de 13" a 1366×768: el modal no debe salirse de la pantalla */
@media (max-height:800px){
  .modal{max-height:96vh;padding:20px 22px}
  .marco-previa{height:58vh}
  .marco-previa iframe{height:calc(58vh / 0.78)}
  .lista-cat,.lista-sel{height:250px}
  .opc-caja{max-height:38vh}
}
@media (max-height:640px){
  .marco-previa{height:48vh}
  .marco-previa iframe{height:calc(48vh / 0.78)}
  .lista-cat,.lista-sel{height:200px}
  .kpi{padding:10px 12px}
  .kpi .n{font-size:19px}
}
/* Pantallas medianas: los KPI de 4 y 5 columnas no se aplastan */
@media (max-width:1400px){
  .kpis[style*="repeat(5"]{grid-template-columns:repeat(3,1fr) !important}
}
/* Tablas con muchas acciones: los botones bajan de línea antes de romper la tabla */
td .btn{white-space:nowrap}
@media (max-width:1500px){
  td:last-child .btn-min{margin-bottom:3px}
}
/* Nunca dejar que un texto largo rompa el ancho */
td,th,.ci-txt b,.ci-sub{overflow-wrap:anywhere}
.chip{white-space:nowrap;overflow-wrap:normal}
/* Impresión: la interfaz nunca debe aparecer */
@media print{aside,.topbar,.velo-nav,.cabecera{display:none !important}}

/* ── Barra de formato de texto (negrita, cursiva, subrayado) ── */
.fmt-barra{display:flex;align-items:center;gap:3px;margin-bottom:3px;flex-wrap:wrap}
.fmt-btn{width:26px;height:24px;border:1px solid var(--linea);background:#fff;border-radius:5px;
  cursor:pointer;font-size:12.5px;line-height:1;color:var(--txt);font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;transition:.14s;padding:0}
.fmt-btn:hover{background:var(--azul);color:#fff;border-color:var(--azul)}
.fmt-btn:active{transform:translateY(1px)}
.fmt-ayuda{font-size:10.5px;color:var(--gris);margin-left:4px}

/* ── Tabla de órdenes: columnas legibles, acciones agrupadas ── */
.tabla-ordenes{table-layout:fixed;width:100%}
.tabla-ordenes th,.tabla-ordenes td{vertical-align:top;padding:9px 8px;word-break:normal;overflow-wrap:anywhere}
.tabla-ordenes td b{font-size:13px;line-height:1.35;display:inline-block}
.cel-sub{font-size:10px;color:var(--gris);line-height:1.4;margin-top:2px}
.cel-ex{font-size:11.5px;color:var(--txt);line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cel-acc{text-align:right;white-space:nowrap}
.cel-acc .btn{margin:2px 0 2px 4px}
.menu-acc{display:inline-block}
/* Ventana de acciones de la orden */
.acc-grupo{border-top:1px solid var(--linea);padding-top:10px;margin-top:10px}
.acc-grupo:first-of-type{border-top:none;padding-top:0;margin-top:0}
.acc-grupo>b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--gris);margin-bottom:7px}
.acc-botones{display:flex;flex-wrap:wrap;gap:7px}
.acc-botones .btn{flex:0 1 auto}
/* Las columnas que se ocultan en pantalla chica se marcan con .col-sec en el
   HTML, no por su posición: cada tabla tiene un orden distinto de columnas. */

/* La copia móvil del estado no se muestra en escritorio */
.solo-movil{display:none}

/* ── Casillas de permisos por usuario ── */
.perm-fila{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-bottom:1px solid var(--linea);
  cursor:pointer;transition:.14s;margin:0;text-transform:none;font-weight:400}
.perm-fila:last-child{border-bottom:none}
.perm-fila:hover{background:#f4f8fa}
.perm-fila input{width:19px;height:19px;flex:0 0 auto;margin-top:2px;cursor:pointer}
.perm-txt{flex:1;min-width:0}
.perm-txt b{display:block;font-size:13.5px;font-weight:700;color:var(--txt);line-height:1.35}
.perm-txt span{display:block;font-size:11.5px;color:var(--gris);line-height:1.45;margin-top:1px}
</style>
</head>
<body>
<a href="#vista" class="salto">Saltar al contenido</a>
<header class="topbar">
  <button class="hamb" id="btn_menu" aria-label="Abrir el menú de secciones" aria-expanded="false" onclick="alternarMenu()">☰</button>
  <div><b>CDI Marcala</b><span>Sistema de Laboratorio Clínico</span></div>
</header>
<div class="velo-nav" id="velo_nav" onclick="alternarMenu(false)"></div>
<div id="app">
<aside id="lateral">
  <div class="marca">
    <h1>CDI <span>Marcala</span></h1>
    <p>Sistema de Laboratorio Clínico</p>
  </div>
  <nav id="menu" aria-label="Secciones del sistema">
    <button data-v="inicio" class="activo" aria-label="Inicio"><span class="ico" aria-hidden="true">◆</span>Inicio</button>
    <button data-v="pacientes" aria-label="Pacientes"><span class="ico" aria-hidden="true">☰</span>Pacientes</button>
    <button data-v="examenes" aria-label="Exámenes / Plantillas"><span class="ico" aria-hidden="true">⚗</span>Exámenes / Plantillas</button>
    <button data-v="cotizaciones" aria-label="Cotizaciones"><span class="ico" aria-hidden="true">L</span>Cotizaciones</button>
    <button data-v="ordenes" aria-label="Órdenes de Trabajo"><span class="ico" aria-hidden="true">✓</span>Órdenes de Trabajo</button>
    <button data-v="etiquetas" aria-label="Etiquetas 57×32"><span class="ico" aria-hidden="true">▤</span>Etiquetas 57×32</button>

function sinonimosDe(nombre){
  const n=normTxt(nombre);

}

/* Guardado diferido: al teclear se agrupan los cambios y se escribe una sola vez.
   Antes cada pulsación serializaba TODO el estado (varios MB con muchas órdenes).
   Las acciones importantes y el cierre de la página fuerzan la escritura inmediata. */
let _tGuardar=null,_sucio=false,_ultimoError=0;
/* Modo web: el módulo de sincronización define estas dos y activa MODO_WEB.
   En modo local quedan sin uso y el guardado va a localStorage. */
let MODO_WEB=false, _syncPendiente=false, _syncTimer=null, _lastTs=0;
function guardar(inmediato){
  _sucio=true;
  invalidarIndices();
  if(MODO_WEB){
    // En web se envía al servidor, agrupando los cambios para no saturar la red
    _syncPendiente=true;
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(subirEstado, inmediato===true?800:3000);
    return;
  }
  if(inmediato===true)return volcarEstado();
  clearTimeout(_tGuardar);
  _tGuardar=setTimeout(volcarEstado,450);
}
function volcarEstado(){
  clearTimeout(_tGuardar);_tGuardar=null;
  if(!_sucio)return;
  try{ localStorage.setItem(CLAVE,JSON.stringify(S)); _sucio=false; }
  catch(e){
    // Espacio agotado: se avisa una sola vez por minuto para no bloquear el trabajo
    if(Date.now()-_ultimoError>60000){_ultimoError=Date.now();
      toast('No se pudo guardar: el almacenamiento del navegador está lleno. Exporta un respaldo y libera espacio.','err');}
  }
}
window.addEventListener('beforeunload',()=>{if(_sucio)volcarEstado();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&_sucio)volcarEstado();});

/* ===== Índices en memoria: evitan recorrer todas las órdenes una y otra vez ===== */
let _idxPac=null,_idxDia=null;
function invalidarIndices(){_idxPac=null;_idxDia=null;}
function ordenesDe(codigo){
  if(!_idxPac){
    _idxPac=new Map();
    S.ordenes.forEach(o=>{
      if(!_idxPac.has(o.pacCodigo))_idxPac.set(o.pacCodigo,[]);
      _idxPac.get(o.pacCodigo).push(o);
    });
    // Se ordena una vez por paciente, no en cada consulta de histórico
    _idxPac.forEach(v=>v.sort((a,b)=>(b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||''))));
  }
  return _idxPac.get(codigo)||[];
}
function correlativoDia(base){
  if(!_idxDia){
    _idxDia=new Map();

      const nx=String(o.numero);
      if(nx.length<4)return;
      const b=nx.slice(0,nx.length-3), n=parseInt(nx.slice(-3),10);
      if(!isNaN(n)&&/^\d+$/.test(b))_idxDia.set(b,Math.max(_idxDia.get(b)||0,n));
    });
  }
  return _idxDia.get(base)||0;
}

/* ===== Fecha y hora oficiales de Tegucigalpa, Honduras (UTC−6, sin horario de verano) =====
   Nota: toISOString() da UTC; en Honduras eso adelanta el día desde las 6:00 p.m.
   Por eso todo el sistema toma la hora con la zona America/Tegucigalpa explícita,
   sin importar cómo esté configurado el dispositivo. */
/* El formateador de zona horaria es costoso de crear: se construye UNA vez y
   el resultado se reutiliza durante 20 segundos. Antes se creaba en cada
   llamada a hoy(), que ocurre miles de veces al dibujar una pantalla. */
let _fmtHN=null,_cacheHN=null,_cacheHNt=0;
function ahoraHN(){
  const ahora=Date.now();
  if(_cacheHN&&ahora-_cacheHNt<20000)return _cacheHN;
  if(!_fmtHN)_fmtHN=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Tegucigalpa',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const p=_fmtHN.formatToParts(new Date());
  const g=t=>(p.find(x=>x.type===t)||{}).value||'';
  _cacheHN={fecha:g('year')+'-'+g('month')+'-'+g('day'),hora:g('hour')+':'+g('minute'),segundos:g('second')};
  _cacheHNt=ahora;
  return _cacheHN;
}
function hoy(){return ahoraHN().fecha;}
function ahoraHora(){return ahoraHN().hora;}
/* Hora en formato de 12 horas, como se usa en Honduras: "02:30 p.m.".
   Vive en el núcleo porque la usan el informe, los recibos y el sobre. */
function hora12(h){
  if(!h)return '';
  const [H,M]=String(h).split(':');
  const hh=Number(H);
  if(isNaN(hh))return '';
  const ampm=hh>=12?'p.m.':'a.m.';
  const h12=hh%12===0?12:hh%12;
  return `${String(h12).padStart(2,'0')}:${M||'00'} ${ampm}`;
}
function fmtFecha(f){if(!f)return '';const[a,m,d]=f.split('-');return d+'/'+m+'/'+a;}
function simboloL(){return (S.config&&S.config.moneda)||'L';}
function L(n){
  // Formato en Lempiras con separador de miles: L 1,250.00
  const v=Number(n||0);
  const neg=v<0;
  const s=Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'−':'')+simboloL()+' '+s;
}
function edad(fnac){if(!fnac)return '';const n=new Date(fnac),h=new Date();let e=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))e--;return e;}
function edadDetallada(fnac){
  if(!fnac)return '—';
  const n=new Date(fnac+'T12:00:00'),h=new Date();
  let a=h.getFullYear()-n.getFullYear(), m=h.getMonth()-n.getMonth(), d=h.getDate()-n.getDate();
  if(d<0){m--;const um=new Date(h.getFullYear(),h.getMonth(),0).getDate();d+=um;}
  if(m<0){a--;m+=12;}
  const pl=(v,s,p)=>v+' '+(v===1?s:p);
  return `${pl(a,'año','años')} ${pl(m,'mes','meses')} ${pl(d,'día','días')}`;
}
function edadCorta(fnac){

  return fnac?edadDetallada(fnac):'';
}

  return 'd-xs';
}

function fmtDNI(v){v=v.replace(/\D/g,'').slice(0,13);if(v.length>8)return v.slice(0,4)+'-'+v.slice(4,8)+'-'+v.slice(8);if(v.length>4)return v.slice(0,4)+'-'+v.slice(4);return v;}
function fmtRTN(v){v=v.replace(/\D/g,'').slice(0,14);if(v.length>8)return v.slice(0,4)+'-'+v.slice(4,8)+'-'+v.slice(8);if(v.length>4)return v.slice(0,4)+'-'+v.slice(4);return v;}
function fmtId(tipo,v){if(tipo==='DNI')return fmtDNI(v);if(tipo==='RTN')return fmtRTN(v);return v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Texto con formato ligero para referencias, notas y observaciones.
   Se escapa primero el HTML y luego se traducen las marcas del usuario:
     **negrita**   *cursiva*   __subrayado__   ~~tachado~~
   Los saltos de línea se convierten en <br>. */
function fmtTexto(s,sep){
  let t=esc(s);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');      // **negrita**
  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');// *cursiva*
  t=t.replace(/__([^_]+)__/g,'<u>$1</u>');            // __subrayado__
  t=t.replace(/~~([^~]+)~~/g,'<s>$1</s>');            // ~~tachado~~
  return t.replace(/\n/g,sep||'<br>');
}
/* Quita las marcas para mostrar el texto plano (WhatsApp, correo, listados) */
function textoPlano(s){
  return String(s??'').replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1$2')
    .replace(/__([^_]+)__/g,'$1').replace(/~~([^~]+)~~/g,'$1');
}

/* En modo web, quien entró por la pantalla de acceso del servidor ES el
   usuario activo. No se pide una segunda identificación dentro del sistema. */
let USUARIO_WEB=null;
function usuarioActivo(){
  // El rol viaja tal cual desde el servidor; rolActivo() lo normaliza
  if(MODO_WEB&&USUARIO_WEB)
    return {nombre:USUARIO_WEB.nombre,rol:USUARIO_WEB.rol};
  const u=sessionStorage.getItem('LIS_CDIM_sesion');
  if(u){const x=S.usuarios.find(z=>z.nombre===u);if(x)return x;}
  return {nombre:S.config.regente,rol:'Admin'};
}
/* ── Roles y permisos ───────────────────────────────────────
   Admin          · dueño del sistema: todo, incluidos usuarios y configuración
   Dr             · microbiólogo colegiado: valida y firma informes
   Administrador  · parte administrativa: cobros, caja, contabilidad
   Técnico        · bancada: captura resultados, no valida

   La validación queda reservada a Dr y Admin porque la firma de un informe
   clínico tiene responsabilidad profesional: en Honduras corresponde a un
   microbiólogo colegiado. */
const ROLES=['Admin','Dr','Administrador','Técnico'];
/* Cada permiso, con el nombre que ve el laboratorio */
const CATALOGO_PERMISOS=[
  {id:'capturar',    nom:'Capturar resultados',      desc:'Escribir valores en las órdenes'},
  {id:'validar',     nom:'Validar y firmar',         desc:'Firmar informes · corresponde a microbiólogo colegiado'},
  {id:'pacientes',   nom:'Pacientes',                desc:'Registrar y editar el expediente'},
  {id:'ordenes',     nom:'Crear órdenes',            desc:'Abrir órdenes de trabajo y cotizaciones'},
  {id:'cobrar',      nom:'Cobrar y caja',            desc:'Registrar pagos, abrir y cerrar caja'},
  {id:'contabilidad',nom:'Contabilidad',             desc:'Ingresos, egresos y reportes del mes'},
  {id:'examenes',    nom:'Exámenes y plantillas',    desc:'Modificar el catálogo y los rangos'},
  {id:'calidad',     nom:'Calidad y SGC',            desc:'Control interno, no conformidades, equipos'},
  {id:'almacen',     nom:'Almacén',                  desc:'Inventario, kardex y vencimientos'},
  {id:'config',      nom:'Configuración',            desc:'Datos del laboratorio, logo, sello y firma'},
  {id:'usuarios',    nom:'Usuarios y respaldos',     desc:'Crear personal, asignar permisos, respaldar'},
];
/* Lo que trae cada rol por defecto. Se puede ajustar persona por persona. */
const PERMISOS={
  Admin:         {capturar:true, validar:true,  pacientes:true, ordenes:true, cobrar:true,  contabilidad:true,  examenes:true,  calidad:true,  almacen:true,  config:true,  usuarios:true},
  'Dr':          {capturar:true, validar:true,  pacientes:true, ordenes:true, cobrar:true,  contabilidad:true,  examenes:true,  calidad:true,  almacen:true,  config:false, usuarios:false},
  Administrador: {capturar:false,validar:false, pacientes:true, ordenes:true, cobrar:true,  contabilidad:true,  examenes:false, calidad:false, almacen:true,  config:false, usuarios:false},
  'Técnico':     {capturar:true, validar:false, pacientes:true, ordenes:true, cobrar:false, contabilidad:false, examenes:false, calidad:true,  almacen:true,  config:false, usuarios:false},
};
function rolActivo(){
  const r=String(usuarioActivo().rol||'').trim();
  // "Administrador" se evalúa ANTES que "Admin": si no, el primero
  // caería en el segundo por empezar igual.
  if(/^administrador$/i.test(r))return 'Administrador';
  if(/^admin$/i.test(r))return 'Admin';
  if(/^(dr\.?|doctor|m[ée]dico|microbi[óo]logo|regente)$/i.test(r))return 'Dr';
  if(/^(t[ée]cnico|tecnico|recepci[óo]n)/i.test(r))return 'Técnico';
  return 'Técnico';   // ante la duda, el rol con menos alcance
}
/* Un permiso definido para la persona manda sobre el del rol.
   Así se puede, por ejemplo, dar acceso al almacén a un técnico
   sin cambiarle el rol ni tocar a los demás. */
function puede(accion){
  const propios=(MODO_WEB&&USUARIO_WEB&&USUARIO_WEB.permisos)||null;
  if(propios&&Object.prototype.hasOwnProperty.call(propios,accion))return !!propios[accion];
  const p=PERMISOS[rolActivo()];
  return !!(p&&p[accion]);
}
/* Los permisos con los que trabaja alguien: los suyos o los de su rol */
function permisosDe(rol,propios){
  const base=PERMISOS[rol]||PERMISOS['Técnico'];
  return {...base,...(propios||{})};
}
function esAdmin(){return rolActivo()==='Admin';}
/* Quien puede firmar un informe */
function puedeValidar(){return puede('validar');}
let pinBuffer='';
function mostrarCandado(){
  // El servidor ya identificó a la persona: no hay segundo candado
  if(MODO_WEB)return false;
  if(!S.usuarios.length)return false;
  if(sessionStorage.getItem('LIS_CDIM_sesion'))return false;
  const c=document.getElementById('candado');c.classList.add('activo');
  document.getElementById('lg_usuario').innerHTML=S.usuarios.map(u=>`<option>${esc(u.nombre)}</option>`).join('');
  document.getElementById('lg_teclado').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>
    `<button onclick="teclaPin('${k}')">${k}</button>`).join('');
  pinBuffer='';pintarPuntos();
  return true;
}
function pintarPuntos(){
  document.getElementById('lg_puntos').innerHTML=[0,1,2,3].map(i=>`<span class="pin-punto ${i<pinBuffer.length?'lleno':''}"></span>`).join('');
}
function teclaPin(k){
  const err=document.getElementById('lg_error');err.textContent='';
  if(k==='⌫'){pinBuffer=pinBuffer.slice(0,-1);pintarPuntos();return;}
  if(k==='✓'){intentarLogin();return;}
  if(pinBuffer.length<4){pinBuffer+=k;pintarPuntos();if(pinBuffer.length===4)intentarLogin();}
}
function intentarLogin(){
  const nom=document.getElementById('lg_usuario').value;
  const u=S.usuarios.find(x=>x.nombre===nom);
  if(u&&u.pin===pinBuffer){
    sessionStorage.setItem('LIS_CDIM_sesion',u.nombre);
    document.getElementById('candado').classList.remove('activo');
    S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:u.nombre,tipo:'Actividad de rutina',descripcion:'Inicio de sesión en el sistema ('+u.rol+').'});
    guardar();actualizarPieNav();vInicio();
  }else{pinBuffer='';pintarPuntos();document.getElementById('lg_error').textContent='PIN incorrecto';}
}
function cerrarSesion(){
  sessionStorage.removeItem('LIS_CDIM_sesion');
  if(!mostrarCandado())location.reload();
}
function actualizarPieNav(){
  const u=usuarioActivo();
  document.querySelector('.pie-nav').innerHTML=
   `Sesión activa:<br><b style="color:rgba(255,255,255,.85)">${esc(u.nombre)}</b> · ${u.rol}<br>`+
   (S.usuarios.length?`<button class="btn btn-g btn-min" style="margin-top:6px" onclick="cerrarSesion()">Cerrar sesión</button>`:
   `<span style="font-size:9px">Sin usuarios configurados (acceso libre)</span>`);
}

document.getElementById('menu').addEventListener('click',e=>{

  document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('activo'));

function render(v,arg){
  if(v==='conta'&&!puede('contabilidad')){toast('No tienes permiso para ver Contabilidad');v='inicio';}
  if(v==='caja'&&!puede('cobrar')){toast('No tienes permiso para manejar la caja');v='inicio';}
  if(v==='examenes'&&!puede('examenes')){toast('No tienes permiso para modificar el catálogo');v='inicio';}
  if((v==='calidad'||v==='sgc')&&!puede('calidad')){toast('No tienes permiso para el módulo de calidad');v='inicio';}
  if(v==='almacen'&&!puede('almacen')){toast('No tienes permiso para el almacén');v='inicio';}
  if(v==='pacientes'&&!puede('pacientes')){toast('No tienes permiso para ver pacientes');v='inicio';}
  if((v==='config'&&!puede('config'))||(v==='usuarios'&&!puede('usuarios'))){
    toast('No tienes permiso para esta sección');v='inicio';
    document.querySelectorAll('#menu button').forEach(x=>x.classList.toggle('activo',x.dataset.v==='inicio'));}
  if(v==='inicio')vInicio();
  else if(v==='pacientes')vPacientes();
  else if(v==='examenes')vExamenes();
  else if(v==='cotizaciones')vCotizaciones();
  else if(v==='ordenes')vOrdenes(arg);
  else if(v==='etiquetas')vEtiquetas();
  else if(v==='recibos')vRecibos();
  else if(v==='calidad')vCalidad();
  else if(v==='almacen')vAlmacen();
  else if(v==='sgc')vSGC();
  else if(v==='caja')vCaja();
  else if(v==='conta')vConta(arg);
  else if(v==='bitacora')vBitacora();
  else if(v==='config')vConfig();
  else if(v==='usuarios')vUsuarios();
  else if(v==='respaldos')vRespaldos();
  else if(v==='instructivos')vInstructivos();
}
function irA(v,arg){
  document.querySelectorAll('#menu button').forEach(x=>{
    const act=x.dataset.v===v;x.classList.toggle('activo',act);x.setAttribute('aria-current',act?'page':'false');});
  render(v,arg);
  alternarMenu(false);                       // en móvil, el menú se cierra al elegir
  const m=document.getElementById('vista');
  if(m){m.scrollIntoView({block:'start',behavior:'auto'});}
}
/* ---- Menú lateral en pantallas pequeñas ---- */
function alternarMenu(forzar){
  const a=document.getElementById('lateral'),v=document.getElementById('velo_nav'),b=document.getElementById('btn_menu');
  if(!a)return;
  const abrir=(forzar===undefined)?!a.classList.contains('abierto'):forzar;
  a.classList.toggle('abierto',abrir);
  if(v)v.classList.toggle('abierto',abrir);
  if(b){b.setAttribute('aria-expanded',abrir?'true':'false');b.textContent=abrir?'✕':'☰';}
}
/* ---- Atajos de teclado ---- */
document.addEventListener('keydown',e=>{
  const enCampo=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  // Escape: cierra el modal abierto o el menú lateral
  if(e.key==='Escape'){
    if(document.getElementById('velo').classList.contains('abierto')){cerrarModal();return;}
    alternarMenu(false);return;
  }
  if(enCampo)return;
  // "/" o Ctrl+F: ir al buscador de la sección actual
  if(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key==='f')){
    const b=document.querySelector('.busqueda');
    if(b){e.preventDefault();b.focus();b.select();}
  }
});
function abrirModal(html,ancho){const m=document.getElementById('modal');m.innerHTML=html;m.classList.toggle('ancho',!!ancho);document.getElementById('velo').classList.add('abierto');}

  volcarEstado();   // asegura que lo capturado quede escrito

  try{

    if(m){m.classList.remove('ancho');m.scrollTop=0;m.innerHTML='';}
  }catch(e){}
  try{
    itemsCotTmp=[];itemsRec=[];selOpc={};filaListaActiva=null;
    window.__pOpc=null;window.__genPDF=null;window.__reimprimir=null;
  }catch(e){}
}
document.getElementById('velo').addEventListener('click',e=>{if(e.target.id==='velo')cerrarModal();});

function vInicio(){
  const cfg=S.config.alertas;
  const hoyF=hoy();
  const desde=new Date(hoyF+'T12:00:00');desde.setDate(desde.getDate()-30);const d30=desde.toISOString().slice(0,10);
  // UNA sola pasada por las órdenes en vez de seis recorridos completos
  let pend=0;const criticos=[],deltas=[],vencidas=[],sinValidar=[],porCobrar=[],conteo={};
  S.ordenes.forEach(o=>{
    const activa=o.estado!=='Entregada';
    if(activa)pend++;
    // Las alertas del tablero son operativas: se revisan las órdenes activas y las
    // de los últimos 30 días. Un crítico de hace meses ya fue gestionado y no aporta.
    if((activa||o.fecha>=d30)&&criticos.length<40)alertasOrden(o).forEach(a=>criticos.push({o,a}));
    if(activa&&deltas.length<60){   // el tablero muestra un resumen, no un listado exhaustivo
      alertasDelta(o).forEach(a=>deltas.push({o,a}));
      if(cfg.avisoEntrega&&o.entrega&&o.entrega<hoyF)vencidas.push(o);
      if(o.examenes.some(e=>!e.validado&&e.params.some(p=>p.valor!=='')))sinValidar.push(o);
    }
    if(!o.pagada)porCobrar.push(o);
    if(o.fecha>=d30)o.examenes.forEach(e=>conteo[e.nombre]=(conteo[e.nombre]||0)+1);

  // Con muchos registros se dibuja por tramos: la lista aparece al instante
  const lista=todos.slice(0,_topePac);
  const resto=todos.length-lista.length;
  return `${resto>0?`<div class="aviso" style="margin-bottom:8px">Mostrando ${lista.length} de ${todos.length} pacientes.
    <button class="btn btn-g btn-min" onclick="verMasPacientes()">Ver 150 más</button>

function esMenor(fnac){
  // Comparación directa de cadenas AAAA-MM-DD: evita construir fechas
  if(!fnac)return false;
  const hoyF=hoy();
  const [a,m,d]=fnac.split('-').map(Number);
  const limite=String(a+18).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return hoyF<limite;
}
function revisarMenor(){
  const f=document.getElementById('p_fnac').value;
  const box=document.getElementById('p_resp_box');
  const msg=document.getElementById('p_edadmsg');
  const menor=esMenor(f);
  if(msg)msg.innerHTML=f?(edadDetallada(f)+(menor?' · <b style="color:var(--ambar)">menor de edad: registra al responsable</b>':'')):'';
  if(box&&menor)box.style.display='block';
  // Si deja de ser menor pero ya hay datos, el bloque permanece por historial
  if(box&&!menor&&!document.getElementById('p_rnombre').value)box.style.display='none';
}
function cambioTipoId(){
  const t=document.getElementById('p_idtipo').value;
  const inp=document.getElementById('p_idnum');
  inp.placeholder={DNI:'0000-0000-00000',RTN:'0000-0000-000000',Pasaporte:'Ej. E123456'}[t];

}
function guardarPaciente(cod){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('p_n1')||!g('p_a1')){toast('Primer nombre y primer apellido son obligatorios');return;}
  const datos={nombre1:g('p_n1'),nombre2:g('p_n2'),apellido1:g('p_a1'),apellido2:g('p_a2'),
    idTipo:g('p_idtipo'),idNumero:g('p_idnum'),
    fnac:g('p_fnac'),sexo:g('p_sexo'),tel:unirTel('p_lada','p_tel'),correo:g('p_correo'),dir:g('p_dir'),medico:g('p_medico'),obs:g('p_obs'),
    respNombre:g('p_rnombre'),respId:g('p_rid'),respParentesco:g('p_rparen'),
    respTel:unirTel('p_rlada','p_rtel'),respCorreo:g('p_rcorreo')};
  datos.nombre=[datos.nombre1,datos.nombre2,datos.apellido1,datos.apellido2].filter(Boolean).join(' ');
  if(esMenor(datos.fnac)&&!datos.respNombre&&
     !confirm('El paciente es menor de 18 años y no se registró un responsable.\n\n'+
              'El responsable es quien autoriza los estudios y a quien se entregan los resultados.\n\n¿Guardar de todos modos?'))return;
  if(cod){
    Object.assign(S.pacientes.find(x=>x.codigo===cod),datos);
    // Sincronizar el nombre en órdenes existentes del paciente
    S.ordenes.forEach(o=>{if(o.pacCodigo===cod)o.pacienteNombre=datos.nombre;});
  }
  else{datos.codigo='PAC-'+String(S.seq.pac++).padStart(4,'0');S.pacientes.push(datos);}
  guardar(true);cerrarModal();vPacientes();toast('Paciente guardado ✓');
}
function borrarPaciente(cod){if(confirm('¿Eliminar este paciente?')){S.pacientes=S.pacientes.filter(x=>x.codigo!==cod);guardar();vPacientes();}}

/* Códigos telefónicos: Honduras primero, luego los de mayor contacto con el país */
const LADAS=[
 ['+504','Honduras'],['+502','Guatemala'],['+503','El Salvador'],['+505','Nicaragua'],['+506','Costa Rica'],
 ['+507','Panamá'],['+501','Belice'],['+52','México'],['+1','EE. UU. / Canadá'],['+53','Cuba'],

 ['+55','Brasil'],['+34','España'],['+39','Italia'],['+33','Francia'],['+49','Alemania'],['+44','Reino Unido'],
];
function partirTel(t){
  // Separa "+504 9758-9992" en {lada:'+504', num:'9758-9992'}
  const s=String(t||'').trim();
  const m=s.match(/^(\+\d{1,4})\s*(.*)$/);
  if(m){
    const exacta=LADAS.find(l=>l[0]===m[1]);
    if(exacta)return {lada:m[1],num:m[2].trim()};
  }
  return {lada:(S.config&&S.config.ladaDefecto)||'+504',num:s.replace(/^\+\d{1,4}\s*/,'')};
}
function selectLada(id,valor){
  const v=valor||(S.config&&S.config.ladaDefecto)||'+504';
  return `<select id="${id}" style="max-width:120px">${LADAS.map(([c,p])=>
    `<option value="${c}" ${c===v?'selected':''}>${c} ${p}</option>`).join('')}</select>`;
}
function unirTel(idLada,idNum){
  const l=document.getElementById(idLada),n=document.getElementById(idNum);
  const num=(n?n.value:'').trim();
  return num?((l?l.value:'+504')+' '+num):'';

/* Aplica formato al campo indicado dentro de la tarjeta del parámetro */
function fmtEnTarjeta(btn,selector,marca){
  const tarjeta=btn.closest('.param-tarjeta');
  if(!tarjeta)return;
  const el=tarjeta.querySelector(selector);
  if(!el)return;
  const i=el.selectionStart,f=el.selectionEnd;
  if(i===f){toast('Selecciona primero el texto que quieres marcar');el.focus();return;}
  const antes=el.value.slice(0,i),medio=el.value.slice(i,f),desp=el.value.slice(f);
  const yaEsta=antes.endsWith(marca)&&desp.startsWith(marca);
  el.value=yaEsta
    ? antes.slice(0,-marca.length)+medio+desp.slice(marca.length)
    : antes+marca+medio+marca+desp;
  el.focus();
  const d=yaEsta?-marca.length:marca.length;
  el.setSelectionRange(i+d,f+d);
}
function areasExistentes(){
  const base=['Bioquímica Clínica','Hematología','Coagulación','Inmunología','Serología','Hormonas',
    'Marcadores Tumorales','Uroanálisis','Coproanálisis','Microbiología'];
  const usadas=[...new Set(S.examenes.map(e=>e.area).filter(Boolean))];
  return [...new Set([...usadas,...base])].sort((a,b)=>a.localeCompare(b));
}

function aplicarMoverArea(){
  const destino=document.getElementById('mv_area').value.trim();
  if(!destino){toast('Escribe o elige el área destino');return;}
  const ids=[...document.querySelectorAll('.chk-mover')].filter(c=>c.checked).map(c=>c.value);
  if(!ids.length){toast('Marca al menos un examen');return;}
  const nombres=[];
  ids.forEach(id=>{
    const e=S.examenes.find(x=>x.id===id); if(!e)return;
    nombres.push(e.nombre+' ('+(e.area||'sin área')+' → '+destino+')');
    e.area=destino;
    // Las órdenes aún no validadas se actualizan; las validadas conservan su informe
    S.ordenes.forEach(o=>o.examenes.forEach(x=>{if(x.id===id&&!x.validado)x.area=destino;}));
  });
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Cambio de área de '+ids.length+' examen(es): '+nombres.join(' · ')+'.'});
  guardar(true);cerrarModal();vExamenes();
  toast(ids.length+' examen(es) movido(s) a '+destino+' ✓');
}

function guardarExamen(idPrev){
  const g=id=>document.getElementById(id).value.trim();
  const id=g('e_id').toUpperCase();
  if(!id||!g('e_nombre')){toast('Código y nombre son obligatorios');return;}
  if(!idPrev&&S.examenes.some(x=>x.id===id)){toast('Ese código ya existe');return;}
  const params=[...document.querySelectorAll('#e_params .param-tarjeta')].map(f=>({
    nombre:f.querySelector('.pp_n').value.trim(),unidad:f.querySelector('.pp_u').value.trim(),
    refMin:f.querySelector('.pp_rmi').value.trim(),refMax:f.querySelector('.pp_rma').value.trim(),
    refMinF:f.querySelector('.pp_rmif').value.trim(),refMaxF:f.querySelector('.pp_rmaf').value.trim(),
    critMin:f.querySelector('.pp_cmi').value.trim(),critMax:f.querySelector('.pp_cma').value.trim(),
    refTexto:f.querySelector('.pp_t').value.trim(),
    grupo:(f.querySelector('.pp_g')||{value:''}).value.trim(),
    opciones:((f.querySelector('.pp_o')||{value:''}).value||'').split('\n').map(x=>x.trim()).filter(Boolean),
    multi:!!(f.querySelector('.pp_m')||{}).checked,
    formula:((f.querySelector('.pp_f')||{value:''}).value||'').trim()
  })).filter(p=>p.nombre);
  if(!params.length){toast('Agrega al menos un parámetro');return;}
  const areaNueva=g('e_area')||'General';
  const areaPrevia=idPrev?(S.examenes.find(x=>x.id===idPrev)||{}).area:null;
  const datos={id,nombre:g('e_nombre'),area:areaNueva,precio:Number(g('e_precio'))||0,tubo:g('e_tubo'),
    metodo:g('e_metodo'),entrega:g('e_entrega'),leyenda:document.getElementById('e_leyenda').value.trim(),tipoLista:g('e_lista'),params};
  if(idPrev){
    const i=S.examenes.findIndex(x=>x.id===idPrev);S.examenes[i]=datos;
    // Si cambió el área, las órdenes abiertas se actualizan para que el examen
    // salga en la hoja correcta; las validadas conservan su informe original.
    if(areaPrevia&&areaPrevia!==areaNueva){
      let n=0;
      S.ordenes.forEach(o=>o.examenes.forEach(x=>{if(x.id===idPrev&&!x.validado){x.area=areaNueva;n++;}}));
      S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
        descripcion:'El examen "'+datos.nombre+'" pasó de '+areaPrevia+' a '+areaNueva+
          (n?'. Se actualizaron '+n+' orden(es) abiertas.':'.')});
    }
  }
  else S.examenes.push(datos);
  guardar();cerrarModal();vExamenes();toast('Examen guardado ✓');
}

/* Aprueba una cotización del portal web:
   1. Busca al paciente por DNI (campo diferenciador)
   2. Si no existe, lo crea con los datos que envió el paciente
   3. Convierte la cotización en orden de trabajo directamente */
function aprobarCotWeb(num){
  const c=S.cotizaciones.find(x=>x.numero===num);
  if(!c){toast('Cotización no encontrada');return;}
  // Buscar paciente por DNI
  let pac=S.pacientes.find(p=>p.idNumero&&
    p.idNumero.replace(/\D/g,'')===(c.idNumero||'').replace(/\D/g,''));
  if(!pac){
    // Crear el paciente automáticamente con los datos del portal
    const partes=(c.nombre||'').trim().split(/\s+/);
    const apellido1=partes.pop()||'';
    const apellido2=partes.length>2?partes.pop():'';
    const nombre2=partes.length>1?partes.pop():'';
    const nombre1=partes.join(' ')||c.nombre;
    const cod='PAC-'+String(S.seq.pac).padStart(4,'0');
    S.seq.pac=(S.seq.pac||1)+1;
    pac={codigo:cod,nombre1,nombre2,apellido1,apellido2,
      nombre:c.nombre,idTipo:'DNI',idNumero:c.idNumero||'',
      fnac:c.fnac||'',sexo:c.sexo||'',
      tel:c.tel?'+504 '+c.tel.replace(/^\+504\s*/,''):c.tel||'',
      dir:'',medico:c.medico||'',obs:'Registrado desde portal web',correo:''};
    S.pacientes.push(pac);
    S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,
      tipo:'Actividad de rutina',
      descripcion:'Paciente "'+pac.nombre+'" creado desde cotización web '+num+' · DNI: '+(pac.idNumero||'—')+'.'});
    toast('Paciente registrado: '+pac.nombre);
  }
  // Vincular el paciente a la cotización
  c.pacCodigo=pac.codigo;
  c.estadoCot='Aprobada';
  // Crear la orden directamente
  const ids=c.items.map(i=>i.id).filter(Boolean);
  if(!ids.length){toast('La cotización no tiene exámenes con código válido');return;}
  const o=nuevaOrden(pac,ids);
  o.descuento=calcCot(c).descuento;
  o.total=calcCot(c).total;
  o.subtotal=calcCot(c).sub;
  c.ot=o.numero;
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,
    tipo:'Actividad de rutina',
    descripcion:'Cotización web '+num+' aprobada → Orden '+o.numero+' creada · Paciente: '+pac.nombre+' · DNI: '+(pac.idNumero||'—')+'.'});
  guardar(true);
  vCotizaciones();
  toast('✓ Aprobada — Orden '+o.numero+' creada para '+pac.nombre);
  // Mostrar confirmación con opción de ir a la orden
  setTimeout(()=>{
    if(confirm('Orden '+o.numero+' creada para '+pac.nombre+'.\n¿Ir a la orden ahora para imprimir etiquetas o capturar resultados?'))
      irA('ordenes');
  },300);
}
function pctItem(i){
  // Porcentaje de descuento de la línea (compatibilidad con montos guardados antes)
  if(i.descPct!==undefined&&i.descPct!=='')return Math.min(100,Math.max(0,Number(i.descPct)||0));
  if(i.descuento&&i.precio)return round2((i.descuento/i.precio)*100);
  return 0;
}
function descItem(i){return round2((Number(i.precio)||0)*pctItem(i)/100);}
function calcCot(c){
  // Todo el descuento se expresa en porcentaje: por línea y global sobre el neto
  const sub=c.items.reduce((a,i)=>a+((Number(i.precio)||0)*(i.cantidad||1)),0);
  const descLineas=c.items.reduce((a,i)=>a+(descItem(i)*(i.cantidad||1)),0);
  const neto=Math.max(0,sub-descLineas);
  const pctG=Math.min(100,Math.max(0,Number(c.descPct)||0));
  const descGlobal=round2(neto*pctG/100);
  const descuento=round2(descLineas+descGlobal);
  const base=Math.max(0,sub-descuento);
  const gravado=c.items.filter(i=>i.gravado)
    .reduce((a,i)=>a+((Number(i.precio)-descItem(i))*(i.cantidad||1)),0)*(1-pctG/100);
  const exento=Math.max(0,base-gravado);
  const impuesto=round2(gravado*0.15);
  return {sub:round2(sub),descLineas:round2(descLineas),descGlobal,pctGlobal:pctG,
    descuento,pctTotal:sub?round2(descuento/sub*100):0,
    gravado:round2(gravado),exento:round2(exento),impuesto,total:round2(base+impuesto)};
}
function round2(n){return Math.round(n*100)/100;}
function totalCot(c){return calcCot(c).total;}

/* ---- Cotización → Orden de trabajo ---- */
function cotAOrden(n){
  const c=S.cotizaciones.find(x=>x.numero===n);
  if(!c.pacCodigo){
    abrirModal(`<h3>Convertir ${n} a orden de trabajo</h3>
    <p style="margin-bottom:12px;font-size:13px">La orden necesita un paciente registrado. Selecciónalo o créalo primero en el módulo Pacientes.</p>
    <div class="campo"><label>Paciente</label><select id="co_pac">${S.pacientes.map(p=>`<option value="${p.codigo}">${p.codigo} · ${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="modal-pie"><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-v" onclick="crearOrdenDesdeCot('${n}',document.getElementById('co_pac').value)">Crear orden</button></div>`);
    if(!S.pacientes.length){cerrarModal();toast('Primero registra al paciente');}
    return;
  }
  crearOrdenDesdeCot(n,c.pacCodigo);
}
function crearOrdenDesdeCot(nCot,pacCodigo){
  const c=S.cotizaciones.find(x=>x.numero===nCot);
  const p=S.pacientes.find(x=>x.codigo===pacCodigo);
  if(!p){toast('Selecciona un paciente válido');return;}
  // Solo pasan a la orden los conceptos que existen en el catálogo (los libres, como
  // tarifa de movilización, quedan en la cotización pero no generan examen ni tubo)
  const ids=c.items.map(i=>i.id).filter(id=>S.examenes.some(e=>e.id===id));
  if(!ids.length){toast('La cotización no contiene exámenes del catálogo');return;}
  // Completar la ficha del paciente con lo capturado en la cotización (sin sobrescribir lo existente)
  if(!p.tel&&c.tel)p.tel=c.tel;
  if(!p.dir&&c.dir)p.dir=c.dir;
  if(!p.medico&&c.medico)p.medico=c.medico;
  if(!p.fnac&&c.fnac)p.fnac=c.fnac;
  if(!p.idNumero&&c.identificacion)p.idNumero=c.identificacion;
  const o=nuevaOrden(p,ids,{cot:nCot,total:totalCot(c)});
  c.ot=o.numero;c.pacCodigo=pacCodigo;guardar(true);cerrarModal();
  irA('ordenes',o.numero);toast('Orden '+o.numero+' creada desde '+nCot+' ✓');
}
function diaHabilMas(dias){
  const d=new Date(hoy()+'T12:00:00');let n=0;
  while(n<dias){d.setDate(d.getDate()+1);if(d.getDay()!==0)n++;}
  return d.toISOString().slice(0,10);
}
function numeroOrden(fecha){
  // Formato: S AAAA MM DD NNN → 1 2026 08 10 001
  // S = sucursal · AAAA-MM-DD = fecha de la orden · NNN = paciente del día (reinicia cada jornada)
  const suc=String(S.config.sucursal||'1').replace(/\D/g,'').slice(0,2)||'1';
  const [a,m,d]=fecha.split('-');
  const base=suc+a+m+d;
  // Correlativo más alto ya emitido ese día en esa sucursal (desde el índice)
  const max=correlativoDia(base);
  return base+String(max+1).padStart(3,'0');
}
function desglosarOrden(num){
  // Devuelve las partes legibles del número, o null si es de un formato anterior
  const s=String(num||'');
  if(!/^\d{12,13}$/.test(s))return null;
  const largo=s.length-11; // 1 o 2 dígitos de sucursal
  return {sucursal:s.slice(0,largo),anio:s.slice(largo,largo+4),mes:s.slice(largo+4,largo+6),
    dia:s.slice(largo+6,largo+8),correlativo:s.slice(largo+8)};
}
function nuevaOrden(p,idsExamenes,extra={}){
  const pr={};(extra.precios||[]).forEach(i=>{pr[i.id]={precio:i.precio,descPct:pctItem(i),descuento:descItem(i)};});
  const exs=idsExamenes.map(id=>{
    const e=S.examenes.find(x=>x.id===id);
    return {id:e.id,nombre:e.nombre,area:e.area,tubo:e.tubo,
      precio:pr[id]?pr[id].precio:e.precio, descPct:pr[id]?pr[id].descPct:0, descuento:pr[id]?pr[id].descuento:0,
      metodo:e.metodo||'',leyenda:e.leyenda||'',tipoLista:e.tipoLista||'',entrega:e.entrega||'',obs:'',
      validado:false,validadoPor:'',fechaValidacion:'',
      params:e.params.map(pp=>({...pp,valor:''}))};
  });
  const fechaOrden=hoy();
  const o={numero:numeroOrden(fechaOrden),
    fecha:fechaOrden,hora:ahoraHora(),pacCodigo:p.codigo,pacienteNombre:nombreCompleto(p),estado:'Pendiente',
    examenes:exs,cot:extra.cot||'',obsAreas:{},
    subtotal:extra.subtotal??exs.reduce((a,e)=>a+e.precio,0),
    descuento:extra.descuento||0, descPct:extra.descPct||0,
    total:extra.total??exs.reduce((a,e)=>a+(e.precio-(e.descuento||0)),0),
    entrega:diaHabilMas(S.config.alertas.diasEntrega),creadaPor:usuarioActivo().nombre,
    sucursal:String(S.config.sucursal||'1'),
    pagada:false,validadoPor:'',fechaValidacion:'',notaInforme:''};
  S.ordenes.push(o);
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Creación de orden '+o.numero+' para '+o.pacienteNombre+' ('+exs.map(e=>e.id).join(', ')+').'});
  guardar();return o;
}

/* Token de acceso al informe en línea.
   Aleatorio de 12 caracteres: quien tenga el papel puede ver ese informe,
   igual que quien tiene el papel puede leerlo. No revela nada de otras órdenes
   ni permite adivinar otros tokens. */
function tokenOrden(o){
  if(!o.token){
    const abc='abcdefghijkmnpqrstuvwxyz23456789';   // sin caracteres que se confundan
    let t='';
    const rnd=(typeof crypto!=='undefined'&&crypto.getRandomValues)
      ? crypto.getRandomValues(new Uint32Array(12))
      : Array.from({length:12},()=>Math.floor(Math.random()*4294967296));
    for(let i=0;i<12;i++) t+=abc[rnd[i]%abc.length];
    o.token=t;
  }
  return o.token;
}
/* Dirección del informe en línea de esta orden */
function urlInforme(o){
  const base=(S.config.portalPaciente||'').replace(/\/paciente\/?$/,'').replace(/\/$/,'');
  if(!base)return '';
  return base+'/r/'+o.numero+'/'+tokenOrden(o);
}

   Documentan las condiciones en que se recibió la muestra, según lo que
   refiere el paciente. Se imprimen bajo el área correspondiente del informe.
   Convención del SGC: siempre "según refiere el paciente", porque la
   recolección no es supervisada por el laboratorio. */

/* Exámenes de bioquímica que SÍ requieren ayuno documentado.
   Quedan fuera vitaminas, electrolitos, marcadores cardíacos y hormonas:
   en esos el ayuno no condiciona la interpretación. */
const BQ_CON_AYUNO = ['GLUCO','COLES','COLE2','COLE3','COLNH','TRIGL','ACIDO','UREA',
  'CREAT','TOAT','TPAT','GGG','FOSFA','PROTE','ALBUM','BTDI','LDL','AMILA','LIPAS','COLIN'];

}
function ordenLlevaNotaAyuno(o){
  return (o.examenes||[]).some(e=>BQ_CON_AYUNO.includes(e.id));
}

/* Texto final de la nota de orina */
function textoNotaOrina(pa){
  if(!pa||!pa.orinaTipo)return '';
  if(pa.orinaTipo==='primera')
    return 'Muestra correspondiente a la primera orina de la mañana, chorro medio, '+
           'obtenida por micción espontánea según lo referido por el paciente. Recolección no supervisada.';
  if(pa.orinaTipo==='azar'){
    let t='Muestra de orina al azar (aleatoria), obtenida por micción espontánea en el momento '+
          'de la atención, según refiere el paciente.';
    const h=parseInt(pa.retH)||0, m=parseInt(pa.retM)||0;
    if(h||m){
      t+=' Paciente refiere un tiempo de retención en vejiga de '+
         (h?h+(h===1?' hora':' horas'):'')+
         ((h&&m)?' con ':'')+
         (m?String(m).padStart(2,'0')+(m===1?' minuto':' minutos'):'')+'.';
    }

  }
  if(pa.orinaTipo==='sonda')
    return 'Muestra obtenida por cateterismo vesical, recolectada por personal de salud.';
  if(pa.orinaTipo==='24h')
    return 'Muestra de orina de 24 horas, recolectada por el paciente según instrucciones entregadas. '+
           'Volumen total referido por el paciente.';
  return '';

    (h?h+(h===1?' hora':' horas'):'')+
    ((h&&m)?' con ':'')+
    (m?String(m).padStart(2,'0')+(m===1?' minuto':' minutos'):'')+'.';
}
