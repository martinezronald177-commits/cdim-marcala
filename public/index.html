 .pie-web{text-align:center;font-size:7.6pt;font-weight:700;color:#111;letter-spacing:1.5px;margin-top:5px}`;

function codigoIdentidad(p){
  // Formato institucional: PREFIJO-DDMM-AAAA-#####  (basado en fecha de nacimiento + correlativo del paciente)
  const pre=S.config.prefijoId||'CDIM';
  const corr=String(p.codigo||'').replace(/\D/g,'').padStart(5,'0');
  if(!p.fnac)return `${pre}-0000-0000-${corr}`;
  const [a,m,d]=p.fnac.split('-');
  return `${pre}-${d}${m}-${a}-${corr}`;
}
function horaLarga(f,h){
  if(!h)return fmtFecha(f);
  return `${fmtFecha(f)}  ${hora12(h)}`;
}
/* Reparte los exámenes en hojas según el modo elegido para esa orden:
   'area'      → una hoja por área (predeterminado)
   'continuo'  → todo seguido; el salto de página lo decide el contenido
   'examen'    → una hoja por examen
   'manual'    → el usuario marca en qué exámenes empieza hoja nueva */
function agruparHojas(o){
  const modo=o.layout||'area';
  const porGrupos=exs=>{
    const g=[];
    exs.forEach(e=>{
      const ar=e.area||'GENERAL';
      const ult=g[g.length-1];
      if(ult&&ult.area===ar)ult.exs.push(e); else g.push({area:ar,exs:[e]});
    });
    return g;
  };
  if(modo==='continuo')return [porGrupos(o.examenes)];
  if(modo==='examen')return o.examenes.map(e=>[{area:e.area||'GENERAL',exs:[e]}]);
  if(modo==='manual'){
    const hojas=[];let actual=[];
    o.examenes.forEach((e,i)=>{
      if(i>0&&e.nuevaHoja){hojas.push(porGrupos(actual));actual=[];}
      actual.push(e);
    });
    if(actual.length)hojas.push(porGrupos(actual));
    return hojas.length?hojas:[porGrupos(o.examenes)];
  }
  // Por área: se respeta el orden de aparición de las áreas
  const areas={};
  o.examenes.forEach(e=>{(areas[e.area||'GENERAL']=areas[e.area||'GENERAL']||[]).push(e);});
  return Object.entries(areas).map(([area,exs])=>[{area,exs}]);
}
function imprimirResultados(n){
  // Admite el número de una orden real o un objeto de muestra (vista previa de plantillas)
  const o=(typeof n==='object'&&n)?n:S.ordenes.find(x=>x.numero===n);
  if(!o){toast('Orden no encontrada');return;}
  const p=o._pac||S.pacientes.find(x=>x.codigo===o.pacCodigo)||{};
  const sx=p.sexo||'';
  const em=edadEnMeses(p.fnac,o.fecha);
  const c=S.config;
  const alertas=alertasOrden(o);
  if(!capturaImp&&c.alertas.bloquearPDF&&o.estado!=='Validada'&&o.estado!=='Entregada'){
    if(!confirm('Esta orden aún NO ha sido validada.\n\nSe imprimirá con la marca "PRELIMINAR – NO VALIDADO".\n\n¿Continuar de todos modos?'))return;
  }
  const preliminar=(o.estado!=='Validada'&&o.estado!=='Entregada');
  const hojas=agruparHojas(o);
  const totalPag=hojas.length;

  const cabecera=(np)=>`
  <div class="cab">
    <div class="cab-logo">${c.logo?`<img src="${c.logo}">`:`<div class="cab-nom">${esc(c.nombre)}</div>`}</div>
    <div class="cab-datos">
      <div>&#9906; <b>DIRECCIÓN:</b> ${esc((c.direccion||'').toUpperCase())}</div>
      <div class="ln-contacto">&#9743; <b>CONTACTO:</b> ${esc(c.whatsapp)}${c.telefono2?' / '+esc(c.telefono2):''}${c.correo?'&nbsp;&nbsp;&#9993; '+esc(c.correo):''}</div>
    </div>
    <div class="cab-prof">
      <div class="prof-n">${esc(c.profesional||c.regente)}</div>
      <div class="prof-t">${esc(c.profesionalTitulo||'Microbiólogo y Químico Clínico')}</div>
      <div class="prof-t">${esc(c.colegiacion)}</div>
    </div>
  </div>
  <div class="barra">
    <span><b>Orden de trabajo #:</b> ${o.numero}</span>
    <span><b>Fecha Orden:</b> ${horaLarga(o.fecha,o.hora||'')}</span>
    <span><b>Fecha Informe:</b> ${o.fechaValidacion
      ? fmtFecha(o.fechaValidacion)+(o.horaValidacion?' '+hora12(o.horaValidacion):'')
      : '<i>Pendiente de validación</i>'}</span>
    <span><b>Página:</b> ${np} de ${totalPag}</span>
  </div>
  <div class="pac">
    <div class="pac-campos">
      <div><span class="et">Paciente:</span> <b>${esc((o.pacienteNombre||'').toUpperCase())}</b></div>
      <div><span class="et">Identificación:</span> <b>${p.idTipo==='DNI'?esc(p.idNumero||'—'):esc(codigoIdentidad(p))}</b></div>
      <div><span class="et">Médico:</span> <b>${esc((p.medico||'N/A').toUpperCase())}</b></div>
      <div><span class="et">Expediente:</span> <b>${esc(codigoIdentidad(p))}</b></div>
      <div><span class="et">F. Nacimiento:</span> <b>${p.fnac?fmtFecha(p.fnac):'—'}</b> &nbsp; <span class="et">Género:</span> <b>${sexoTexto(sx)}</b></div>
      <div><span class="et">Teléfono:</span> <b>${esc(p.tel||'—')}</b></div>
      <div><span class="et">Edad:</span> <b>${edadDetallada(p.fnac)}</b></div>
      <div><span class="et">F. Recibido:</span> <b>${fmtFecha(o.fecha)}${o.hora?' '+hora12(o.hora):''}</b></div>
      <div class="ancho"><span class="et">F. Resultado:</span> <b>${o.fechaValidacion
        ? fmtFecha(o.fechaValidacion)+(o.horaValidacion?' '+hora12(o.horaValidacion):'')
        : '—'}</b></div>
      ${(p.fnac&&esMenor(p.fnac)&&p.respNombre)?`<div class="ancho"><span class="et">Responsable:</span> <b>${esc(p.respNombre)}</b>${p.respParentesco?' ('+esc(p.respParentesco)+')':''}${p.respId?' · '+esc(p.respId):''}</div>`:''}
    </div>
    <div class="pac-cb">${(c.portalPaciente&&!preliminar)?`
      ${qrSVG(urlInforme(o),74,1)}
      <div class="qr-pie">Escanea este QR para<br>validar el reporte en línea</div>`:''}</div>
  </div>`;

  const firma=`
  <div class="firma-bloque">
    <div class="firma-zona">
      ${c.firma?`<img src="${c.firma}" class="img-firma">`:'<div style="height:40px"></div>'}
      ${(c.sello&&!preliminar)?`<img src="${c.sello}" class="img-sello">`:''}
      <div class="linea-firma"></div>
    </div>
    <div class="firma-nom">${esc(o.validadoPor||c.regente)}</div>
    <div class="firma-sub">Microbiólogo Regente · ${esc(c.colegiacion)}</div>
    <div class="firma-sub">${o.fechaValidacion
      ? 'Validado electrónicamente: '+fmtFecha(o.fechaValidacion)+(o.horaValidacion?' a las '+hora12(o.horaValidacion):'')
      : 'Informe preliminar · sin validación'}</div>
  </div>`;

  /* Código QR al portal del paciente. Solo lleva la dirección: allá el paciente
     se identifica con su número de identidad y su fecha de nacimiento.
     Nunca se codifican datos personales — un QR lo lee cualquier cámara. */

  const pie=`
  <div class="obs"><b>Observaciones:</b> ${o.notaInforme?fmtTexto(o.notaInforme):'Fecha de recepción de muestra: '+fmtFecha(o.fecha)+'. '+esc(c.anclaSGC)+'.'}</div>
  <div class="pie-inst">
    <div class="pie-serv">${esc(c.servicios||'')}</div>
    <div class="pie-dir" style="grid-template-columns:1fr 1fr">
      <div><b>${esc(c.nombre)}</b> · WhatsApp ${esc(c.whatsapp)}</div>
      <div style="text-align:right"><b>Horario:</b> ${esc(c.horario)}</div>
    </div>
  </div>`;

  // Compara nombre de examen y de parámetro para no repetir el mismo texto
  const igualNombre=(a,b)=>{
    const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\(.*?\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    const x=norm(a),y=norm(b);
    if(x===y||x.startsWith(y)||y.startsWith(x))return true;
    // También son "el mismo nombre" los sinónimos reconocidos:
    // "Hemoglobina A1C" y "HbA1c" no deben imprimirse como dos renglones distintos
    const sx=sinonimosDe(x);
    return sx.length>1&&sx.includes(y);
  };

  const html=hojas.map((grupos,idx)=>{
    const exsHoja=grupos.reduce((a,g)=>a.concat(g.exs),[]);
    const hayPrev=exsHoja.some(e=>e.params.some(pp=>valorPrevio(o.pacCodigo,e.id,pp.nombre,n)));
    const cols=hayPrev?5:4;
    const filaParametro=(pp,e,etiqueta)=>{
      const r=evalParam(pp,sx,em);const pvs=valoresPrevios(o.pacCodigo,e.id,pp.nombre,n,3);
      return `<tr class="${r.critico?'critico':''}">
        <td class="p-nom">${esc(etiqueta)}</td>
        <td class="p-val ${r.flag==='▲'?'alto':r.flag==='▼'?'bajo':(S.config.colorPositivos!==false&&evalCualitativo(pp)==='pos'?'positivo':'')}">${esc(pp.valor||'—')} ${r.flag}</td>
        <td class="p-uni">${esc(pp.unidad)}</td>
        <td class="p-ref">${fmtTexto(refTexto(pp,sx,em))}</td>
        ${hayPrev?`<td class="p-ant">${pvs.length?pvs.map(v=>esc(v.valor)+' <span class="fecha-ant">('+fmtFecha(v.fecha).slice(0,5)+')</span>').join('<br>'):'—'}</td>`:''}
      </tr>`;
    };
    const cuerpoDe=exs=>exs.map(e=>{
      // Panel extenso (alergia, etc.): mantiene su título y va a dos columnas
      if(e.params.length>=12&&!e.params.some(p=>p.grupo)){
        const enc=`<tr><th class="p-nom">${esc(e.tipoLista||'Análisis')}</th><th class="p-val">Resultado</th><th class="p-uni">Unidad</th><th class="p-ref">Referencia</th></tr>`;
        const mitad=Math.ceil(e.params.length/2);
        const tab=lista=>`<table><thead>${enc}</thead><tbody>${lista.map(pp=>{
          const r=evalParam(pp,sx,em);
          return `<tr class="${r.critico?'critico':''}"><td class="p-nom">${esc(pp.nombre)}</td>
          <td class="p-val ${r.flag==='▲'?'alto':r.flag==='▼'?'bajo':(S.config.colorPositivos!==false&&evalCualitativo(pp)==='pos'?'positivo':'')}">${esc(pp.valor||'—')} ${r.flag}</td>
          <td class="p-uni">${esc(pp.unidad)}</td><td class="p-ref">${fmtTexto(refTexto(pp,sx,em))}</td></tr>`;}).join('')}</tbody></table>`;
        return `<div class="ex-izq">${esc(e.nombre)}${e.metodo?` <span class="ex-met">· ${esc(e.metodo)}</span>`:''}</div>
          <div class="dos-col">${tab(e.params.slice(0,mitad))}${tab(e.params.slice(mitad))}</div>
          ${e.leyenda?`<div class="leyenda">${fmtTexto(e.leyenda)}</div>`:''}
          ${e.obs?`<div class="obs-ex"><b>Observación:</b> ${fmtTexto(e.obs)}</div>`:''}`;
      }
      const notaCalc=e.params.filter(p=>p.notaCalculo&&p.valor!=='').map(p=>p.notaCalculo);
      const filaObs=(e.obs||notaCalc.length)?`<tr><td colspan="${cols}"><div class="obs-ex">
        ${notaCalc.map(t=>esc(t)).join('<br>')}
        ${e.obs?(notaCalc.length?'<br>':'')+'<b>Observación:</b> '+fmtTexto(e.obs):''}
      </div></td></tr>`:'';
      // Subsecciones dentro del examen (EXAMEN MACROSCÓPICO, QUÍMICO, SEDIMENTO…)
      const tieneGrupos=e.params.some(p=>p.grupo);
      const hayMetodo=e.params.some(p=>p.metodo);
      // Layout especial para cultivos con antibiograma (microbiología)
      const MICRO_IDS = ['UROCU','UROC2','COPRO','CULTI','CSV','CSE','COROFA','KOH','CNASO','COIDO','COJO'];
      const esMicro = MICRO_IDS.includes(e.id) || /cultivo|urocultivo|koh|coprocu/i.test(e.nombre);
      if(esMicro){
        const ps = e.params;
        const grp = g => ps.filter(p => p.grupo === g);
        const grupos = [...new Set(ps.map(p => p.grupo).filter(Boolean))];
        // Detectar si hay resultado positivo para resaltar
        // Detectar microorganismo y recuento para construir el banner
        const microOrgP  = ps.find(p => /^microorganismo/i.test(p.nombre));
        const recuentoP  = ps.find(p => /^recuento/i.test(p.nombre));
        const desarrolloP= ps.find(p => /^desarrollo/i.test(p.nombre));
        // ¿Hay crecimiento positivo?
        const valorMicro = (microOrgP && microOrgP.valor) || '';
        const sinDesa    = /sin desarrollo|sin crecimiento|no aplica/i;
        const hayDesarrollo = valorMicro && !sinDesa.test(valorMicro);
        // Construir el texto del banner: "Se aisló Escherichia coli ≥ 100,000 UFC/mL"
        const textoBanner = (()=>{
          if(!hayDesarrollo) return '';
          const org = valorMicro;
          // Extraer el recuento si existe (ej. "≥ 100,000 UFC/mL — Significativo…")
          let recuento = '';
          const rVal = (recuentoP && recuentoP.valor) || (desarrolloP && desarrolloP.valor) || '';
          // Capturar la parte numérica del recuento antes del " —"
          const mRec = rVal.match(/^([^—]+)/);
          if(mRec) recuento = mRec[1].trim();
          // Formato final
          if(recuento && !/sin desarrollo|no significativo|dudoso/i.test(recuento)){
            return 'Se aisló ' + org + ' · ' + recuento;
          }
          return 'Se aisló ' + org;
        })();
        const html_grupos = grupos.map(g => {
          const campos = grp(g);
          // Los campos de notas de panel no se imprimen como filas
          const esNota = c => c.nombre.startsWith('—');
          const esAB   = c => Array.isArray(c.opciones) && c.opciones.includes('S - Sensible');
          // Tabla de antibiograma
          if(campos.some(esAB)){
            const notaPanel = campos.find(esNota);
            const abs = campos.filter(esAB);
            // Solo imprimir antibióticos con valor asignado (no vacíos)
            const abCon = abs.filter(a => a.valor && !/no probado/i.test(a.valor));
            if(!abCon.length) return '';
            // Agrupar por subgrupo farmacológico
            let grupoAct = null;
            const filas = abCon.map(a => {
              const isS = /^S/i.test(a.valor);
              const isI = /^I/i.test(a.valor);
              const isR = /^R/i.test(a.valor);
              const cls = isS?'ab-S':isI?'ab-I':isR?'ab-R':'ab-NA';
              const txt = isS?'S — Sensible':isI?'I — Intermedio':isR?'R — Resistente':'—';
              const grpRow = (a.grupo !== grupoAct) ? (grupoAct=a.grupo,
                `<tr><td colspan="2" class="ab-grupo">${esc(a.grupo)}</td></tr>`):'';
              return grpRow + `<tr><td class="ab-ab">${esc(a.nombre)}</td>
                <td class="ab-interp ${cls}">${txt}</td></tr>`;
            }).join('');
            return `<div class="area-sub-tit" style="margin:6pt 0 3pt;font-size:8pt;font-weight:800;color:#285068;letter-spacing:.5px">${esc(g)}</div>
              ${notaPanel?`<div class="leyenda" style="font-size:7.4pt;font-style:italic;margin-bottom:4pt">${esc(notaPanel.nombre.replace(/^— /,''))}</div>`:''}
              <table class="ab-tabla">
                <tr><th class="ab-ab">Antibiótico</th><th class="ab-interp">Interpretación (CLSI M100)</th></tr>
                ${filas}
              </table>`;
          }
          // Tabla de campos normales (resultado / microscopía)
          const camposNorm = campos.filter(c => !esNota(c) && !esAB(c));
          if(!camposNorm.length) return '';
          return `<div class="area-sub-tit" style="margin:6pt 0 3pt;font-size:8pt;font-weight:800;color:#285068;letter-spacing:.5px">${esc(g)}</div>
            <table style="width:100%;border-collapse:collapse;font-size:8.4pt">
              ${camposNorm.map(c => {
                const val = c.valor || '—';
                const sinDesarrollo = /sin desarrollo|negativo|no aplica|sin crecimiento/i.test(val);
                const esPos = !sinDesarrollo && val !== '—';
                return `<tr style="border-bottom:.3px solid #e0e0e0">
                  <td style="width:42%;padding:3pt 6pt;font-weight:600">${esc(c.nombre)}</td>
                  <td style="padding:3pt 6pt;${esPos?'font-weight:700;color:#1a1a1a':''}">${esc(val)}</td>
                </tr>`;
              }).join('')}
            </table>`;
        }).join('');
        return `<div class="ex-izq">${esc(e.nombre)}</div>
          ${e.metodo?`<div class="leyenda" style="font-style:italic;font-size:7.8pt;margin:2pt 0 5pt">${esc(e.metodo)}</div>`:''}
          ${hayDesarrollo?`<div class="nota-crit-micro">⚠ CRECIMIENTO POSITIVO — ${esc(textoBanner)}</div>`:''}
          ${html_grupos}
          ${e.leyenda?`<div class="leyenda" style="margin-top:6pt">${fmtTexto(e.leyenda)}</div>`:''}
          ${e.obs?`<div class="obs-ex"><b>Observaciones:</b> ${fmtTexto(e.obs)}</div>`:''}`;
      }
      // Layout especial para el Frotis de Sangre Periférica
      if(e.id==='FSP'||/frotis.*sangre/i.test(e.nombre)){
        const ps=e.params;
        const grp=g=>ps.filter(p=>p.grupo===g);
        const fval=p=>{
          if(!p.valor&&p.valor!=='0')return '';
          if(Array.isArray(p.opciones)&&p.opciones.length)return '•'+esc(p.valor)+'.';
          return esc(p.valor);
        };
        // Cada serie: nombre a la izquierda (rowspan), campo con dos puntos, valor a la derecha.
        // Sin líneas entre filas; solo separadores gruesos entre series.
        const htmlSerie=(titulo,campos)=>{
          if(!campos.length)return '';
          return campos.map((p,fi)=>{
            const esUlt=fi===campos.length-1;
            const campo=p.nombre.replace(/\s*\((eritro|leuco|plaquetas)\)\s*$/i,'');
            return '<tr class="ft-fila'+(esUlt?' ft-ult':'')+'">'
              +(fi===0?'<td class="ft-sec" rowspan="'+campos.length+'">'+titulo+'</td>':'')
              +'<td class="ft-campo">'+esc(campo)+':</td>'
              +'<td class="ft-val">'+fval(p)+'</td>'
              +'</tr>';
          }).join('');
        };
        const difPs=grp('CONTEO DIFERENCIAL');
        const notaDif=difPs.find(p=>/nota/i.test(p.nombre));
        const celDif=difPs.filter(p=>!/nota/i.test(p.nombre));
        const total=celDif.reduce((a,p)=>a+Number(p.valor||0),0);
        // El intervalo se imprime con el signo de porcentaje, como en el formato en papel
        const refPct=p=>{
          const t=refTexto(p,sx,em).replace(' – ',' - ');
          return /%/.test(t)?t:t+' %';
        };
        const difRows=celDif.map((p,idx)=>
          '<tr>'
          +'<td class="dif-tipo">'+esc(p.nombre)+'</td>'
          +'<td class="dif-ref">'+refPct(p)+'</td>'
          +'<td class="dif-res">'+(p.valor?p.valor+'%':'')+'</td>'
          +(idx===0?'<td class="dif-nota-td" rowspan="'+celDif.length+'">'+esc(notaDif&&notaDif.valor?notaDif.valor:'')+'</td>':'')
          +'</tr>').join('');
        const difHTML='<table class="dif-tabla">'
          +'<tr><td colspan="4" class="dif-titulo">Conteo Diferencial</td></tr>'
          +'<tr class="dif-cab">'
          +'<th class="dif-tipo">Tipo de Leucocito</th>'
          +'<th class="dif-ref">Valor de referencia</th>'
          +'<th class="dif-res">Resultado</th>'
          +'<th class="dif-nota-th">Nota:</th></tr>'
          +difRows
          +'<tr><td colspan="3" class="dif-total">'+(total>0?'<i>'+total+'%</i>':'')+'</td><td class="dif-vacia"></td></tr>'
          +'</table>';
        const encabezado='<div class="frotis-analisis-lbl">ANÁLISIS:</div>'
          +'<div class="frotis-analisis-nom">'+esc(e.nombre)+'</div>';
        const notaPie='<div class="frotis-nota-pie"><b>Nota:</b>&nbsp;<span style="display:inline-block;border-bottom:.5px solid #999;width:80%">&nbsp;</span></div>';
        return encabezado
          +'<table class="frotis-tbl">'
          +'<tbody class="ft-bloque">'+htmlSerie('SERIE ERITROCITARIA',grp('SERIE ERITROCITARIA'))+'</tbody>'
          +'<tbody class="ft-bloque">'+htmlSerie('SERIE LEUCOCITARIA', grp('SERIE LEUCOCITARIA'))+'</tbody>'
          +'<tbody class="ft-bloque">'+htmlSerie('SERIE PLAQUETARIA',  grp('SERIE PLAQUETARIA'))+'</tbody>'
          +'</table>'
          +difHTML
          +notaPie
          +(e.obs?'<div class="obs-ex"><b>Observaciones:</b> '+fmtTexto(e.obs)+'</div>':'');
      }


      if(tieneGrupos){
        let gAct=null;
        const filas=e.params.map(pp=>{
          const r=evalParam(pp,sx,em);
          const cab=(pp.grupo&&pp.grupo!==gAct)?(gAct=pp.grupo,
            `<tr class="fila-grupo"><td colspan="${hayMetodo?5:4}">${esc(pp.grupo)}</td></tr>`):'';
          return cab+`<tr class="${r.critico?'critico':''}">
            <td class="p-nom">${esc(pp.nombre)}</td>
            <td class="p-val ${r.flag==='▲'?'alto':r.flag==='▼'?'bajo':(S.config.colorPositivos!==false&&evalCualitativo(pp)==='pos'?'positivo':'')}">${esc(pp.valor||'—')} ${r.flag}</td>
            <td class="p-uni">${esc(pp.unidad)}</td>
            <td class="p-ref">${fmtTexto(refTexto(pp,sx,em))}</td>
            ${hayMetodo?`<td class="p-met">${esc(pp.metodo||'')}</td>`:''}
          </tr>`;
        }).join('');
        return `<div class="ex-izq">${esc(e.nombre)}${e.metodo?` <span class="ex-met">· ${esc(e.metodo)}</span>`:''}</div>
          <table class="res ${e.params.length>=22?'compacta':''}">
            <thead><tr><th class="p-nom">${esc(e.tipoLista||'Análisis')}</th><th class="p-val">Resultado</th>
              <th class="p-uni">Unidad</th><th class="p-ref">Intervalo de referencia</th>
              ${hayMetodo?'<th class="p-met">Método</th>':''}</tr></thead>
            <tbody>${filas}</tbody></table>
          ${e.leyenda?`<div class="leyenda">${fmtTexto(e.leyenda)}</div>`:''}
          ${e.obs?`<div class="obs-ex"><b>Observaciones:</b> ${fmtTexto(e.obs)}</div>`:''}`;
      }
      // Examen de un solo parámetro con el mismo nombre → una sola fila, sin repetir el título
      if(e.params.length===1&&igualNombre(e.nombre,e.params[0].nombre)){
        return `<tbody class="grupo">${filaParametro(e.params[0],e,e.nombre)}
          ${e.metodo?`<tr><td colspan="${cols}" class="met-fila">Método: ${esc(e.metodo)}</td></tr>`:''}
          ${e.leyenda?`<tr><td colspan="${cols}"><div class="leyenda">${fmtTexto(e.leyenda)}</div></td></tr>`:''}
          ${filaObs}</tbody>`;
      }
      // Examen con varios parámetros → nombre a la izquierda como subtítulo de grupo
      return `<tbody class="grupo">
        <tr class="fila-ex"><td colspan="${cols}"><span class="ex-izq-in">${esc(e.nombre)}</span>${e.metodo?`<span class="ex-met"> · ${esc(e.metodo)}</span>`:''}</td></tr>
        ${e.params.map(pp=>filaParametro(pp,e,pp.nombre)).join('')}
        ${e.leyenda?`<tr><td colspan="${cols}"><div class="leyenda">${fmtTexto(e.leyenda)}</div></td></tr>`:''}
        ${filaObs}</tbody>`;
    }).join('');
    // Cada grupo de área imprime su título, su tabla y su observación de sección
    const secciones=grupos.map((g,gi)=>{
      const conPanel=g.exs.some(e=>e.params.length>=12);
      const cuerpo=cuerpoDe(g.exs);
      const tabla=conPanel?cuerpo:`<table class="res">
        <thead><tr><th class="p-nom">Análisis</th><th class="p-val">Resultado</th><th class="p-uni">Unidad</th><th class="p-ref">Valores de referencia</th>${hayPrev?'<th class="p-ant">Anteriores</th>':''}</tr></thead>
        ${cuerpo}</table>`;
      // La observación del área se imprime en la última hoja donde aparece esa área
      const ultimaDeEsaArea=!hojas.slice(idx+1).some(hh=>hh.some(x=>x.area===g.area));
      const obsArea=ultimaDeEsaArea?((o.obsAreas&&o.obsAreas[g.area]||'').trim()):'';
      // Condiciones de la muestra referidas por el paciente: van bajo su área
      const pa=o.preAnalitica||{};
      let notaPre='';
      if(ultimaDeEsaArea){
        const idsArea=(g.exs||[]).map(x=>x.id);
        if(idsArea.some(id=>EX_ORINA.includes(id)))       notaPre=textoNotaOrina(pa);
        else if(idsArea.some(id=>BQ_CON_AYUNO.includes(id))) notaPre=textoNotaAyuno(pa);
      }
      return `<div class="area ${gi>0?'area-sig':''}">${esc(g.area.toUpperCase())}</div>
        ${tabla}
        ${notaPre?`<div class="nota-pre">${esc(notaPre)}</div>`:''}
        ${obsArea?`<div class="obs-area"><b>Observaciones de ${esc(g.area)}:</b> ${fmtTexto(obsArea)}</div>`:''}`;
    }).join('');
    return `<div class="hoja">
      ${cabecera(idx+1)}
      ${o._demo?'<div class="marca-demo">MUESTRA DE PLANTILLA · DOCUMENTO SIN VALIDEZ CLÍNICA · DATOS FICTICIOS</div>':''}
      ${(idx===0&&preliminar&&!o._demo)?'<div class="marca-prelim">INFORME PRELIMINAR · NO VALIDADO POR EL PROFESIONAL · USO INTERNO — NO ENTREGAR AL PACIENTE</div>':''}
      ${idx===0&&alertas.length?`<div class="nota-crit">⚠ VALORES CRÍTICOS: ${alertas.map(esc).join(' · ')} — Notificado al médico tratante.</div>`:''}
      ${secciones}

      ${firma}
      ${pie}
    </div>`;
  }).join('');
  ventanaImpresion(html,cssInforme,nombreDeOrden(o,'Resultados'));
}

  const c=S.config;
  const ancho=(c.sobreAncho||216)+'mm', alto=(c.sobreAlto||279)+'mm';
  const html=`
  <div class="sobre" style="--anchoS:${ancho};--altoS:${alto}">
    <div class="marco"></div>

      <div class="s-logo">${c.logo?`<img src="${c.logo}">`:`<div class="s-nom">${esc(c.nombre)}</div>`}</div>
      <div class="s-cdatos">
        <div>&#9906; <b>DIRECCIÓN:</b> ${esc((c.direccion||'').toUpperCase())}</div>
        <div class="ln-contacto">&#9743; <b>CONTACTO:</b> ${esc(c.whatsapp)}${c.telefono2?' / '+esc(c.telefono2):''}${c.correo?'&nbsp;&nbsp;&#9993; '+esc(c.correo):''}</div>
      </div>
      <div class="s-cprof">
        <div class="n">${esc(c.profesional||c.regente)}</div>
        <div class="t">${esc(c.profesionalTitulo||'Microbiólogo y Químico Clínico')}</div>
        <div class="t">${esc(c.colegiacion)}</div>
      </div>
    </div>
    <div class="s-lema">${esc(c.lema||'Servicio de Laboratorio Clínico')}</div>
    <div class="s-tit">RESULTADOS DE LABORATORIO CLÍNICO</div>
    <div class="s-caja">
      <div class="s-et">Paciente</div>
      <div class="s-paciente">${esc(o.pacienteNombre)}</div>
      <div class="s-datos">
        <div><span class="s-et">Identificación</span><br><b>${esc(p.idNumero||idPaciente(p))}</b></div>

function enLetras(num){
  const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
  const D=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const ent=Math.floor(num),cent=Math.round((num-ent)*100);
  const tres=n=>{
    if(n===0)return '';if(n<=20)return U[n];
    if(n<100){const d=Math.floor(n/10),u=n%10;if(d===2)return 'veinti'+U[u];return D[d]+(u?' y '+U[u]:'');}
    if(n===100)return 'cien';
    return C[Math.floor(n/100)]+(n%100?' '+tres(n%100):'');
  };
  let t='';
  if(ent>=1000){const mil=Math.floor(ent/1000);t=(mil===1?'mil':tres(mil)+' mil')+(ent%1000?' '+tres(ent%1000):'');}
  else t=tres(ent);
  // "un lempira", no "uno lempira"; "veintiún", "treinta y un"…
  t=t.replace(/\buno$/,'un').replace(/\bveintiuno$/,'veintiún');
  return (t.charAt(0).toUpperCase()+t.slice(1))+(ent===1?' lempira':' lempiras')+' con '+String(cent).padStart(2,'0')+'/100';
}

function igualNombreHT(a,b){
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\(.*?\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const x=norm(a),y=norm(b);
  if(!y)return false;
  if(x===y||x.startsWith(y)||y.startsWith(x))return true;
  const s=sinonimosDe(x);
  return s.length>1&&s.includes(y);
}
/* =============== CÓDIGO QR ===============
   Generador propio, sin librerías externas: el informe se imprime igual
   aunque el laboratorio esté sin internet.
   Implementa QR modelo 2, corrección de errores nivel M, modo byte.
   Referencia: ISO/IEC 18004. */

/* --- Campo de Galois GF(256) para la corrección de errores --- */
const QR_EXP = new Uint8Array(512), QR_LOG = new Uint8Array(256);
(function(){
  let x = 1;
  for(let i = 0; i < 255; i++){
    QR_EXP[i] = x;
    QR_LOG[x] = i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11d;      // polinomio generador del estándar
  }
  for(let i = 255; i < 512; i++) QR_EXP[i] = QR_EXP[i - 255];
})();
const qrMul = (a,b) => (a === 0 || b === 0) ? 0 : QR_EXP[QR_LOG[a] + QR_LOG[b]];

/* Polinomio generador para n bytes de corrección */
function qrGenPoly(n){
  let p = [1];
  for(let i = 0; i < n; i++){
    const q = [1, QR_EXP[i]], r = new Array(p.length + 1).fill(0);
    for(let j = 0; j < p.length; j++)
      for(let k = 0; k < 2; k++) r[j+k] ^= qrMul(p[j], q[k]);
    p = r;
  }
  return p;
}
/* Bytes de corrección de un bloque de datos */
function qrEC(datos, n){
  const gen = qrGenPoly(n);
  const res = new Array(datos.length + n).fill(0);
  datos.forEach((b,i) => res[i] = b);
  for(let i = 0; i < datos.length; i++){
    const c = res[i];
    if(c === 0) continue;
    for(let j = 0; j < gen.length; j++) res[i+j] ^= qrMul(gen[j], c);
  }
  return res.slice(datos.length);
}

/* Capacidad y estructura por versión, nivel de corrección M.
   [total de bytes, bytes de corrección por bloque, bloques grupo 1, bytes grupo 1,
    bloques grupo 2, bytes grupo 2] */
const QR_VER = {
  1:[26,10,1,16,0,0],    2:[44,16,1,28,0,0],    3:[70,26,1,44,0,0],
  4:[100,18,2,32,0,0],   5:[134,24,2,43,0,0],   6:[172,16,4,27,0,0],
  7:[196,18,4,31,0,0],   8:[242,22,2,38,2,39],  9:[292,22,3,36,2,37],
  10:[346,26,4,43,1,44], 11:[404,30,1,50,4,51], 12:[466,22,6,36,2,37],
};
/* Posición de los patrones de alineación por versión */
const QR_ALIN = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
  7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50],11:[6,30,54],12:[6,32,58]};

/* Genera la matriz del QR. Devuelve un arreglo de arreglos con 0 y 1. */
function qrMatriz(texto){
  const bytes = Array.from(new TextEncoder().encode(texto));

  // 1. Elegir la versión más pequeña donde quepa
  let ver = 0;
  for(let v = 1; v <= 12; v++){
    const [tot, ec, b1, d1, b2, d2] = QR_VER[v];
    if(bytes.length + 2 <= b1*d1 + b2*d2){ ver = v; break; }
  }
  if(!ver) throw new Error('El texto es demasiado largo para el código QR');
  const [total, ecPorBloque, bloques1, datos1, bloques2, datos2] = QR_VER[ver];
  const capacidad = bloques1*datos1 + bloques2*datos2;

  // 2. Armar la secuencia de bits: modo byte + longitud + datos
  let bits = '';
  bits += '0100';                                        // modo byte
  bits += bytes.length.toString(2).padStart(8, '0');     // longitud (versiones 1-9)
  bytes.forEach(b => bits += b.toString(2).padStart(8, '0'));
  bits += '0000';                                        // terminador
  bits = bits.slice(0, capacidad * 8);
  while(bits.length % 8) bits += '0';
  const relleno = [0xEC, 0x11];
  let i = 0;
  while(bits.length < capacidad * 8){
    bits += relleno[i++ % 2].toString(2).padStart(8, '0');
  }
  const datos = [];
  for(let k = 0; k < bits.length; k += 8) datos.push(parseInt(bits.substr(k,8), 2));

  // 3. Repartir en bloques y calcular la corrección de cada uno
  const gruposD = [], gruposE = [];
  let pos = 0;
  for(let b = 0; b < bloques1; b++){ gruposD.push(datos.slice(pos, pos+datos1)); pos += datos1; }
  for(let b = 0; b < bloques2; b++){ gruposD.push(datos.slice(pos, pos+datos2)); pos += datos2; }
  gruposD.forEach(g => gruposE.push(qrEC(g, ecPorBloque)));

  // 4. Intercalar: primero los datos, después la corrección
  const finales = [];
  const maxD = Math.max(datos1, datos2);
  for(let c = 0; c < maxD; c++)
    gruposD.forEach(g => { if(c < g.length) finales.push(g[c]); });
  for(let c = 0; c < ecPorBloque; c++)
    gruposE.forEach(g => finales.push(g[c]));

  // 5. Dibujar la matriz
  const n = 17 + ver*4;
  const m = Array.from({length:n}, () => new Array(n).fill(null));
  const res = Array.from({length:n}, () => new Array(n).fill(false));  // celdas reservadas

  const patronBusqueda = (fy, fx) => {
    for(let y = -1; y <= 7; y++) for(let x = -1; x <= 7; x++){
      const py = fy+y, px = fx+x;
      if(py < 0 || py >= n || px < 0 || px >= n) continue;
      const dentro = (y >= 0 && y <= 6 && (x === 0 || x === 6)) ||
                     (x >= 0 && x <= 6 && (y === 0 || y === 6)) ||
                     (y >= 2 && y <= 4 && x >= 2 && x <= 4);
      m[py][px] = dentro ? 1 : 0;
      res[py][px] = true;
    }
  };
  patronBusqueda(0, 0); patronBusqueda(0, n-7); patronBusqueda(n-7, 0);

  // Patrones de alineación
  const al = QR_ALIN[ver];
  al.forEach(ay => al.forEach(ax => {
    if((ay <= 8 && ax <= 8) || (ay <= 8 && ax >= n-9) || (ay >= n-9 && ax <= 8)) return;
    for(let y = -2; y <= 2; y++) for(let x = -2; x <= 2; x++){
      m[ay+y][ax+x] = (Math.abs(y) === 2 || Math.abs(x) === 2 || (y === 0 && x === 0)) ? 1 : 0;
      res[ay+y][ax+x] = true;
    }
  }));

  // Líneas de sincronización
  for(let k = 8; k < n-8; k++){
    if(!res[6][k]){ m[6][k] = (k % 2 === 0) ? 1 : 0; res[6][k] = true; }
    if(!res[k][6]){ m[k][6] = (k % 2 === 0) ? 1 : 0; res[k][6] = true; }
  }
  m[n-8][8] = 1; res[n-8][8] = true;        // módulo siempre oscuro

  // Reservar el área del formato
  for(let k = 0; k <= 8; k++){
    if(!res[8][k]){ res[8][k] = true; m[8][k] = 0; }
    if(!res[k][8]){ res[k][8] = true; m[k][8] = 0; }
  }
  for(let k = n-8; k < n; k++){
    if(!res[8][k]){ res[8][k] = true; m[8][k] = 0; }
    if(!res[k][8]){ res[k][8] = true; m[k][8] = 0; }
  }

  // 6. Colocar los datos en zigzag desde abajo a la derecha
  let bitPos = 0;
  const bitsFinales = finales.map(b => b.toString(2).padStart(8,'0')).join('');
  let arriba = true;
  for(let col = n-1; col > 0; col -= 2){
    if(col === 6) col--;                    // la columna 6 es de sincronización
    for(let f = 0; f < n; f++){
      const fila = arriba ? n-1-f : f;
      for(let d = 0; d < 2; d++){
        const c = col - d;
        if(res[fila][c]) continue;
        m[fila][c] = (bitPos < bitsFinales.length && bitsFinales[bitPos] === '1') ? 1 : 0;
        bitPos++;
      }
    }
    arriba = !arriba;
  }

  // 7. Aplicar la máscara 0 y escribir la información de formato
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    if(res[y][x]) continue;
    if((y + x) % 2 === 0) m[y][x] ^= 1;     // máscara 000
  }
  // Formato: nivel M (00) + máscara 000, con su código BCH
  const formato = 0x5412 ^ 0x0000;          // valor precalculado para M/máscara 0
  const fBits = formato.toString(2).padStart(15,'0');
  const posF1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
                 [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  posF1.forEach(([y,x],i) => m[y][x] = +fBits[i]);
  const posF2 = [[n-1,8],[n-2,8],[n-3,8],[n-4,8],[n-5,8],[n-6,8],[n-7,8],
                 [8,n-8],[8,n-7],[8,n-6],[8,n-5],[8,n-4],[8,n-3],[8,n-2],[8,n-1]];
  posF2.forEach(([y,x],i) => m[y][x] = +fBits[i]);
  m[n-8][8] = 1;

  return m.map(f => f.map(v => v ? 1 : 0));
}

/* Dibuja el QR como SVG. Vectorial: nítido en pantalla y en papel. */
function qrSVG(texto, tam, margen){
  tam = tam || 96; margen = margen === undefined ? 2 : margen;
  let m;
  try{ m = qrMatriz(texto); }
  catch(e){ return '<!-- QR no generado: '+e.message+' -->'; }
  const n = m.length, total = n + margen*2;
  let d = '';
  for(let y = 0; y < n; y++){
    let x = 0;
    while(x < n){
      if(!m[y][x]){ x++; continue; }
      let ancho = 0;
      while(x + ancho < n && m[y][x+ancho]) ancho++;   // agrupa módulos seguidos
      d += `M${x+margen} ${y+margen}h${ancho}v1h-${ancho}z`;
      x += ancho;
    }
  }
  return `<svg viewBox="0 0 ${total} ${total}" width="${tam}" height="${tam}" 
    shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <rect width="${total}" height="${total}" fill="#fff"/>
    <path d="${d}" fill="#000"/></svg>`;
}

/* Los exámenes de estas áreas que no tengan regla propia llevan ayuno de 8 h */
const AREAS_AYUNO = ['Bioquímica Clínica'];

function instructivoDe(examenId, area){
  const id = INSTRUCTIVO_POR_EXAMEN[examenId];
  if(id && INSTRUCTIVOS[id]) return INSTRUCTIVOS[id];
  if(AREAS_AYUNO.includes(area)) return INSTRUCTIVOS.AYUNO8;
  return INSTRUCTIVOS.SIN_PREP;
}

/* Reúne los instructivos que aplican a una orden, sin repetir.
   Si hay varios ayunos, gana el más estricto. */
function instructivosDeOrden(o){
  const vistos = new Map();
  (o.examenes||[]).forEach(e=>{
    const ins = instructivoDe(e.id, e.area);
    if(!vistos.has(ins.id)) vistos.set(ins.id, {ins, examenes:[]});
    vistos.get(ins.id).examenes.push(e.nombre);
  });
  let lista = [...vistos.values()];
  // Una sola hoja de ayuno: gana la más restrictiva.
  // Tiroides va primero porque además del ayuno exige horario.
  const ayunos = ['TIROIDES','AYUNO12','AYUNO8','GLUCOSA_SOLA'];
  const presentes = ayunos.filter(a=>vistos.has(a));
  if(presentes.length>1){
    const gana = presentes[0];
    const otros = presentes.slice(1);
    const todos = otros.flatMap(a=>vistos.get(a).examenes);
    lista = lista.filter(x=>!otros.includes(x.ins.id));
    const g = lista.find(x=>x.ins.id===gana);
    if(g) g.examenes = [...g.examenes, ...todos];
  }
  // "Sin preparación" va al final
  return lista.sort((a,b)=> (a.ins.id==='SIN_PREP'?1:0) - (b.ins.id==='SIN_PREP'?1:0));
}

/* Una hoja de instructivo */
function hojaInstructivo(bloque, o, pac, np, totalPag){
  const {ins, examenes} = bloque;
  const c = S.config;
  // Barra y datos del paciente: mismo formato que el informe de resultados
  const barra = o ? `
  <div class="barra">
    <span><b>Orden de trabajo #:</b> ${esc(o.numero)}</span>
    <span><b>Fecha Orden:</b> ${fmtFecha(o.fecha)}</span>
    <span><b>Instructivo entregado:</b> ${fmtFecha(hoy())}</span>
    ${totalPag>1?`<span><b>Página:</b> ${np} de ${totalPag}</span>`:''}
  </div>` : '';
  const datosPac = (o&&pac&&pac.codigo) ? `
  <div class="pac">
    <div class="pac-campos">
      <div><span class="et">Nombre:</span> <b>${esc(pac.nombre)}</b></div>
      <div><span class="et">N° Identidad:</span> ${esc(pac.idNumero||'—')}</div>
      <div><span class="et">Expediente:</span> ${esc(codigoIdentidad(pac))}</div>
      <div><span class="et">Sexo:</span> ${sexoTexto(pac.sexo||'')}</div>
      <div><span class="et">Fecha de nacimiento:</span> ${pac.fnac?fmtFecha(pac.fnac):'—'}</div>
      <div><span class="et">Edad:</span> ${edadDetallada(pac.fnac)}</div>
      <div style="grid-column:1/-1"><span class="et">Remitente:</span> ${esc(pac.medico||'N/A')}</div>
    </div>
  </div>` : '';
  // Cabecera institucional: la misma del informe de resultados
  const cabecera = `
  <div class="cab">
    <div class="cab-logo">${c.logo?`<img src="${c.logo}">`:`<div class="cab-nom">${esc(c.nombre)}</div>`}</div>
    <div class="cab-datos">
      <div>&#9906; <b>DIRECCIÓN:</b> ${esc((c.direccion||'').toUpperCase())}</div>
      <div class="ln-contacto">&#9743; <b>CONTACTO:</b> ${esc(c.whatsapp)}${c.telefono2?' / '+esc(c.telefono2):''}${c.correo?'&nbsp;&nbsp;&#9993; '+esc(c.correo):''}</div>
    </div>
    <div class="cab-prof">
      <div class="prof-n">${esc(c.profesional||c.regente)}</div>
      <div class="prof-t">${esc(c.profesionalTitulo||'Microbiólogo y Químico Clínico')}</div>
      <div class="prof-t">${esc(c.colegiacion)}</div>
    </div>
  </div>`;
  return `<div class="hoja ${ins.color||''}">
    ${cabecera}
    ${barra}
    ${datosPac}
    <div class="ins-area">Instructivo de preparación</div>
    <div class="ins-tit">
      ${PICTO[ins.picto]||''}
      <h2>${esc(ins.titulo)}</h2>
    </div>
    ${examenes&&examenes.length?`<div class="ins-examenes">
      <b>Para estos exámenes:</b> ${examenes.map(esc).join(' · ')}
    </div>`:''}
    <div class="ins-resumen">${ins.resumen}</div>
    ${ins.pasos.map((p,i)=>`<div class="ins-paso">
      <div class="ins-num">${i+1}</div>
      ${PICTO[p.picto]||''}
      <div class="ins-txt">${p.txt}</div>
    </div>`).join('')}
    ${ins.avisos&&ins.avisos.length?`<div class="ins-avisos">
      <h3>Tenga en cuenta</h3>
      <ul>${ins.avisos.map(a=>`<li>${a}</li>`).join('')}</ul>
    </div>`:''}
    <div class="ins-dudas">
      <b>¿Le quedó alguna duda?</b> Llámenos o escríbanos por WhatsApp al
      <b>${esc(c.whatsapp||'9758-9992')}</b> y con gusto le explicamos.
    </div>
    <div class="obs"><b>Observaciones:</b> Siga estas indicaciones para que su resultado sea confiable.
      Si no pudo cumplir alguna, avísenos al llegar: podemos ajustar la interpretación o reprogramar la toma.</div>
    <div class="pie-inst">
      <div class="pie-serv">${esc(c.servicios||'')}</div>
      <div class="pie-dir" style="grid-template-columns:1fr 1fr">
        <div><b>${esc(c.nombre)}</b> · WhatsApp ${esc(c.whatsapp)}</div>
        <div style="text-align:right"><b>Horario:</b> ${esc(c.horario)}</div>
      </div>
    </div>
  </div>`;
}

/* Instructivos de una orden completa */
function imprimirInstructivos(n){
  const o = S.ordenes.find(x=>x.numero===n);
  if(!o){toast('Orden no encontrada');return;}
  const pac = S.pacientes.find(x=>x.codigo===o.pacCodigo)||{};
  const bloques = instructivosDeOrden(o);
  if(!bloques.length){toast('Esta orden no tiene exámenes');return;}
  ventanaImpresion(bloques.map((b,i)=>hojaInstructivo(b,o,pac,i+1,bloques.length)).join(''),
    cssInstructivo(), nombreDeOrden(o,'Instructivo'));
}

/* Un instructivo suelto, para tenerlo impreso en recepción */
function imprimirInstructivoSuelto(idIns){
  const ins = INSTRUCTIVOS[idIns];
  if(!ins){toast('Instructivo no encontrado');return;}
  ventanaImpresion(hojaInstructivo({ins,examenes:[]},null,null,1,1), cssInstructivo(),
    nombreArchivo('Instructivo',ins.titulo,hoy()));
}

/* Todos los instructivos juntos, para el archivo del SGC */
function imprimirTodosInstructivos(){
  const todos=Object.values(INSTRUCTIVOS);

    cssInstructivo(), nombreArchivo('Instructivos_de_preparacion',hoy()));
}

/* =============== ETIQUETAS 57 × 32 mm (horizontal) =============== */
const cssEtiqueta=`
 @page{size:57mm 32mm;margin:0}
 body{margin:0;font-family:ui-monospace,'SFMono-Regular','DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,'Courier New',monospace;-webkit-font-smoothing:antialiased}
 .et{width:57mm;height:32mm;padding:1.5mm 2mm;box-sizing:border-box;page-break-after:always;overflow:hidden;display:flex;flex-direction:column}
 .et:last-child{page-break-after:auto}

 .n-xl{font-size:8.2pt}.n-lg{font-size:7.4pt}.n-md{font-size:6.7pt}.n-sm{font-size:6.1pt}.n-xs{font-size:5.5pt}
 .et-datos{font-weight:700;margin-top:0.4mm;white-space:nowrap;overflow:hidden}
 .d-lg{font-size:5.9pt}.d-md{font-size:5.4pt}.d-sm{font-size:4.9pt}.d-xs{font-size:4.5pt}
 .et-datos2{font-size:5.5pt;font-weight:600;white-space:nowrap;overflow:hidden}
 .et-tubo{font-size:6.1pt;font-weight:800;margin-top:0.3mm;line-height:1.12;
   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .et-pie{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:1.5mm;flex:0 0 auto}
 svg.codigo{width:29mm;height:7.5mm}
 .et-ot{font-size:6.8pt;font-weight:800;text-align:right;line-height:1.1;white-space:nowrap}`;
function claseNombre(txt){
  const n=txt.length;
  // Dos líneas de ~26 caracteres a 8.2pt; se reduce progresivamente si no cabe
  if(n<=28)return 'n-xl';
  if(n<=36)return 'n-lg';
  if(n<=46)return 'n-md';
  if(n<=58)return 'n-sm';
  return 'n-xs';
}
function nombreEtiqueta(p,respaldo){
  // Formato de laboratorio: APELLIDOS, Nombres — el apellido nunca se pierde
  if(!p||!p.apellido1)return (respaldo||'').toUpperCase();
  const ape=[p.apellido1,p.apellido2].filter(Boolean).join(' ');
  const nom=[p.nombre1,p.nombre2].filter(Boolean).join(' ');
  return (ape+', '+nom).toUpperCase();
}
function etiquetasDeOrden(o){
  const p=S.pacientes.find(x=>x.codigo===o.pacCodigo)||{};
  const nom=nombreEtiqueta(p,o.pacienteNombre);
  const tubos={};
  o.examenes.forEach(e=>{(tubos[e.tubo]=tubos[e.tubo]||[]).push(e.id);});
  const total=Object.keys(tubos).length;
  return Object.entries(tubos).map(([tubo,ids],i)=>`
  <div class="et">
    <div class="et-cab"><span class="et-lab">CDI MARCALA</span><span class="et-fecha">${fmtFecha(o.fecha)}${total>1?' · '+(i+1)+'/'+total:''}</span></div>
    <div class="et-nombre ${claseNombre(nom)}">${esc(nom)}</div>
    ${(()=>{const d=(sexoTexto(p.sexo)!=='—'?sexoTexto(p.sexo):'')+(p.fnac?(sexoTexto(p.sexo)!=='—'?' · ':'')+edadCorta(p.fnac):'');
      return `<div class="et-datos ${claseDatos(d)}">${esc(d)}</div>`;})()}
    <div class="et-datos2">${p.idNumero?esc((p.idTipo||'DNI')+' '+p.idNumero):''}</div>
    <div class="et-tubo">■ ${esc(tubo)} · ${ids.join(', ')}</div>
    <div class="et-pie">
      <svg class="codigo" data-valor="${o.numero}"></svg>
      <div class="et-ot">${o.numero}</div>
    </div>
  </div>`).join('');
}
function imprimirEtiquetas(n){
  const o=S.ordenes.find(x=>x.numero===n);
  if(!o){toast('Orden no encontrada');return;}
  ventanaImpresion(etiquetasDeOrden(o),cssEtiqueta,nombreDeOrden(o,'Etiquetas'));
}

  const u={nombre:g('u_nombre'),rol:g('u_rol'),cargo:g('u_cargo'),pin:g('u_pin')};
  if(i>=0)S.usuarios[i]=u;else S.usuarios.push(u);
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:(i>=0?'Modificación':'Alta')+' de usuario del sistema: '+u.nombre+' ('+u.rol+').'});

}
function borrarUsuario(i){

function contarOrdenesViejas(){
  return S.ordenes.filter(o=>!desglosarOrden(o.numero)).length;
}
function renumerarOrdenes(){
  const viejas=S.ordenes.filter(o=>!desglosarOrden(o.numero));
  if(!viejas.length){toast('Todas las órdenes ya usan el formato nuevo');return;}
  if(!confirm('Se renumerarán '+viejas.length+' orden(es) con formato anterior al nuevo esquema:\n\n'+
    'sucursal + año + mes + día + correlativo del paciente del día\n\n'+
    'El número anterior queda registrado en cada orden como referencia, y se actualizan las cotizaciones, '+
    'los cobros y la bitácora que apunten a ellas.\n\n'+
    'IMPORTANTE: si ya entregaste informes impresos con el número anterior, el papel no coincidirá con el sistema.\n\n¿Continuar?'))return;
  // Renumerar en orden cronológico para que el correlativo del día respete la secuencia real
  const enOrden=viejas.slice().sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  const usados={};
  const mapa={};
  enOrden.forEach(o=>{
    const suc=String(o.sucursal||S.config.sucursal||'1').replace(/\D/g,'')||'1';
    const [a,m,d]=o.fecha.split('-');
    const base=suc+a+m+d;
    if(usados[base]===undefined){
      // Partir del correlativo más alto ya existente ese día
      let max=0;
      S.ordenes.forEach(x=>{
        if(typeof x.numero==='string'&&x.numero.startsWith(base)&&x.numero.length===base.length+3){
          const n=parseInt(x.numero.slice(base.length),10);if(!isNaN(n)&&n>max)max=n;
        }});
      usados[base]=max;
    }
    const nuevo=base+String(++usados[base]).padStart(3,'0');
    mapa[o.numero]=nuevo;
    o.numeroAnterior=o.numero;
    o.numero=nuevo;
    o.sucursal=suc;
  });
  // Actualizar referencias cruzadas
  S.cotizaciones.forEach(c=>{if(mapa[c.ot])c.ot=mapa[c.ot];});
  S.movimientos.forEach(m=>{
    if(mapa[m.ref]){m.concepto=m.concepto.replace(m.ref,mapa[m.ref]);m.ref=mapa[m.ref];}
  });
  S.bitacora.forEach(b=>{
    Object.keys(mapa).forEach(vi=>{if(b.descripcion.includes(vi))b.descripcion=b.descripcion.split(vi).join(mapa[vi]);});
  });
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Renumeración de '+viejas.length+' orden(es) al formato sucursal-fecha-correlativo. '+
      Object.entries(mapa).map(([v,n])=>v+' → '+n).join(' · ')});
  guardar();vConfig();
  toast(viejas.length+' orden(es) renumeradas ✓');
}

/* =============== DENOMINACIONES (Lempira, Honduras) =============== */
const DENOMS=[
  {v:500,l:'500 Lempiras (billete)'},{v:200,l:'200 Lempiras (billete)'},{v:100,l:'100 Lempiras (billete)'},
  {v:50,l:'50 Lempiras (billete)'},{v:20,l:'20 Lempiras (billete)'},{v:10,l:'10 Lempiras (billete)'},
  {v:5,l:'5 Lempiras (billete)'},{v:2,l:'2 Lempiras (billete)'},{v:1,l:'1 Lempira (billete)'},
  {v:0.5,l:'50 centavos (moneda)'},{v:0.2,l:'20 centavos (moneda)'},{v:0.1,l:'10 centavos (moneda)'},{v:0.05,l:'5 centavos (moneda)'}
];
function gridDenoms(pref,conteo={}){
  return `<table style="max-width:520px"><thead><tr><th>Denominación</th><th style="width:110px">Cantidad</th><th style="text-align:right">Subtotal</th></tr></thead><tbody>
  ${DENOMS.map(d=>`<tr>
    <td>${d.l}</td>
    <td><input type="number" min="0" step="1" id="${pref}_${String(d.v).replace('.','_')}" value="${conteo[d.v]||''}" oninput="totalDenoms('${pref}')"></td>
    <td style="text-align:right" id="${pref}_s_${String(d.v).replace('.','_')}">${conteo[d.v]?L(conteo[d.v]*d.v):'—'}</td>
  </tr>`).join('')}
  <tr><td colspan="2" style="text-align:right;font-weight:800">TOTAL CONTADO EN LEMPIRAS</td>
  <td style="text-align:right;font-weight:800;color:var(--azul);font-size:16px" id="${pref}_total">L 0.00</td></tr>
  </tbody></table>`;
}
function leerDenoms(pref){
  const conteo={};let total=0;
  DENOMS.forEach(d=>{
    const el=document.getElementById(pref+'_'+String(d.v).replace('.','_'));
    const q=Math.max(0,parseInt(el?.value)||0);
    if(q){conteo[d.v]=q;total+=q*d.v;}
  });
  return {conteo,total:Math.round(total*100)/100};
}
function totalDenoms(pref){
  const {conteo,total}=leerDenoms(pref);
  DENOMS.forEach(d=>{
    const s=document.getElementById(pref+'_s_'+String(d.v).replace('.','_'));
    if(s)s.textContent=conteo[d.v]?L(conteo[d.v]*d.v):'—';
  });
  const t=document.getElementById(pref+'_total');if(t)t.textContent=L(total);
  const dif=document.getElementById('cc_dif');
  if(dif&&pref==='cc'){
    const esp=esperadoCaja().esperado, difv=Math.round((total-esp)*100)/100;
    dif.textContent=(difv>0?'+':'')+L(difv).replace('L ','L ');
    dif.style.color=Math.abs(difv)<0.01?'var(--verde)':(difv<0?'var(--rojo)':'var(--ambar)');
    dif.dataset.valor=difv;
  }
}
function desgloseTexto(conteo){
  return DENOMS.filter(d=>conteo[d.v]).map(d=>`${conteo[d.v]} × ${d.l.replace(' (billete)','').replace(' (moneda)','')}`).join(' · ')||'—';
}

function afectaCaja(metodo){return metodo==='Efectivo';}
function registrarMovimiento({tipo,metodo,categoria,concepto,monto,ref}){
  const m={id:'MOV-'+String(S.seq.mov++).padStart(5,'0'),fecha:hoy(),hora:ahoraHora(),
    tipo,metodo,categoria,concepto,monto:Math.round(monto*100)/100,ref:ref||'',
    caja:(metodo==='Efectivo'&&S.caja.abierta),corte:''};
  S.movimientos.push(m);guardar();return m;
}
function esperadoCaja(){
  const pend=S.movimientos.filter(m=>m.caja&&!m.corte);
  const ing=pend.filter(m=>m.tipo==='Ingreso').reduce((a,m)=>a+m.monto,0);
  const egr=pend.filter(m=>m.tipo==='Egreso').reduce((a,m)=>a+m.monto,0);
  const esperado=Math.round((S.caja.fondo+ing-egr)*100)/100;
  return {ing,egr,esperado,pend};
}

  guardar(true);vCaja();toast('Caja abierta con '+L(total)+' ✓');

function cerrarCaja(){
  const {conteo,total}=leerDenoms('cc');
  const {ing,egr,esperado,pend}=esperadoCaja();
  const dif=Math.round((total-esperado)*100)/100;
  if(!confirm('Cerrar caja:\n\nEsperado: '+L(esperado)+'\nContado: '+L(total)+'\nDiferencia: '+(dif>=0?'+':'')+L(dif)+'\n\n¿Confirmar cierre?'))return;
  const corte={fecha:hoy(),horaApertura:S.caja.hora,horaCierre:ahoraHora(),responsable:S.caja.responsable,
    fondo:S.caja.fondo,conteoApertura:S.caja.conteo,ingresos:ing,egresos:egr,esperado,contado:total,diferencia:dif,conteoCierre:conteo,
    movimientos:pend.map(m=>m.id)};
  pend.forEach(m=>m.corte=corte.fecha+' '+corte.horaCierre);
  S.cortes.push(corte);
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:S.caja.responsable,tipo:'Cierre de caja',
    descripcion:'Cierre. Esperado '+L(esperado)+' · Contado '+L(total)+' · Diferencia '+(dif>=0?'+':'')+L(dif)+'. Desglose: '+desgloseTexto(conteo)});
  S.caja={abierta:false,fecha:'',hora:'',responsable:'',fondo:0,conteo:{}};
  guardar(true);vCaja();toast('Caja cerrada. Diferencia: '+(dif>=0?'+':'')+L(dif));

}

function vConta(mes){
  mes=mes||hoy().slice(0,7);
  const movs=S.movimientos.filter(m=>m.fecha.startsWith(mes)).slice().reverse();
  const ing=movs.filter(m=>m.tipo==='Ingreso').reduce((a,m)=>a+m.monto,0);
  const egr=movs.filter(m=>m.tipo==='Egreso').reduce((a,m)=>a+m.monto,0);
  const porCat={};movs.forEach(m=>{const k=m.tipo+'|'+m.categoria;porCat[k]=(porCat[k]||0)+m.monto;});
  // Descuentos otorgados en el mes (por órdenes cobradas)
  const ordMes=S.ordenes.filter(o=>o.fecha.startsWith(mes)&&o.subtotal);
  const listaLista=ordMes.reduce((a,o)=>a+o.subtotal,0);
  const descOtorg=ordMes.reduce((a,o)=>a+Math.max(0,o.subtotal-o.total),0);
  const pctDesc=listaLista?round2(descOtorg/listaLista*100):0;
  const conDesc=ordMes.filter(o=>o.subtotal>o.total);
  vista.innerHTML=`
  <div class="cabecera"><h2>Contabilidad</h2>
    <div style="display:flex;gap:10px;align-items:center">

      <button class="btn btn-r" onclick="modalMovimiento('Egreso')">− Otras salidas</button>
      <button class="btn btn-d" onclick="previsualizar(()=>imprimirConta('${mes}'),'Reporte contable ${mes}','Imprimir reporte')">👁 Reporte del mes</button>
    </div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi" style="border-left-color:var(--verde)"><div class="n" style="color:var(--verde)">${L(ing)}</div><div class="t">Ingresos del mes (L)</div></div>
    <div class="kpi" style="border-left-color:var(--rojo)"><div class="n" style="color:var(--rojo)">${L(egr)}</div><div class="t">Salidas del mes (L)</div></div>
    <div class="kpi"><div class="n" style="color:${ing-egr>=0?'var(--azul)':'var(--rojo)'}">${L(ing-egr)}</div><div class="t">Balance</div></div>
    <div class="kpi" style="border-left-color:var(--ambar)"><div class="n" style="color:var(--ambar)">${pctDesc} %</div><div class="t">Descuentos otorgados</div></div>
  </div>

/* Las fotos se reducen antes de guardar: una foto de celular pesa 4 MB y
   el almacenamiento del navegador es limitado. */
async function cargarComprobante(file){
  if(!file)return;
  const cont=document.getElementById('m_comp');
  const esPDF=/pdf$/i.test(file.name)||file.type==='application/pdf';
  if(esPDF&&file.size>2.5*1024*1024){
    toast('El PDF pesa '+Math.round(file.size/1024/1024*10)/10+' MB. Usa uno menor a 2.5 MB o una foto.');return;}
  if(cont)cont.innerHTML='<div class="ayuda">Procesando el comprobante…</div>';
  try{
    if(esPDF){
      const datos=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(file);});
      comprobanteTmp={nombre:file.name,tipo:'pdf',datos,peso:datos.length,comprimida:false};
    }else{
      const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=URL.createObjectURL(file);});
      const max=1500;
      const esc2=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.naturalWidth*esc2);cv.height=Math.round(img.naturalHeight*esc2);
      const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';
      cx.drawImage(img,0,0,cv.width,cv.height);
      let datos=cv.toDataURL('image/jpeg',0.72);
      if(datos.length>900*1024)datos=cv.toDataURL('image/jpeg',0.55);
      comprobanteTmp={nombre:file.name,tipo:'jpg',datos,peso:datos.length,comprimida:esc2<1};
    }
    if(cont)cont.innerHTML=vistaComprobante();
    toast('Comprobante adjuntado ✓');
  }catch(e){
    if(cont)cont.innerHTML=vistaComprobante();
    toast('No se pudo leer el archivo');
  }
}

  const conc=g('m_conc');
  if(monto<=0||!conc){toast('Monto y concepto son obligatorios');return;}
  const metodo=g('m_metodo');
  const d={fecha:g('m_fecha')||hoy(),metodo,categoria:g('m_cat'),concepto:conc,
    monto:Math.round(monto*100)/100,documento:g('m_doc'),nota:g('m_nota'),
    banco:g('m_banco_n'),referencia:g('m_ref'),cuenta:g('m_cta'),
    caja:afectaCaja(metodo),comprobante:comprobanteTmp};
  const prev=mid?S.movimientos.find(x=>x.id===mid):null;
  if(prev){
    if(prev.corte){toast('No se puede editar: pertenece a un corte de caja cerrado');return;}

  comprobanteTmp=null;
  guardar(true);cerrarModal();desdeCaja?vCaja():vConta(d.fecha.slice(0,7));
  toast(tipo+' de '+L(monto)+' registrado ✓');
}

/* =============== SINCRONIZACIÓN CON SERVIDOR ===============
   Cuando el LIS está montado en web, los datos se guardan en el
   servidor en vez de en localStorage. El módulo detecta
   automáticamente si hay un servidor disponible.
   Si no hay servidor (modo offline), funciona igual que antes. */


/* Detectar si estamos en web o local ─────────────────────── */
async function detectarModo(){
  try{
    const r=await fetch('/api/auth/me',{signal:AbortSignal.timeout(3000)});
    if(r.ok){
      MODO_WEB=true;
      const u=await r.json();
      USUARIO_WEB=u;                    // quien entró por la pantalla de acceso
      console.log('[CDIM] Modo web · usuario:',u.nombre,'·',u.rol);
      await cargarDesdeServidor();
      programarSyncPeriodico();
      return u;
    }
    if(r.status===401){
      // Hay servidor pero no está logueado → redirigir al login
      window.location.href='/login.html';
      return null;
    }
  }catch(e){
    console.log('[CDIM] Sin servidor → modo local');
  }
  MODO_WEB=false;
  return null;
}


/* Subir el estado al servidor ───────────────────────────── */
/* Comprime antes de enviar cuando el navegador lo permite.
   Un estado de 20 MB viaja como menos de 1 MB: la diferencia se nota
   sobre todo desde el celular con datos móviles. */
async function comprimirSiSePuede(texto){
  if(typeof CompressionStream==='undefined')return null;
  try{
    const flujo=new Blob([texto]).stream().pipeThrough(new CompressionStream('gzip'));
    return await new Response(flujo).arrayBuffer();
  }catch(e){ return null; }
}
async function subirEstado(){
  if(!MODO_WEB||!_syncPendiente)return;
  clearTimeout(_syncTimer);
  try{
    const texto=JSON.stringify({estado:S,ts:_lastTs});
    const gz=await comprimirSiSePuede(texto);
    const r=await fetch('/api/estado',{
      method:'POST',
      headers: gz
        ? {'Content-Type':'application/json','Content-Encoding':'gzip'}
        : {'Content-Type':'application/json'},
      body: gz || texto
    });
    if(r.status===409){
      // Conflicto: hay una versión más nueva en el servidor
      const d=await r.json();
      const ok=confirm('Otro dispositivo guardó cambios mientras trabajabas.\n\n¿Descargar la versión más reciente del servidor? (Se perderán los cambios locales no guardados.)');
      if(ok&&d.estado){S=d.estado;_lastTs=S._ts;invalidarIndices();toast('Estado actualizado desde el servidor');}
      return;
    }
    if(r.ok){
      const d=await r.json();
      _lastTs=d.ts;
      _syncPendiente=false;
      actualizarIndicadorSync(true);
    }else{
      console.warn('[CDIM] Error al subir:',r.status);
      actualizarIndicadorSync(false);
    }
  }catch(e){
    console.warn('[CDIM] Sin conexión al guardar');
    actualizarIndicadorSync(false);
    // Guardar localmente como respaldo offline
    volcarEstado();
  }
}

/* Descargar el estado del servidor ──────────────────────── */
async function cargarDesdeServidor(){
  try{
    // Primero ver si el servidor tiene algo más nuevo
    const rt=await fetch('/api/estado/ts');
    const {ts}=await rt.json();
    // Ver cotizaciones del portal y fusionarlas
    await importarCotWebDesdeServidor();
    if(!ts){
      // Servidor vacío → subir el estado local si existe
      const local=localStorage.getItem(CLAVE);
      if(local){
        S=JSON.parse(local);
        _syncPendiente=true;
        await subirEstado();
        toast('Datos locales subidos al servidor ✓');
      }
      return;
    }
    const localTs=parseInt(localStorage.getItem(CLAVE+'_ts')||'0');
    if(ts>localTs){
      // El servidor tiene datos más nuevos
      const r=await fetch('/api/estado');
      if(r.ok){
        const estado=await r.json();
        if(estado){
          S=estado;_lastTs=ts;
          localStorage.setItem(CLAVE+'_ts',String(ts));
          invalidarIndices();
          console.log('[CDIM] Estado cargado del servidor · ts:',ts);
        }
      }
    }else{
      _lastTs=localTs;
    }
  }catch(e){
    console.warn('[CDIM] Usando datos locales (sin conexión)');
  }
}

      // Borrar de la cola del servidor
      await Promise.all(cola.map(c=>fetch(`/api/cotizaciones-web/${c.numero}`,{method:'DELETE'})));
    }
  }catch(e){}
}
// Reemplazar la importación local
function importarCotWeb(){
  if(MODO_WEB)return importarCotWebDesdeServidor();
  // Modo local: usar localStorage como antes
  try{

        items:(cw.items||[]).map(i=>({id:i.id,nombre:i.nombre,cantidad:1,precio:i.precio,descPct:0,gravado:false})),
        descPct:0,condPago:'Contado',validez:7,elaboradoPor:'Portal web',obs:cw.obs||'',

async function restaurarRespaldo(archivo,fecha){
  if(!confirm('¿Restaurar los datos del '+fecha+'?\n\nSe reemplazará todo lo que hay ahora. Los cambios posteriores a esa fecha se perderán.'))return;
  try{
    const r=await fetch('/api/respaldo/restaurar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({archivo})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    toast('Datos restaurados ✓ — recargando…');
    setTimeout(()=>location.reload(),1200);
  }catch(e){toast('Error: '+e.message);}
}
function subirRespaldo(inp){
  const f=inp.files[0]; if(!f)return;
  const lector=new FileReader();
  lector.onload=async ev=>{
    try{
      const estado=JSON.parse(ev.target.result);
      if(!estado.pacientes){toast('Ese archivo no parece un respaldo del LIS');return;}
      if(!confirm('¿Restaurar desde este archivo?\n\nPacientes: '+estado.pacientes.length+
        ' · Órdenes: '+(estado.ordenes||[]).length+'\n\nSe reemplazará todo lo que hay ahora.'))return;
      const r=await fetch('/api/respaldo/subir',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({estado})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error);
      toast('Datos restaurados ✓ — recargando…');
      setTimeout(()=>location.reload(),1200);
    }catch(e){toast('Error: '+e.message);}
  };
  lector.readAsText(f);
  inp.value='';
}

    <button class="btn btn-p" onclick="guardarPin('${id}')">Guardar PIN</button>
  </div>`,true);
}
async function guardarPin(id){
  const p=document.getElementById('pin_nuevo').value.trim();
  if(!/^\d{4,8}$/.test(p)){toast('El PIN debe tener entre 4 y 8 dígitos');return;}
  if(/^(\d)\1+$/.test(p)||['1234','12345','123456','0000'].includes(p)){
    if(!confirm('Ese PIN es muy fácil de adivinar.\n¿Guardarlo de todos modos?'))return;
  }
  const r=await fetch('/api/usuarios/'+id+'/pin',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:p})});
  const d=await r.json();
  if(r.ok){cerrarModal();vUsuarios();toast('PIN guardado ✓');}
  else toast('Error: '+d.error);
}
async function quitarPin(id){
  if(!confirm('¿Quitar el PIN? Esta persona tendrá que entrar con su contraseña.'))return;
  const r=await fetch('/api/usuarios/'+id+'/pin',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:null})});
  if(r.ok){cerrarModal();vUsuarios();toast('PIN retirado');}
}
async function eliminarUsuario(id,nombre){
  if(!confirm('¿Eliminar al usuario "'+nombre+'"?'))return;
  const r=await fetch('/api/usuarios/'+id,{method:'DELETE'});
  if(r.ok){vUsuarios();toast('Usuario eliminado');}
}
async function cambiarClave(){
  const actual=document.getElementById('pwd_actual').value;
  const nueva=document.getElementById('pwd_nueva').value;
  const conf=document.getElementById('pwd_conf').value;
  if(nueva!==conf){toast('Las contraseñas nuevas no coinciden');return;}
  if(nueva.length<6){toast('La contraseña debe tener al menos 6 caracteres');return;}
  const r=await fetch('/api/auth/cambiar-clave',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({claveActual:actual,claveNueva:nueva})});
  const d=await r.json();
  if(r.ok)toast('Contraseña cambiada ✓');
  else toast('Error: '+d.error);
}
async function cerrarSesion(){
  await fetch('/api/auth/logout',{method:'POST'});
  window.location.href='/login.html';
}
/* Cambiar de usuario sin salir del trabajo: útil cuando el técnico captura
   y el Dr. tiene que validar en el mismo equipo. */
async function cambiarUsuario(){
  const u=usuarioActivo();
  if(!confirm('Sesión actual: '+u.nombre+' ('+rolActivo()+')\n\n'+
    '¿Cerrar sesión para que entre otra persona?\n'+
    'Los datos ya están guardados en el servidor.'))return;
  await fetch('/api/auth/logout',{method:'POST'});
  window.location.href='/login.html';
}

/* =============== BITÁCORA DE TRABAJO =============== */
const TIPOS_BIT=['Actividad de rutina','Control de calidad','Mantenimiento de equipo','Recepción de reactivos','Incidencia / No conformidad','Acción correctiva','Capacitación','Apertura de caja','Cierre de caja','Observación','Otro'];
function filasBitacora(filtro=''){
  const f=normTxt(filtro);
  const lista=S.bitacora.map((b,i)=>({...b,_i:i})).filter(b=>normTxt(b.tipo+' '+b.descripcion+' '+b.responsable+' '+b.fecha).includes(f)).reverse();
  return `${lista.length?`<table class="tabla-bit"><thead><tr><th style="width:90px">Fecha</th><th style="width:55px">Hora</th><th>Tipo</th><th>Descripción</th><th>Responsable</th><th></th></tr></thead><tbody>
    ${lista.map(b=>`<tr>
      <td>${fmtFecha(b.fecha)}<div class="solo-movil cel-sub">${esc(b.hora||'')}</div></td><td>${b.hora}</td>
      <td><span class="chip ${/Incidencia|correctiva/.test(b.tipo)?'chip-rj':/caja/.test(b.tipo)?'chip-do':'chip-az'}">${esc(b.tipo)}</span></td>
      <td style="font-size:12.5px">${esc(b.descripcion)}</td><td style="font-size:12px">${esc(b.responsable)}</td>
      <td><button class="btn btn-r btn-min" onclick="borrarBitacora(${b._i})">✕</button></td></tr>`).join('')}
  </tbody></table>`:`<div class="vacio">${filtro?'Ninguna entrada coincide con “'+esc(filtro)+'”.':'Sin entradas en la bitácora.'}</div>`}`;
}
function vBitacora(filtro=''){
  vista.innerHTML=`
  <div class="cabecera"><h2>Bitácora de Trabajo</h2>
    <div style="display:flex;gap:10px">
      <input class="busqueda" id="q_bit" placeholder="Buscar en la bitácora…"
        value="${esc(filtro)}" oninput="document.getElementById('lista_bit').innerHTML=filasBitacora(this.value)">
      <button class="btn btn-d" onclick="previsualizar(()=>imprimirBitacora(),'Bitácora de trabajo','Imprimir bitácora')">👁 Ver e imprimir</button>
      <button class="btn btn-p" onclick="modalBitacora()">+ Nueva entrada</button>
    </div>
  </div>
  <div class="aviso">Registro cronológico para el SGC: actividades, mantenimientos, incidencias y controles. Las aperturas y cierres de caja se anotan automáticamente.</div>
  <div class="tarjeta" id="lista_bit">${filasBitacora(filtro)}</div>`;
  const q=document.getElementById('q_bit');if(q&&filtro)q.focus();
}
function modalBitacora(){
  abrirModal(`
  <h3>Nueva entrada de bitácora</h3>
  <div class="rejilla c3">
    <div class="campo"><label>Fecha</label><input type="date" id="b_fecha" value="${hoy()}"></div>
    <div class="campo"><label>Hora</label><input type="time" id="b_hora" value="${ahoraHora()}"></div>
    <div class="campo"><label>Responsable</label><input id="b_resp" value="${esc(S.config.regente)}"></div>
  </div>
  <div class="campo"><label>Tipo</label><select id="b_tipo">${TIPOS_BIT.map(t=>`<option>${t}</option>`).join('')}</select></div>
  <div class="campo"><label>Descripción *</label><textarea id="b_desc" rows="4" placeholder="Detalle de la actividad, equipo involucrado, lote de reactivo, acción tomada…"></textarea></div>
  <div class="modal-pie"><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button>
  <button class="btn btn-p" onclick="guardarBitacora()">Guardar entrada</button></div>`);
}
function guardarBitacora(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('b_desc')){toast('La descripción es obligatoria');return;}
  S.bitacora.push({fecha:g('b_fecha')||hoy(),hora:g('b_hora')||ahoraHora(),responsable:g('b_resp'),tipo:g('b_tipo'),descripcion:g('b_desc')});
  guardar();cerrarModal();vBitacora();toast('Entrada registrada ✓');
}
function borrarBitacora(i){if(confirm('¿Eliminar esta entrada?')){S.bitacora.splice(i,1);guardar();vBitacora();}}
function imprimirBitacora(){
  const lista=S.bitacora.slice().sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const html=`${membrete()}
  <h2>BITÁCORA DE TRABAJO</h2>
  <div class="datos"><div><b>Entradas:</b> ${lista.length}</div><div><b>Emitido:</b> ${fmtFecha(hoy())}</div></div>
  <table><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Descripción</th><th>Responsable</th></tr></thead><tbody>
  ${lista.map(b=>`<tr><td>${fmtFecha(b.fecha)}<div class="solo-movil cel-sub">${esc(b.hora||'')}</div></td><td>${b.hora}</td><td>${esc(b.tipo)}</td><td>${esc(b.descripcion)}</td><td>${esc(b.responsable)}</td></tr>`).join('')}
  </tbody></table>
  <div class="firma"><div class="linea">${esc(S.config.regente)}</div><div class="sub">Microbiólogo Regente · ${esc(S.config.colegiacion)}</div></div>
  <div class="pie">${esc(S.config.anclaSGC)} · ${esc(S.config.nombre)}</div>`;
  ventanaImpresion(html,cssDoc,nombreArchivo('Bitacora',hoy()));
}

/* =============== ARRANQUE =============== */
/* En modo web: detecta el servidor, carga el estado, muestra botones extra.
   En modo local: arranca exactamente igual que antes. */
(async function arrancar(){
  // Intentar conectar con el servidor (timeout 3 s)
  try{
    const r=await Promise.race([
      fetch('/api/auth/me'),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),3000))
    ]);
    if(r.status===401){
      // Hay servidor pero no hay sesión → ir al login
      window.location.href='/login.html';
      return;
    }
    if(r.ok){
      MODO_WEB=true;
      const u=await r.json();
      USUARIO_WEB=u;                    // quien entró por la pantalla de acceso
      console.log('[CDIM] Modo web · usuario:',u.nombre,'·',u.rol);
      // Mostrar botones de web
      const bc=document.getElementById('btn-cambiar');
      if(bc)bc.style.display='';
      const bl=document.getElementById('btn-logout');
      const bu=document.getElementById('btn-usuarios');
      if(bl)bl.style.display='';
      if(bu&&puede('usuarios'))bu.style.display='';
      const br=document.getElementById('btn-respaldos');
      if(br&&puede('usuarios'))br.style.display='';
      // Cargar estado desde el servidor
      await cargarDesdeServidor();
      programarSyncPeriodico();
    }
  }catch(e){
    console.log('[CDIM] Sin servidor → modo local');
    MODO_WEB=false;
  }
  // Arranque normal
  guardar();
  actualizarPieNav();
  if(!mostrarCandado())vInicio();
})();
</script>
