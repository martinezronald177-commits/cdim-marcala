/* =============== ÓRDENES DE TRABAJO =============== */
/* ===== Selección del intervalo de referencia =====
   Prioridad: 1) tramo por edad y sexo (p.rangos)  2) rango femenino  3) rango general.
   La edad se maneja en MESES para que los tramos pediátricos sean precisos.
   Cada laboratorio debe verificar estos intervalos con su método y población
   (ISO 15189 §6.5 · CLSI EP28-A3c). */
function edadEnMeses(fnac,fechaRef){
  if(!fnac)return null;
  const [a1,m1,d1]=fnac.split('-').map(Number);
  const [a2,m2,d2]=(fechaRef||hoy()).split('-').map(Number);
  if(!a1||!a2)return null;
  let m=(a2-a1)*12+(m2-m1);
  if(d2<d1)m--;
  return m<0?null:m;
}
function rangoActivo(p,sexo,edadM){
  // 1) Tramos por edad y sexo definidos en la plantilla
  if(Array.isArray(p.rangos)&&p.rangos.length){
    const cand=p.rangos.filter(r=>{
      const okSexo=!r.sexo||r.sexo===sexo;
      if(!okSexo)return false;
      if(edadM===null||edadM===undefined)return !r.edadMin&&!r.edadMax;   // sin edad, solo tramos sin límite
      const desde=(r.edadMin===''||r.edadMin===undefined)?-Infinity:Number(r.edadMin);
      const hasta=(r.edadMax===''||r.edadMax===undefined)?Infinity:Number(r.edadMax);
      return edadM>=desde&&edadM<hasta;
    });
    // Gana el tramo con sexo específico sobre el genérico
    const r=cand.find(x=>x.sexo===sexo)||cand[0];
    if(r)return {min:r.min??'',max:r.max??'',texto:r.texto||'',etiqueta:r.etiqueta||'',fuente:r.fuente||p.fuente||''};
  }
  // 2) Rango femenino clásico  3) Rango general
  const usaF=(sexo==='F'&&(p.refMinF!==''||p.refMaxF!==''));
  return {min:usaF?p.refMinF:p.refMin,max:usaF?p.refMaxF:p.refMax,texto:'',etiqueta:'',fuente:p.fuente||''};
}
/* Etiqueta legible de un tramo de edad expresado en meses */
function etiquetaEdad(r){
  if(r.etiqueta)return r.etiqueta;
  const f=m=>{
    if(m===null||m===undefined||m==='')return null;
    m=Number(m);
    if(m<1)return 'recién nacido';
    if(m<24)return m+(m===1?' mes':' meses');
    const a=Math.round(m/12);
    return a+(a===1?' año':' años');
  };
  const d=f(r.edadMin), h=f(r.edadMax);
  if(d&&h)return d+' – '+h;
  if(h)return 'hasta '+h;
  if(d)return 'desde '+d;
  return '';
}
/* =============== FÓRMULAS ENTRE ANÁLISIS ===============
   Un análisis puede calcularse a partir de otros del mismo examen usando
   {Nombre del análisis} en su fórmula. Ejemplos:
     BUN            → {Urea}/2.1428
     Urea desde BUN → {Nitrógeno Ureico (BUN)}*2.1428
     Colesterol VLDL→ {Triglicéridos}/5
     Índice         → {PSA libre}/{PSA total}*100 */
/* ===== Ecuación de Martin-Hopkins (Johns Hopkins) para LDL =====
   LDL = Colesterol Total − HDL − (Triglicéridos / factor ajustable)
   El factor sale de una tabla de 180 celdas según el nivel de TG y de no-HDL,
   en lugar de un divisor fijo. Publicada en JAMA 2013;310(19):2061.
   Es la única ecuación de estimación que usa el sistema. */
const MH_TG=[7,50,56,62,69,76,82,89,96,104,113,122,133,145,161,183,216,266,346,10000];
const MH_NOHDL=[100,130,160,190,10000];
/* Filas: franja de TG · Columnas: franja de no-HDL (<100, 100-129, 130-159, 160-189, ≥190) */
const MH_TABLA=[
 [3.5,3.4,3.3,3.3,3.2],[4.0,3.9,3.7,3.6,3.6],[4.3,4.1,4.0,3.9,3.9],[4.5,4.3,4.1,4.0,4.0],
 [4.7,4.4,4.3,4.2,4.1],[4.8,4.6,4.4,4.2,4.2],[5.0,4.7,4.5,4.3,4.3],[5.1,4.8,4.6,4.4,4.4],
 [5.2,4.9,4.7,4.5,4.5],[5.3,5.0,4.8,4.6,4.5],[5.4,5.1,4.9,4.7,4.6],[5.6,5.2,5.0,4.8,4.7],

function factorMartinHopkins(tg,noHDL){
  let f=MH_TG.findIndex(v=>tg<v); if(f<0)f=MH_TG.length-1; if(f>0)f--;
  let c=MH_NOHDL.findIndex(v=>noHDL<v); if(c<0)c=MH_NOHDL.length-1;
  return MH_TABLA[Math.min(f,MH_TABLA.length-1)][Math.min(c,4)];
}
function ldlMartinHopkins(ct,hdl,tg){
  if(![ct,hdl,tg].every(v=>isFinite(v)&&v>0))return null;
  if(tg>=400)return null;                       // fuera del rango validado de la ecuación
  const noHDL=ct-hdl;
  if(noHDL<=0)return null;
  const ldl=noHDL-(tg/factorMartinHopkins(tg,noHDL));
  return ldl>0?ldl:0;
}
/* Busca un análisis por nombre en TODA la orden, no solo en su examen */
function valorEnOrden(orden,nombres){
  for(const e of orden.examenes){
    for(const p of e.params){
      if(nombres.some(nm=>normTxt(p.nombre)===normTxt(nm)||normTxt(e.nombre)===normTxt(nm))){
        const v=String(p.valor).replace(',','.').replace(/[^\d.\-]/g,'');
        if(v!==''&&!isNaN(Number(v)))return Number(v);
      }
    }
  }
  return null;
}
/* Calcula el LDL de la orden cuando están Colesterol Total, HDL y Triglicéridos */
function calcularLDLOrden(orden){
  const ct=valorEnOrden(orden,['Colesterol Total','Colesterol total']);
  const hdl=valorEnOrden(orden,['Colesterol HDL','HDL']);
  const tg=valorEnOrden(orden,['Triglicéridos','Trigliceridos','TG']);
  let cambios=0;
  orden.examenes.forEach(e=>e.params.forEach(p=>{
    // Colesterol no-HDL = Colesterol Total − HDL (insumo de la ecuación de Martin-Hopkins)
    if(p.noHDL||/colesterol no.?hdl|^no.?hdl$/i.test(normTxt(p.nombre))){
      if(p.ldlManual)return;
      const v=(ct!==null&&hdl!==null)?Math.max(0,ct-hdl):null;
      const nv=(v===null)?'':v.toFixed(p.decimales===undefined?0:p.decimales);
      if(p.valor!==nv){p.valor=nv;p.valorCalculado=(nv!=='');cambios++;
        p.notaCalculo=nv!==''?'Colesterol no-HDL = Colesterol Total ('+ct+') − Colesterol HDL ('+hdl+')':'';}
      return;
    }
    const esLDL=/colesterol ldl|ldl colesterol|^ldl$/i.test(normTxt(p.nombre))||
                (/colesterol ldl/i.test(normTxt(e.nombre))&&e.params.length===1);
    if(!esLDL||p.ldlManual)return;
    const r=ldlMartinHopkins(ct,hdl,tg);
    const nuevo=(r===null)?'':r.toFixed(1);
    if(p.valor!==nuevo&&!(nuevo===''&&p.valor!==''&&!p.valorCalculado)){
      p.valor=nuevo; p.valorCalculado=(nuevo!==''); cambios++;
      if(nuevo!==''){
        const noHDL=ct-hdl;
        p.notaCalculo='Calculado por la ecuación de Martin-Hopkins (Johns Hopkins): '+
          'Colesterol no-HDL '+noHDL.toFixed(0)+' mg/dL · factor ajustable '+factorMartinHopkins(tg,noHDL).toFixed(1);
      } else p.notaCalculo='';
    }
  }));
  return cambios;
}
function calcularFormulas(examen){
  let cambios=0;
  (examen.params||[]).forEach(p=>{
    if(!p.formula)return;
    let expr=String(p.formula), faltan=false;
    expr=expr.replace(/\{([^}]+)\}/g,(m,nom)=>{
      const ref=examen.params.find(x=>normTxt(x.nombre)===normTxt(nom));
      const v=ref?String(ref.valor).replace(',','.').replace(/[^\d.\-]/g,''):'';
      if(v===''||isNaN(Number(v))){faltan=true;return '0';}
      return '('+Number(v)+')';
    });
    if(faltan){ if(p.valorCalculado){p.valor='';p.valorCalculado=false;cambios++;} return; }
    // Solo se permiten números y operadores: nada de código arbitrario
    if(!/^[\d\s()+\-*/.]+$/.test(expr))return;
    let r;
    try{ r=Function('"use strict";return ('+expr+')')(); }catch(e){ return; }
    if(!isFinite(r))return;
    const dec=(p.decimales===undefined||p.decimales===''?1:Number(p.decimales));
    const nuevo=r.toFixed(dec);
    if(p.valor!==nuevo){p.valor=nuevo;cambios++;}
    p.valorCalculado=true;
  });
  return cambios;
}
/* ── Resultados cualitativos que requieren atención clínica ──
   Devuelve 'pos' cuando el hallazgo es clínicamente relevante,
   'neg' cuando es el resultado esperado, y '' cuando no aplica.
   Se excluyen los casos donde "positivo" es un resultado normal
   (Rh positivo, por ejemplo). */
const NORMALES_POSITIVOS=/^(rh|factor rh|grupo|tipo)/i;
function evalCualitativo(p){
  const v=String(p.valor||'').trim();
  if(!v)return '';
  // Rh positivo y similares no son hallazgos anormales
  if(NORMALES_POSITIVOS.test(p.nombre||''))return '';
  // Si la plantilla marca un valor esperado, se compara contra él
  const esperado=String(p.refTexto||'').trim().toLowerCase();
  const pos=/\b(positiv[oa]s?|reactiv[oa]s?|detectad[oa]s?|presente|presentes|se observan|observad[oa]s?|abundantes|moderad[oa]s?|patológic[oa]s?|anormal|crecimiento|aislad[oa]s?|móviles|trofozoítos|quistes|larvas|huevos)\b/i;
  const neg=/\b(negativ[oa]s?|no reactiv[oa]s?|no detectad[oa]s?|ausentes?|no se observan|sin desarrollo|sin crecimiento|sin evidencia|normal(es)?|normocit[oa]|normocrómic[oa]|escas[oa]s?|estéril|no aplica|no probado)\b/i;
  // Nombre binomial de un microorganismo o parásito: "Giardia lamblia", "Escherichia coli"
  const especie=/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+\s+[a-záéíóúñ]{3,}/;
  // "No reactivo" y "no se observan" contienen "reactivo"/"observan": el negativo manda
  if(neg.test(v))return 'neg';
  // El aislamiento de una especie es siempre un hallazgo
  if(especie.test(v)&&!/^(no|sin)\b/i.test(v))return 'pos';
  if(pos.test(v)){
    // Si el valor esperado ya es positivo, no se resalta
    if(esperado&&pos.test(esperado)&&!neg.test(esperado))return '';
    return 'pos';
  }
  return '';
}
function evalParam(p,sexo,edadM){
  if(p.valor===''||p.valor===undefined)return {flag:'',critico:false};
  const v=parseFloat(String(p.valor).replace(',','.'));
  if(isNaN(v))return {flag:'',critico:false};
  const r=rangoActivo(p,sexo,edadM);
  let flag='',critico=false;
  if(r.min!==''&&r.min!==undefined&&v<parseFloat(r.min))flag='▼';
  if(r.max!==''&&r.max!==undefined&&v>parseFloat(r.max))flag='▲';
  if(p.critMin!==''&&v<parseFloat(p.critMin))critico=true;
  if(p.critMax!==''&&v>parseFloat(p.critMax))critico=true;
  return {flag,critico};
}

function alertasOrden(o){

function alertasDelta(o){
  // Delta check: variación porcentual excesiva respecto al resultado anterior
  const cfg=S.config.alertas;if(!cfg.delta)return [];
  const out=[];
  o.examenes.forEach(e=>e.params.forEach(p=>{
    if(p.valor==='')return;
    const v=parseFloat(String(p.valor).replace(',','.'));if(isNaN(v))return;
    const pv=valorPrevio(o.pacCodigo,e.id,p.nombre,o.numero);if(!pv)return;
    const a=parseFloat(String(pv.valor).replace(',','.'));if(isNaN(a)||a===0)return;
    const pct=Math.abs((v-a)/a)*100;
    if(pct>=cfg.deltaPct)out.push(`${p.nombre}: ${pv.valor} → ${p.valor} (${pct>0?'variación de ':''}${pct.toFixed(0)} %, previo del ${fmtFecha(pv.fecha)})`);
  }));
  return out;
}
function validarExamen(n,ei){

    return;

  e.validado=true;e.validadoPor=usuarioActivo().nombre;e.fechaValidacion=hoy();e.horaValidacion=ahoraHora();

function refTexto(p,sexo,edadM){

  if(r.min!==''&&r.min!==undefined&&r.max!==''&&r.max!==undefined)return r.min+' – '+r.max+et;

function valoresPrevios(pacCodigo,examenId,paramNombre,numeroActual,cuantos=3){
  // Devuelve los últimos N resultados anteriores del mismo parámetro, del más reciente al más antiguo
  const act=S.ordenes.find(x=>x.numero===numeroActual);
  const refFecha=(act?act.fecha:hoy())+(act&&act.hora?act.hora:'');
  return ordenesDe(pacCodigo)
    .filter(o=>o.numero!==numeroActual&&((o.fecha+(o.hora||''))<=refFecha))
    .map(o=>{
      const e=o.examenes.find(x=>x.id===examenId);if(!e)return null;
      const p=e.params.find(x=>x.nombre===paramNombre);
      if(!p||p.valor==='')return null;
      return {valor:p.valor,fecha:o.fecha,orden:o.numero,param:p};
    })
    .filter(Boolean).slice(0,cuantos);
}

function guardarEdicionOrden(n){
  const o=S.ordenes.find(x=>x.numero===n);
  if(!selExamenes.length){toast('La orden debe tener al menos un examen');return;}
  const antes=o.examenes.map(e=>e.id), ahora=selIds();
  const quitados=antes.filter(id=>!ahora.includes(id));
  const agregados=ahora.filter(id=>!antes.includes(id));
  const t=calcSel();
  const cambioPrecio=Math.abs(t.total-(o.total||0))>0.004;
  if(!quitados.length&&!agregados.length&&!cambioPrecio){toast('No hay cambios que guardar');cerrarModal();vOrdenes();return;}
  if(!confirm('Cambios en '+n+':\n'+
    (agregados.length?'  + Agregar: '+agregados.join(', ')+'\n':'')+
    (quitados.length?'  − Retirar: '+quitados.join(', ')+'\n':'')+
    resumenDesc(t)+'\nNuevo total: '+L(t.total)+' (antes '+L(o.total)+')\n\n¿Guardar?'))return;
  const previos={};o.examenes.forEach(e=>previos[e.id]=e);
  o.examenes=selExamenes.map(it=>{
    const base=previos[it.id];
    if(base){base.precio=it.precio;base.descPct=pctItem(it);base.descuento=descItem(it);return base;}
    const e=S.examenes.find(x=>x.id===it.id);
    return {id:e.id,nombre:e.nombre,area:e.area,tubo:e.tubo,precio:it.precio,descPct:pctItem(it),descuento:descItem(it),
      metodo:e.metodo||'',leyenda:e.leyenda||'',tipoLista:e.tipoLista||'',entrega:e.entrega||'',obs:'',
      validado:false,validadoPor:'',fechaValidacion:'',params:e.params.map(pp=>({...pp,valor:''}))};
  });
  o.subtotal=t.sub;o.descPct=selDescGlobal;o.descuento=t.desc;o.total=t.total;
  if(o.estado==='Validada'&&o.examenes.some(e=>!e.validado))o.estado='En proceso';
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Modificación de la orden '+n+'.'+(agregados.length?' Agregados: '+agregados.join(', ')+'.':'')+
      (quitados.length?' Retirados: '+quitados.join(', ')+'.':'')+
      (t.desc?' Descuento aplicado '+L(t.desc)+'.':'')+' Nuevo total '+L(t.total)+'.'});
  selExamenes=[];selDescGlobal=0;selContexto=null;guardar(true);cerrarModal();vOrdenes();
  toast('Orden actualizada · '+L(t.total));
}

function refrescarResultados(n){
  const m=document.getElementById('modal');

  const act=document.activeElement;
  let ref=null;
  if(act&&act.tagName==='INPUT'&&act.dataset&&act.dataset.pos){
    ref={pos:act.dataset.pos,sel:act.selectionStart};
  }
  modalResultados(n,undefined,true);
  const m2=document.getElementById('modal');
  if(m2)m2.scrollTop=scroll;
  if(ref){
    const el=document.querySelector('#modal input[data-pos="'+ref.pos+'"]');
    if(el){el.focus();try{el.setSelectionRange(ref.sel,ref.sel);}catch(e){}}
  }

function serieParametro(pacCodigo,examenId,paramNombre){
  return ordenesDe(pacCodigo)
    .map(o=>{const e=o.examenes.find(x=>x.id===examenId);if(!e)return null;
      const p=e.params.find(x=>x.nombre===paramNombre);
      if(!p||p.valor==='')return null;
      const v=parseFloat(String(p.valor).replace(',','.'));
      return isNaN(v)?null:{fecha:o.fecha,valor:v,orden:o.numero,texto:p.valor,unidad:p.unidad,param:p};})
    .filter(Boolean).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function graficoLinea(serie,p,sexo,edadM){
  if(serie.length<2)return '<div class="vacio">Se necesitan al menos dos resultados numéricos para dibujar la tendencia.</div>';
  const W=620,H=210,mI=52,mD=16,mS=16,mB=34;
  const r=rangoActivo(p,sexo,edadM);
  const vals=serie.map(s=>s.valor);
  const cand=[...vals];
  if(r.min!==''&&r.min!==undefined&&!isNaN(parseFloat(r.min)))cand.push(parseFloat(r.min));
  if(r.max!==''&&r.max!==undefined&&!isNaN(parseFloat(r.max)))cand.push(parseFloat(r.max));
  let lo=Math.min(...cand),hi=Math.max(...cand);
  if(lo===hi){lo=lo-1;hi=hi+1;}
  const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
  const X=i=>mI+(W-mI-mD)*(serie.length===1?0.5:i/(serie.length-1));
  const Y=v=>mS+(H-mS-mB)*(1-(v-lo)/(hi-lo));
  const banda=(r.min!==''&&r.max!==''&&!isNaN(parseFloat(r.min))&&!isNaN(parseFloat(r.max)))
    ?`<rect x="${mI}" y="${Y(parseFloat(r.max))}" width="${W-mI-mD}" height="${Math.max(0,Y(parseFloat(r.min))-Y(parseFloat(r.max)))}" fill="#70A020" opacity=".13"/>`:'';
  const linea=serie.map((s,i)=>`${i?'L':'M'}${X(i)},${Y(s.valor)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff;border:1px solid var(--linea);border-radius:10px">
    ${banda}
    <line x1="${mI}" y1="${H-mB}" x2="${W-mD}" y2="${H-mB}" stroke="#dde5ea" stroke-width="1.5"/>
    <line x1="${mI}" y1="${mS}" x2="${mI}" y2="${H-mB}" stroke="#dde5ea" stroke-width="1.5"/>
    <text x="4" y="${Y(hi)+9}" font-size="10" fill="#8296a3">${hi.toFixed(1)}</text>
    <text x="4" y="${Y(lo)}" font-size="10" fill="#8296a3">${lo.toFixed(1)}</text>
    <path d="${linea}" fill="none" stroke="#285068" stroke-width="2.5" stroke-linejoin="round"/>
    ${serie.map((s,i)=>{const ev=evalParam({...s.param,valor:String(s.valor)},sexo);
      const col=ev.critico?'#c0392b':(ev.flag?'#b9770e':'#70A020');
      return `<circle cx="${X(i)}" cy="${Y(s.valor)}" r="5" fill="${col}" stroke="#fff" stroke-width="2"/>
      <text x="${X(i)}" y="${Y(s.valor)-11}" font-size="10.5" font-weight="700" fill="#1c2b36" text-anchor="middle">${s.texto}</text>
      <text x="${X(i)}" y="${H-mB+15}" font-size="9" fill="#8296a3" text-anchor="middle">${fmtFecha(s.fecha).slice(0,5)}</text>
      <text x="${X(i)}" y="${H-mB+26}" font-size="8" fill="#aab6bf" text-anchor="middle">${s.fecha.slice(0,4)}</text>`;}).join('')}
  </svg>`;
}

function aplicarFormato(sel,marca){
  const el=document.querySelector(sel);
  if(!el)return;
  const i=el.selectionStart,f=el.selectionEnd;
  if(i===f){toast('Selecciona primero el texto que quieres marcar');el.focus();return;}
  const antes=el.value.slice(0,i),medio=el.value.slice(i,f),desp=el.value.slice(f);
  // Si ya está marcado, se quita la marca
  const yaEsta=antes.endsWith(marca)&&desp.startsWith(marca);
  el.value=yaEsta
    ? antes.slice(0,-marca.length)+medio+desp.slice(marca.length)
    : antes+marca+medio+marca+desp;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.focus();
  const d=yaEsta?-marca.length:marca.length;
  el.setSelectionRange(i+d,f+d);
  guardar();
}

/* =============== IMPORTAR RESULTADOS DESDE TEXTO =============== */
/* Acepta lo que imprime el analizador o lo que se transcribe de una foto:
   "1 WBC 6.26 3.50-9.50 10^3/uL", "WBC: 6.26", "HGB 11.0" … */


function parsearResultados(texto,params){
  // Devuelve {asignados:{nombre:valor}, sinUsar:[líneas]}
  const asignados={},sinUsar=[];
  const nombres=params.map(p=>p.nombre);
  texto.split(/\r?\n/).forEach(linea=>{
    const cruda=linea.trim();
    if(!cruda)return;
    // Quitar numeración inicial del reporte y flechas del analizador
    let l=cruda.replace(/^\s*\d{1,2}[\).\s]\s*/,'').replace(/[↑↓▲▼]/g,' ');
    const ln=normTxt(l);
    // Buscar a qué parámetro corresponde: gana el sinónimo más largo que calce al inicio
    let mejor=null,largo=0;
    nombres.forEach(nom=>{
      if(asignados[nom])return;
      sinonimosDe(nom).forEach(kn=>{
        if(!kn)return;
        // Debe calzar al inicio y terminar en separador, para que "MCH" no capture "MCHC"
        if(ln.startsWith(kn)){
          const sig=ln.charAt(kn.length);
          if((sig===''||/[\s:=|,;]/.test(sig))&&kn.length>largo){mejor=nom;largo=kn.length;}
        }
      });
    });
    if(!mejor){sinUsar.push(cruda);return;}
    // El primer número tras el nombre es el resultado; se ignoran rangos "3.50-9.50"
    const resto=l.slice(largo).replace(/^[\s:=]+/,'');
    const m=resto.match(/^(-?\d+(?:[.,]\d+)?)(?!\s*[-–]\s*\d)/);
    if(!m){sinUsar.push(cruda);return;}
    asignados[mejor]=m[1].replace(',','.');
  });
  return {asignados,sinUsar};
}

async function pegarPortapapeles(){
  const t=document.getElementById('imp_txt');

    t.focus();

function necesitaPlantillaAnalizador(e){
  return /hemograma|biometr[ií]a/i.test(e.nombre)&&e.params.length<21;

function actualizarPlantillaAnalizador(n,ei){
  const o=S.ordenes.find(x=>x.numero===n), e=o.examenes[ei];
  const oficial=semillaExamenes().find(x=>x.nombre==='Hemograma');
  if(!oficial){toast('No se encontró la plantilla del analizador');return;}
  const conValor=e.params.filter(p=>p.valor!=='').length;
  if(!confirm('La plantilla de "'+e.nombre+'" pasará a los 21 análisis del analizador\n'+
    '(WBC, Lym%, Gran%, RBC, HGB, HCT, MCV, MCH, MCHC, RDW, PLT, MPV, PDW, PCT, P-LCR, P-LCC).\n\n'+
    (conValor?'Se conservarán los '+conValor+' resultado(s) ya capturados que tengan equivalencia.\n\n':'')+
    '¿Continuar?'))return;
  // Trasladar los valores existentes a su equivalente por sinónimos
  const previos={};
  e.params.forEach(p=>{if(p.valor!=='')sinonimosDe(p.nombre).forEach(s=>previos[s]=p.valor);});
  e.params=oficial.params.map(p=>{
    let v='';
    sinonimosDe(p.nombre).some(s=>{if(previos[s]!==undefined){v=previos[s];return true;}return false;});
    return {...p,valor:v};
  });
  e.metodo=e.metodo||oficial.metodo; e.tipoLista=oficial.tipoLista||'Análisis';
  // También la plantilla del catálogo, para las próximas órdenes
  const plant=S.examenes.find(x=>x.id===e.id);
  if(plant&&plant.params.length<21){plant.params=oficial.params.map(p=>({...p}));plant.tipoLista=oficial.tipoLista||'Análisis';}
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Plantilla de '+e.nombre+' actualizada al formato del analizador (21 análisis) en la orden '+n+'.'});
  guardar();modalImportar(n,ei);
  toast('Plantilla actualizada a 21 análisis ✓');
}

function aplicarImportar(n,ei){
  const o=S.ordenes.find(x=>x.numero===n),e=o.examenes[ei];
  if(e.validado&&!puedeValidar()){toast('Examen validado: solo un Dr o Admin puede reemplazar resultados');return;}
  const r=parsearResultados(document.getElementById('imp_txt').value,e.params);
  const hallados=Object.keys(r.asignados);
  if(!hallados.length){toast('No se reconoció ningún análisis');return;}
  const ocupados=e.params.filter(p=>p.valor!==''&&r.asignados[p.nombre]&&r.asignados[p.nombre]!==p.valor);
  if(ocupados.length&&!confirm(ocupados.length+' análisis ya tienen un valor distinto capturado.\n\n¿Reemplazarlos con los datos importados?'))return;
  e.params.forEach(p=>{if(r.asignados[p.nombre]!==undefined)p.valor=r.asignados[p.nombre];});
  calcularFormulas(e);
  calcularLDLOrden(o);
  if(o.estado==='Pendiente')o.estado='En proceso';
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:'Importación de '+hallados.length+' resultado(s) de '+e.nombre+' en la orden '+n+' desde texto del analizador.'});
  guardar();modalResultados(n);
  toast(hallados.length+' resultado(s) importados ✓');
}

function cambiarEstado(n,est){
  const o=S.ordenes.find(x=>x.numero===n);
  if(est==='Entregada'&&S.config.alertas.validacionDoble&&o.examenes.some(e=>!e.validado)){
    toast('No se puede entregar: hay exámenes sin validar');modalResultados(n);return;

function numeroRecibo(){
  const c=S.config;
  const n=S.seq.rec;
  if(c.facturaSerie){  // Con autorización SAR: serie + correlativo de 8 dígitos
    return c.facturaSerie+String(n).padStart(8,'0');
  }
  return (c.reciboPrefijo||'RV')+'-'+hoy().slice(0,4)+'-'+String(n).padStart(4,'0');
}
function calcRecibo(r){
  const sub=r.items.reduce((a,i)=>a+((Number(i.precio)||0)*(i.cantidad||1)),0);
  const descLineas=r.items.reduce((a,i)=>a+(descItem(i)*(i.cantidad||1)),0);
  const neto=Math.max(0,sub-descLineas);
  const pctG=Math.min(100,Math.max(0,Number(r.descPct)||0));
  const descGlobal=round2(neto*pctG/100);
  const descuento=round2(descLineas+descGlobal);
  const base=Math.max(0,sub-descuento);
  const gravado=r.items.filter(i=>i.gravado)
    .reduce((a,i)=>a+((Number(i.precio)-descItem(i))*(i.cantidad||1)),0)*(1-pctG/100);
  const exento=Math.max(0,base-gravado);
  const isv=round2(gravado*0.15);
  return {sub:round2(sub),descuento,pctTotal:sub?round2(descuento/sub*100):0,
    gravado:round2(gravado),exento:round2(exento),isv,total:round2(base+isv)};
}

function anularRecibo(num){

  const r=S.recibos.find(x=>x.numero===num);if(!r)return;
  const motivo=prompt('Motivo de la anulación del recibo '+num+':');

  const t=calcRecibo(r);
  r.anulado=true;r.motivoAnulacion=motivo.trim();r.fechaAnulacion=hoy();r.horaAnulacion=ahoraHora();
  // Si generó ingreso, se contrapartida para no descuadrar la contabilidad
  if(r.movRef){

      tipo:'Egreso',metodo:r.metodo,categoria:'Anulaciones',

/* =============== CONTROL DE CALIDAD INTERNO =============== */
/* Cada material control tiene su media y desviación estándar (del inserto o
   establecidas por el laboratorio con ≥20 corridas). Cada valor se grafica en
   Levey-Jennings y se evalúa con las reglas de Westgard. */
function ccNivelLabel(n){return {1:'Nivel 1 (normal)',2:'Nivel 2 (patológico)',3:'Nivel 3 (alto)'}[n]||('Nivel '+n);}
function ccDatos(cid){return (S.cc.datos||[]).filter(d=>d.controlId===cid).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));}
function ccEstad(vals){
  const n=vals.length; if(!n)return {n:0,media:0,de:0,cv:0};
  const media=vals.reduce((a,v)=>a+v,0)/n;
  const de=n>1?Math.sqrt(vals.reduce((a,v)=>a+Math.pow(v-media,2),0)/(n-1)):0;
  return {n,media,de,cv:media?de/media*100:0};
}
function ccZ(valor,c){ return c.de?(valor-c.media)/c.de:0; }

/* Reglas de Westgard evaluadas sobre la serie del control */
function westgard(serie,idx,pareja){
  const z=serie.map(d=>d.z);
  const av=[],rech=[];
  const zi=z[idx];
  if(Math.abs(zi)>=3)rech.push('1-3s');
  else if(Math.abs(zi)>=2)av.push('1-2s');
  // 2-2s: dos consecutivos del mismo lado ≥2s
  if(idx>=1&&Math.abs(zi)>=2&&Math.abs(z[idx-1])>=2&&Math.sign(zi)===Math.sign(z[idx-1]))rech.push('2-2s');
  // R-4s: diferencia ≥4s entre dos consecutivos (o entre niveles de la misma corrida)
  if(idx>=1&&Math.abs(zi-z[idx-1])>=4)rech.push('R-4s');
  if(pareja!==undefined&&Math.abs(zi-pareja)>=4)rech.push('R-4s (entre niveles)');
  // 4-1s: cuatro consecutivos del mismo lado ≥1s
  if(idx>=3){
    const u=z.slice(idx-3,idx+1);
    if(u.every(v=>v>=1)||u.every(v=>v<=-1))rech.push('4-1s');
  }
  // 10x: diez consecutivos del mismo lado de la media
  if(idx>=9){
    const u=z.slice(idx-9,idx+1);
    if(u.every(v=>v>0)||u.every(v=>v<0))rech.push('10x');
  }
  return {avisos:av,rechazos:rech};
}
function ccEvaluar(cid){
  const c=S.cc.controles.find(x=>x.id===cid); if(!c)return [];
  const serie=ccDatos(cid).map(d=>({...d,z:ccZ(Number(d.valor),c)}));
  serie.forEach((d,i)=>{
    const r=westgard(serie,i);
    d.avisos=r.avisos; d.rechazos=r.rechazos;
    d.estado=r.rechazos.length?'Rechazo':(r.avisos.length?'Advertencia':'Aceptado');
  });
  return serie;
}

/* Miniatura de la serie dentro de la tabla */
function miniLJ(serie){
  if(!serie.length)return '<span style="color:var(--gris)">—</span>';
  const w=118,hh=30;
  const pts=serie.map((d,i)=>{
    const x=serie.length>1?(i/(serie.length-1))*(w-8)+4:w/2;
    const y=hh/2-Math.max(-3.4,Math.min(3.4,d.z))*(hh/2-3)/3.4;
    return {x,y,d};
  });
  return `<svg width="${w}" height="${hh}" style="vertical-align:middle">
    <rect x="0" y="${hh/2-(hh/2-3)*2/3.4}" width="${w}" height="${(hh/2-3)*4/3.4}" fill="#eef6e2"/>
    <line x1="0" y1="${hh/2}" x2="${w}" y2="${hh/2}" stroke="#70A020" stroke-width="1"/>
    <polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#285068" stroke-width="1.2"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="2.2"
      fill="${p.d.estado==='Rechazo'?'#c0392b':p.d.estado==='Advertencia'?'#b8974a':'#285068'}"><title>${fmtFecha(p.d.fecha)}: ${p.d.valor} (z=${p.d.z.toFixed(2)})</title></circle>`).join('')}
  </svg>`;
}

/* ---- Gráfico Levey-Jennings a tamaño completo ---- */
function graficoLJ(c,serie,ancho,alto){
  const W=ancho||760, H=alto||300, mI=54, mD=16, mS=16, mB=34;
  const gw=W-mI-mD, gh=H-mS-mB;
  const yz=z=>mS+gh/2-(Math.max(-3.6,Math.min(3.6,z))/3.6)*(gh/2);
  const xi=i=>serie.length>1?mI+(i/(serie.length-1))*gw:mI+gw/2;
  const bandas=[[3,'#fdecea'],[2,'#fdf3e3'],[1,'#eef6e2']];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff">
    ${bandas.map(([z,col])=>`<rect x="${mI}" y="${yz(z)}" width="${gw}" height="${yz(-z)-yz(z)}" fill="${col}"/>`).join('')}
    ${[3,2,1,0,-1,-2,-3].map(z=>`
      <line x1="${mI}" y1="${yz(z)}" x2="${W-mD}" y2="${yz(z)}"
        stroke="${z===0?'#70A020':Math.abs(z)===3?'#c0392b':Math.abs(z)===2?'#b8974a':'#c9d5dd'}"
        stroke-width="${z===0?1.6:1}" stroke-dasharray="${z===0?'':'4,3'}"/>
      <text x="${mI-6}" y="${yz(z)+3.5}" text-anchor="end" font-size="9.5" fill="#5f7383">
        ${z===0?'x̄':(z>0?'+':'')+z+'s'}</text>
      <text x="${mI-6}" y="${yz(z)+14}" text-anchor="end" font-size="8" fill="#8fa2ae">
        ${(c.media+z*c.de).toFixed(2)}</text>`).join('')}

function previewZ(cid,val){
  const c=S.cc.controles.find(x=>x.id===cid), el=document.getElementById('z_'+cid);
  if(!el||!c)return;
  if(val===''||isNaN(Number(val))){el.textContent='—';el.style.color='';return;}
  const z=ccZ(Number(val),c);
  el.textContent=(z>0?'+':'')+z.toFixed(2)+'s';
  el.style.color=Math.abs(z)>=3?'var(--rojo)':Math.abs(z)>=2?'var(--ambar)':'var(--verde)';
}
function guardarCorrida(){
  const f=document.getElementById('cr_fecha').value||hoy();
  const hr=document.getElementById('cr_hora').value||ahoraHora();
  const resp=document.getElementById('cr_resp').value.trim()||usuarioActivo().nombre;
  let n=0; const alertas=[];
  S.cc.controles.forEach(c=>{
    const el=document.getElementById('v_'+c.id); if(!el||el.value==='')return;
    const valor=Number(el.value); if(isNaN(valor))return;
    const lote=(document.getElementById('l_'+c.id)||{value:''}).value.trim();
    // Reemplaza el valor de ese mismo día si ya existía
    S.cc.datos=S.cc.datos.filter(d=>!(d.controlId===c.id&&d.fecha===f&&d.hora===hr));
    S.cc.datos.push({id:'D-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      controlId:c.id,fecha:f,hora:hr,valor:valor,lote:lote,responsable:resp,accion:''});
    n++;
    const serie=ccEvaluar(c.id); const ult=serie[serie.length-1];
    if(ult&&ult.estado!=='Aceptado')alertas.push(c.analito+' '+ccNivelLabel(c.nivel).replace(/ \(.*/,'')+': '+
      [...ult.rechazos,...ult.avisos].join(', '));
  });
  if(!n){toast('No se capturó ningún valor');return;}
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:resp,tipo:'Control de calidad',
    descripcion:'Corrida de control interno del '+fmtFecha(f)+': '+n+' determinación(es).'+
      (alertas.length?' Alertas: '+alertas.join(' · '):' Todos dentro de control.')});
  guardar(true);cerrarModal();vCalidad();
  if(alertas.length)toast(n+' valores guardados · '+alertas.length+' con alerta de Westgard');
  else toast(n+' valores guardados · todos en control ✓');
}

const CAT_INSUMO=['Reactivo','Control / Calibrador','Material de vidrio','Descartable','Tubo de muestra',
 'Tira reactiva','Medio de cultivo','Antisuero','Papelería','Limpieza y bioseguridad','Equipo / repuesto','Otro'];
function stockInsumo(i){return Number(i.stock)||0;}
function estadoInsumo(i){
  const hoyF=hoy();
  if(i.vence&&i.vence<hoyF)return {k:'vencido',t:'Vencido',c:'chip-rj'};
  if(i.vence&&diasEntre(hoyF,i.vence)<=(S.config.diasAvisoVence||30))return {k:'porvencer',t:'Por vencer',c:'chip-am'};
  if(stockInsumo(i)<=0)return {k:'agotado',t:'Agotado',c:'chip-rj'};
  if(stockInsumo(i)<=Number(i.minimo||0))return {k:'bajo',t:'Bajo mínimo',c:'chip-am'};
  return {k:'ok',t:'Disponible',c:'chip-vd'};
}
function diasEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}

function vAlmacen(filtro=''){
  const ins=S.almacen.insumos;
  const est=ins.map(estadoInsumo);
  const nVenc=est.filter(e=>e.k==='vencido').length;
  const nPor=est.filter(e=>e.k==='porvencer').length;
  const nBajo=est.filter(e=>e.k==='bajo'||e.k==='agotado').length;
  const valor=ins.reduce((a,i)=>a+stockInsumo(i)*(Number(i.costo)||0),0);
  vista.innerHTML=`
  <div class="cabecera"><h2>Almacén</h2>
    <div style="display:flex;gap:10px">

      <button class="btn btn-d" onclick="modalMovAlmacen()">± Movimiento</button>

      <button class="btn btn-p" onclick="modalInsumo()">+ Nuevo insumo</button>
    </div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="n">${ins.length}</div><div class="t">Insumos registrados</div></div>
    <div class="kpi" style="border-left-color:var(--ambar)"><div class="n" style="color:var(--ambar)">${nBajo}</div><div class="t">Bajo mínimo o agotados</div></div>
    <div class="kpi" style="border-left-color:var(--rojo)"><div class="n" style="color:var(--rojo)">${nVenc}</div><div class="t">Vencidos · ${nPor} por vencer</div></div>
    <div class="kpi" style="border-left-color:var(--verde)"><div class="n" style="color:var(--verde)">${L(valor)}</div><div class="t">Valor del inventario</div></div>
  </div>

  ${nBajo?`<div class="aviso"><b>Reponer:</b> ${ins.filter(i=>['bajo','agotado'].includes(estadoInsumo(i).k)).map(i=>esc(i.nombre)+' ('+stockInsumo(i)+' '+esc(i.unidad||'u')+')').join(' · ')}.</div>`:''}

    el saldo baja del mínimo o cuando el lote está por vencer (${S.config.diasAvisoVence||30} días de anticipación, configurable).</div>`;

function trasAbrir(fn){ try{ fn(); }catch(e){ console.warn('Preparación de la ventana:',e.message); } }
function filasAlmacen(filtro=''){
  const f=normTxt(filtro);
  const ins=S.almacen.insumos.filter(i=>normTxt(i.nombre+' '+(i.lote||'')+' '+(i.proveedor||'')+' '+(i.ubicacion||'')+' '+i.categoria).includes(f));
  if(!ins.length)return `<div class="vacio">${filtro?'Ningún insumo coincide con “'+esc(filtro)+'”.':'Almacén vacío. Registra el primer insumo con “+ Nuevo insumo”.'}</div>`;
  const orden={vencido:0,agotado:1,bajo:2,porvencer:3,ok:4};
  ins.sort((a,b)=>orden[estadoInsumo(a).k]-orden[estadoInsumo(b).k]||a.nombre.localeCompare(b.nombre));
  return `<table><thead><tr><th>Insumo</th><th>Categoría</th><th>Lote / Vence</th><th style="text-align:right">Existencia</th>
    <th style="text-align:right">Mínimo</th><th>Ubicación</th><th>Estado</th><th></th></tr></thead><tbody>
    ${ins.map(i=>{const e=estadoInsumo(i);const d=i.vence?diasEntre(hoy(),i.vence):null;return `<tr>
      <td><b>${esc(i.nombre)}</b>${i.marca?`<div style="font-size:9.5px;color:var(--gris)">${esc(i.marca)}${i.presentacion?' · '+esc(i.presentacion):''}</div>`:''}</td>

function guardarInsumo(iid){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('al_nombre')){toast('Escribe el nombre del insumo');return;}
  const d={nombre:g('al_nombre'),categoria:g('al_cat'),marca:g('al_marca'),presentacion:g('al_pres'),
    unidad:g('al_unidad')||'unidad',lote:g('al_lote'),vence:g('al_vence'),minimo:Number(g('al_min'))||0,
    costo:Number(g('al_costo'))||0,proveedor:g('al_prov'),ubicacion:g('al_ubi'),obs:g('al_obs')};
  if(iid)Object.assign(S.almacen.insumos.find(x=>x.id===iid),d);
  else{
    d.id='INS-'+Date.now().toString(36); d.stock=Number(g('al_stock'))||0;
    S.almacen.insumos.push(d);
    if(d.stock)S.almacen.movs.push({id:'M-'+Date.now().toString(36),insumoId:d.id,fecha:hoy(),hora:ahoraHora(),
      tipo:'Entrada',cantidad:d.stock,saldo:d.stock,motivo:'Existencia inicial',lote:d.lote,
      responsable:usuarioActivo().nombre});
  }
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,tipo:'Actividad de rutina',
    descripcion:(iid?'Modificación':'Alta')+' del insumo "'+d.nombre+'" en almacén.'});
  guardar(true);cerrarModal();vAlmacen();toast('Insumo guardado ✓');
}
function borrarInsumo(iid){
  const i=S.almacen.insumos.find(x=>x.id===iid);
  const n=S.almacen.movs.filter(m=>m.insumoId===iid).length;
  if(!confirm('¿Eliminar "'+i.nombre+'" del almacén?'+(n?'\nSe perderán '+n+' movimiento(s) del kardex.':'')))return;
  S.almacen.insumos=S.almacen.insumos.filter(x=>x.id!==iid);
  S.almacen.movs=S.almacen.movs.filter(m=>m.insumoId!==iid);
  guardar();cerrarModal();vAlmacen();toast('Insumo eliminado');
}

function refSaldoMov(){
  const c=document.getElementById('mv_saldo'); if(!c)return;
  const sel=document.getElementById('mv_ins');
  // Si el navegador aún no aplicó el "selected", se toma el primero de la lista
  const i=S.almacen.insumos.find(x=>x.id===(sel&&sel.value))||S.almacen.insumos[0];
  if(!i){c.innerHTML='';return;}
  const tipo=(document.getElementById('mv_tipo')||{value:'Entrada'}).value;
  const cant=Number((document.getElementById('mv_cant')||{value:0}).value)||0;
  const signo=tipo==='Entrada'?1:tipo==='Ajuste'?0:-1;
  const nuevo=tipo==='Ajuste'?cant:stockInsumo(i)+signo*cant;
  c.innerHTML=`<div class="aviso" style="margin-top:8px">
    Existencia actual: <b>${stockInsumo(i)} ${esc(i.unidad||'u')}</b> →
    después del movimiento: <b style="color:${nuevo<0?'var(--rojo)':nuevo<=Number(i.minimo||0)?'var(--ambar)':'var(--verde)'}">${nuevo} ${esc(i.unidad||'u')}</b>
    ${nuevo<0?' · <b style="color:var(--rojo)">La existencia no puede quedar negativa</b>':''}
    ${(nuevo>=0&&nuevo<=Number(i.minimo||0))?' · quedará por debajo del mínimo ('+(i.minimo||0)+')':''}
  </div>`;
}
function guardarMovAlmacen(){
  const sel=document.getElementById('mv_ins');
  const i=S.almacen.insumos.find(x=>x.id===(sel&&sel.value))||S.almacen.insumos[0];
  if(!i){toast('Selecciona un insumo');return;}
  const tipo=document.getElementById('mv_tipo').value;
  const cant=Number(document.getElementById('mv_cant').value)||0;
  if(cant<=0&&tipo!=='Ajuste'){toast('La cantidad debe ser mayor que cero');return;}
  const signo=tipo==='Entrada'?1:tipo==='Ajuste'?0:-1;
  const nuevo=tipo==='Ajuste'?cant:stockInsumo(i)+signo*cant;
  if(nuevo<0){toast('La existencia no puede quedar negativa');return;}
  const lote=document.getElementById('mv_lote').value.trim();
  i.stock=nuevo;
  if(tipo==='Entrada'&&lote)i.lote=lote;
  S.almacen.movs.push({id:'M-'+Date.now().toString(36),insumoId:i.id,fecha:hoy(),hora:ahoraHora(),
    tipo,cantidad:cant,saldo:nuevo,motivo:document.getElementById('mv_motivo').value.trim(),
    lote:lote||i.lote,responsable:document.getElementById('mv_resp').value.trim()||usuarioActivo().nombre});
  if(/^Baja/.test(tipo))S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,
    tipo:'No conformidad',descripcion:tipo+' de '+cant+' '+(i.unidad||'u')+' de "'+i.nombre+'" (lote '+(lote||i.lote||'—')+').'});
  guardar(true);cerrarModal();vAlmacen();
  toast(tipo+' registrada · saldo '+nuevo+' '+(i.unidad||'u'));
}

/* Genera un informe de muestra con datos ficticios para revisar cómo quedarán
   los rangos de referencia, unidades, subsecciones y leyendas antes de usar la
   plantilla con pacientes reales. No toca ningún dato del sistema. */
let demoSexo='F', demoValores='ejemplo';
function pacienteDemo(sexo){
  return {codigo:'DEMO',nombre1:sexo==='M'?'Juan':'María',nombre2:sexo==='M'?'Carlos':'Elena',
    apellido1:'Pérez',apellido2:'Ejemplo',nombre:(sexo==='M'?'Juan Carlos':'María Elena')+' Pérez Ejemplo',
    idTipo:'DNI',idNumero:'0000-0000-00000',fnac:'1985-06-15',sexo,tel:'',dir:'',medico:'Muestra de plantilla'};
}
/* Valor de ejemplo coherente con el rango de cada análisis */
function valorEjemplo(pp,sexo){
  if(pp.formula)return '';                                   // los calculados se derivan solos
  if(pp.opciones&&pp.opciones.length)return pp.opciones[0];  // primera opción de la lista
  const mi=sexo==='F'&&pp.refMinF!==''&&pp.refMinF!==undefined?pp.refMinF:pp.refMin;
  const ma=sexo==='F'&&pp.refMaxF!==''&&pp.refMaxF!==undefined?pp.refMaxF:pp.refMax;
  const a=parseFloat(mi), b=parseFloat(ma);
  if(!isNaN(a)&&!isNaN(b)){
    const v=(a+b)/2;
    const dec=(String(mi)+String(ma)).includes('.')?
      Math.max((String(mi).split('.')[1]||'').length,(String(ma).split('.')[1]||'').length):0;
    return v.toFixed(dec);
  }
  if(!isNaN(b))return (b*0.8).toFixed(String(ma).includes('.')?2:0);   // solo tope: valor por debajo
  if(!isNaN(a))return (a*1.2).toFixed(String(mi).includes('.')?2:0);   // solo piso: valor por encima
  if(pp.refTexto)return pp.refTexto.split('\n')[0].split(':').pop().trim().slice(0,26);
  return '—';
}
function ordenDemo(ids,sexo,modo){
  const p=pacienteDemo(sexo);
  const exs=ids.map(id=>{
    const e=S.examenes.find(x=>x.id===id); if(!e)return null;
    return {id:e.id,nombre:e.nombre,area:e.area,tubo:e.tubo,precio:e.precio,
      metodo:e.metodo||'',leyenda:e.leyenda||'',tipoLista:e.tipoLista||'',entrega:e.entrega||'',obs:'',
      validado:true,validadoPor:S.config.profesional||S.config.regente,fechaValidacion:hoy(),
      params:e.params.map(pp=>({...pp,valor:modo==='vacio'?'':valorEjemplo(pp,sexo)}))};
  }).filter(Boolean);
  const o={_demo:true,_pac:p,numero:numeroOrden(hoy()),fecha:hoy(),hora:ahoraHora(),
    pacCodigo:'DEMO',pacienteNombre:p.nombre,estado:'Validada',
    validadoPor:S.config.profesional||S.config.regente,fechaValidacion:hoy(),horaValidacion:ahoraHora(),
    examenes:exs,obsAreas:{},total:exs.reduce((a,e)=>a+e.precio,0),subtotal:0,descuento:0,pagada:true,entrega:'',layout:'area'};
  if(modo!=='vacio')exs.forEach(e=>calcularFormulas(e));
  if(modo!=='vacio')calcularLDLOrden(o);
  return o;
}

/* ---------- Indicadores de calidad ---------- */
function calcIndicadores(mes){
  const m=mes||hoy().slice(0,7);
  const ords=S.ordenes.filter(o=>o.fecha.startsWith(m));
  let totalEx=0,validados=0,criticos=0,aTiempo=0,conEntrega=0;
  ords.forEach(o=>{
    o.examenes.forEach(e=>{totalEx++;if(e.validado)validados++;});
    criticos+=alertasOrden(o).length;
    if(o.entrega){conEntrega++;if(o.fechaEntregado?o.fechaEntregado<=o.entrega:o.estado==='Entregada')aTiempo++;}
  });
  const ccTotal=(S.cc.datos||[]).filter(d=>d.fecha.startsWith(m));
  let ccOk=0;
  (S.cc.controles||[]).forEach(c=>{
    ccEvaluar(c.id).filter(d=>d.fecha.startsWith(m)).forEach(d=>{if(d.estado!=='Rechazo')ccOk++;});
  });
  return {mes:m,ordenes:ords.length,totalEx,validados,criticos,
    oportunidad:conEntrega?Math.round(aTiempo/conEntrega*100):100,
    ccOk:ccTotal.length?Math.round(ccOk/ccTotal.length*100):100,
    ncMes:(S.sgc.nc||[]).filter(x=>x.fecha.startsWith(m)).length};
}

function guardarDoc(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('dc_cod')||!g('dc_tit')){toast('Código y título son obligatorios');return;}
  const prev=id?S.sgc.documentos.find(x=>x.id===id):null;
  const d={codigo:g('dc_cod'),titulo:g('dc_tit'),tipo:g('dc_tipo'),version:g('dc_ver'),estado:g('dc_estado'),
    aprobacion:g('dc_apr'),proxRevision:g('dc_prox'),responsable:g('dc_resp'),ubicacion:g('dc_ubi')};
  if(prev){
    // Cambio de versión: se conserva el historial completo
    if(prev.version!==d.version||prev.estado!==d.estado){
      prev.historial=prev.historial||[];
      prev.historial.push({version:prev.version,estado:prev.estado,aprobacion:prev.aprobacion,
        fecha:hoy(),hora:ahoraHora(),motivo:g('dc_motivo')||'Actualización de versión',responsable:usuarioActivo().nombre});
    }
    Object.assign(prev,d);
  }else{
    d.id='DOC-'+Date.now().toString(36);
    d.historial=[{version:d.version,estado:d.estado,aprobacion:d.aprobacion,fecha:hoy(),hora:ahoraHora(),
      motivo:'Emisión inicial',responsable:usuarioActivo().nombre}];
    S.sgc.documentos.push(d);
  }
  registrarSGC('Documento '+d.codigo+' v'+d.version+' ('+d.estado+')'+(prev?' actualizado':' emitido')+'.');
  guardar(true);cerrarModal();vSGC();toast('Documento guardado ✓');
}
function borrarDoc(id){
  const d=S.sgc.documentos.find(x=>x.id===id);
  if(!confirm('¿Eliminar el documento '+d.codigo+' del listado maestro?\n\nSi el documento dejó de aplicar, es preferible marcarlo como Obsoleto: así queda la evidencia de su retiro.'))return;
  S.sgc.documentos=S.sgc.documentos.filter(x=>x.id!==id);
  registrarSGC('Documento '+d.codigo+' eliminado del listado maestro.');
  guardar(true);cerrarModal();vSGC();
}
function modalHistDoc(id){
  const d=S.sgc.documentos.find(x=>x.id===id);
  abrirModal(`

  <div style="font-size:12.5px;color:var(--gris);margin-bottom:10px">${esc(d.titulo)}</div>
  <table><thead><tr><th>Versión</th><th>Estado</th><th>Aprobación</th><th>Registrado</th><th>Motivo del cambio</th><th>Responsable</th></tr></thead><tbody>

function modalNC(id){

function guardarNC(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('nc_desc')){toast('Describe el hallazgo');return;}
  const estado=g('nc_estado');
  if(estado==='Cerrada'&&!g('nc_verif')){
    toast('Para cerrar se requiere la verificación de eficacia');return;}
  if(estado==='Cerrada'&&!g('nc_causa')){
    toast('Para cerrar se requiere el análisis de causa raíz');return;}
  const d={fecha:g('nc_fecha'),origen:g('nc_origen'),detectadaPor:g('nc_quien'),descripcion:g('nc_desc'),
    correccion:g('nc_corr'),causa:g('nc_causa'),accion:g('nc_accion'),responsable:g('nc_resp'),
    plazo:g('nc_plazo'),estado,verificacion:g('nc_verif')};
  const prev=id?S.sgc.nc.find(x=>x.id===id):null;
  if(prev){
    if(prev.estado!=='Cerrada'&&estado==='Cerrada'){d.fechaCierre=hoy();d.cerradaPor=usuarioActivo().nombre;}
    Object.assign(prev,d);
  }else{
    d.id='NC-'+Date.now().toString(36);
    d.numero='NC-'+hoy().slice(0,4)+'-'+String(S.sgc.nc.length+1).padStart(3,'0');
    S.sgc.nc.push(d);
  }
  registrarSGC('No conformidad '+(prev?prev.numero:d.numero)+' '+(prev?'actualizada':'registrada')+' — estado '+estado+'.','No conformidad');
  guardar(true);cerrarModal();vSGC();toast('No conformidad guardada ✓');
}
/* Registro unificado en la bitácora del SGC */
function registrarSGC(texto,tipo){
  S.bitacora.push({fecha:hoy(),hora:ahoraHora(),responsable:usuarioActivo().nombre,
    tipo:tipo||'Gestión de calidad',descripcion:texto});
}

function guardarPersonal(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('pe_nom')){toast('El nombre es obligatorio');return;}
  const areas=[...document.querySelectorAll('.pe_area')].filter(c=>c.checked).map(c=>c.value);
  const d={nombre:g('pe_nom'),cargo:g('pe_cargo'),identificacion:g('pe_id'),colegiacion:g('pe_col'),
    ingreso:g('pe_ing'),formacion:g('pe_form'),areas,autorizaFirma:g('pe_firma')==='si',
    ultEvaluacion:g('pe_ev'),proxEvaluacion:g('pe_prox'),resultadoEval:g('pe_res'),activo:g('pe_activo')==='si'};
  const prev=id?S.sgc.personal.find(x=>x.id===id):null;
  if(prev)Object.assign(prev,d);
  else{d.id='PER-'+Date.now().toString(36);d.capacitaciones=[];S.sgc.personal.push(d);}
  registrarSGC('Expediente de personal de '+d.nombre+(prev?' actualizado':' creado')+
    (d.autorizaFirma?' · autorizado a firmar resultados':'')+'.');
  guardar(true);cerrarModal();vSGC();toast('Expediente guardado ✓');
}
function agregarCapacitacion(id){
  const p=S.sgc.personal.find(x=>x.id===id);
  const tema=prompt('Tema de la capacitación:');if(!tema)return;
  const fecha=prompt('Fecha (AAAA-MM-DD):',hoy());if(!fecha)return;
  const horas=prompt('Duración en horas:','')||'';
  const imparte=prompt('Impartida por:','')||'';
  const vence=prompt('Vence el (AAAA-MM-DD, dejar vacío si no vence):','')||'';
  p.capacitaciones=p.capacitaciones||[];
  p.capacitaciones.push({tema:tema.trim(),fecha,horas,imparte,vence});
  registrarSGC('Capacitación registrada para '+p.nombre+': '+tema.trim()+'.');
  guardar(true);modalPersonal(id);
}
function quitarCapacitacion(id,i){
  const p=S.sgc.personal.find(x=>x.id===id);
  if(!confirm('¿Quitar "'+p.capacitaciones[i].tema+'" del expediente?'))return;
  p.capacitaciones.splice(i,1);guardar(true);modalPersonal(id);
}

function guardarEquipo(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('eq_nom')){toast('El nombre del equipo es obligatorio');return;}
  const d={nombre:g('eq_nom'),codigo:g('eq_cod'),marca:g('eq_marca'),modelo:g('eq_mod'),serie:g('eq_serie'),
    ubicacion:g('eq_ubi'),instalacion:g('eq_inst'),proveedor:g('eq_prov'),ultMant:g('eq_um'),proxMant:g('eq_pm'),
    frecMant:g('eq_fm'),ultCal:g('eq_uc'),proxCal:g('eq_pc'),estado:g('eq_estado')};
  const prev=id?S.sgc.equipos.find(x=>x.id===id):null;
  if(prev)Object.assign(prev,d);
  else{d.id='EQ-'+Date.now().toString(36);d.intervenciones=[];S.sgc.equipos.push(d);}
  if(d.estado==='Fuera de servicio')
    registrarSGC('Equipo '+d.nombre+' marcado FUERA DE SERVICIO. No debe usarse para resultados de pacientes.','No conformidad');
  else registrarSGC('Ficha del equipo '+d.nombre+(prev?' actualizada':' creada')+'.');
  guardar(true);cerrarModal();vSGC();toast('Equipo guardado ✓');
}
function registrarIntervencion(id){
  const e=S.sgc.equipos.find(x=>x.id===id);
  const tipo=prompt('Tipo de intervención:\n(Mantenimiento preventivo, Mantenimiento correctivo, Calibración, Verificación)','Mantenimiento preventivo');
  if(!tipo)return;
  const desc=prompt('Descripción de lo realizado:');if(!desc)return;
  const resp=prompt('Realizada por:',usuarioActivo().nombre)||'';
  const verif=prompt('Verificación posterior (cómo se comprobó que quedó operativo):','')||'';
  const fecha=prompt('Fecha (AAAA-MM-DD):',hoy())||hoy();
  e.intervenciones=e.intervenciones||[];
  e.intervenciones.push({fecha,tipo:tipo.trim(),descripcion:desc.trim(),responsable:resp,verificacion:verif});
  if(/calibra/i.test(tipo))e.ultCal=fecha; else e.ultMant=fecha;
  registrarSGC(tipo.trim()+' del equipo '+e.nombre+': '+desc.trim()+(verif?' Verificación: '+verif:''));
  guardar(true);modalEquipo(id);
  toast('Intervención registrada ✓');
}

/* ---------- Indicadores de calidad (ISO 15189 §8.8 · ISO 9001 §9.1) ---------- */
function tabIndicadores(){
  const meses=[...Array(6)].map((_,i)=>{const d=new Date(hoy()+'T12:00:00');d.setMonth(d.getMonth()-i);
    return d.toISOString().slice(0,7);}).reverse();
  const datos=meses.map(m=>calcIndicadores(m));
  const meta={oportunidad:90,ccOk:95};
  const barra=(vals,campo,color,metaV)=>{
    const max=Math.max(100,...vals.map(v=>v[campo]));
    return `<svg viewBox="0 0 320 90" style="width:100%;height:auto">
      ${metaV?`<line x1="0" y1="${80-metaV/max*70}" x2="320" y2="${80-metaV/max*70}" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="318" y="${76-metaV/max*70}" text-anchor="end" font-size="7" fill="#c0392b">meta ${metaV}%</text>`:''}
      ${vals.map((v,i)=>{const h=v[campo]/max*70,x=i*52+12;
        return `<rect x="${x}" y="${80-h}" width="34" height="${h}" rx="3" fill="${v[campo]>=(metaV||0)?color:'#c0392b'}"/>
          <text x="${x+17}" y="${77-h}" text-anchor="middle" font-size="8" font-weight="700" fill="#16242e">${v[campo]}</text>
          <text x="${x+17}" y="88" text-anchor="middle" font-size="7" fill="#5f7383">${v.mes.slice(5)}/${v.mes.slice(2,4)}</text>`;}).join('')}
    </svg>`;};
  const act=datos[datos.length-1];
  return `
  <div class="ayuda" style="margin-bottom:12px">Indicadores calculados con los datos reales del sistema.
    Sirven como entrada para la revisión por la dirección y para demostrar la mejora continua.
    Las metas son las que el laboratorio define en su política de calidad.</div>
  <div class="rejilla c2">
    <div class="tarjeta"><h3 style="color:var(--azul);margin-bottom:8px">Oportunidad de entrega (meta ${meta.oportunidad} %)</h3>
      ${barra(datos,'oportunidad','#70A020',meta.oportunidad)}
      <div class="ayuda">Porcentaje de órdenes entregadas dentro del tiempo prometido al paciente.</div></div>
    <div class="tarjeta"><h3 style="color:var(--azul);margin-bottom:8px">Control de calidad en control (meta ${meta.ccOk} %)</h3>
      ${barra(datos,'ccOk','#285068',meta.ccOk)}
      <div class="ayuda">Corridas de control sin regla de rechazo de Westgard.</div></div>
    <div class="tarjeta"><h3 style="color:var(--azul);margin-bottom:8px">Volumen de trabajo</h3>
      ${barra(datos,'ordenes','#b8974a',0)}
      <div class="ayuda">Órdenes procesadas por mes.</div></div>
    <div class="tarjeta"><h3 style="color:var(--azul);margin-bottom:8px">No conformidades</h3>
      ${barra(datos,'ncMes','#9a6200',0)}
      <div class="ayuda">Registradas por mes. Un aumento puede indicar mejor detección, no peor calidad.</div></div>
  </div>
  <div class="tarjeta">
    <h3 style="color:var(--azul);margin-bottom:10px">Detalle del mes en curso (${act.mes})</h3>
    <table><thead><tr><th>Indicador</th><th style="text-align:right">Resultado</th><th style="text-align:right">Meta</th><th>Cumple</th></tr></thead><tbody>
      <tr><td>Oportunidad de entrega</td><td style="text-align:right"><b>${act.oportunidad} %</b></td><td style="text-align:right">≥ ${meta.oportunidad} %</td>
        <td>${act.oportunidad>=meta.oportunidad?'<span class="chip chip-vd">Sí</span>':'<span class="chip chip-rj">No</span>'}</td></tr>
      <tr><td>Control interno en control</td><td style="text-align:right"><b>${act.ccOk} %</b></td><td style="text-align:right">≥ ${meta.ccOk} %</td>
        <td>${act.ccOk>=meta.ccOk?'<span class="chip chip-vd">Sí</span>':'<span class="chip chip-rj">No</span>'}</td></tr>
      <tr><td>Exámenes validados</td><td style="text-align:right"><b>${act.validados}</b> de ${act.totalEx}</td><td style="text-align:right">100 % antes de entregar</td>
        <td>${act.validados===act.totalEx?'<span class="chip chip-vd">Sí</span>':'<span class="chip chip-am">En proceso</span>'}</td></tr>
      <tr><td>Valores críticos detectados y notificados</td><td style="text-align:right"><b>${act.criticos}</b></td><td style="text-align:right">100 % notificados</td>
        <td><span class="chip chip-do">Verificar bitácora</span></td></tr>
      <tr><td>No conformidades del mes</td><td style="text-align:right"><b>${act.ncMes}</b></td><td style="text-align:right">Todas con acción</td>
        <td>${S.sgc.nc.filter(n=>n.fecha.startsWith(act.mes)&&!n.accion).length?'<span class="chip chip-am">Faltan acciones</span>':'<span class="chip chip-vd">Sí</span>'}</td></tr>
    </tbody></table>
  </div>`;
}

/* ---------- Gestión de riesgos (ISO 9001 §6.1 · ISO 15189 §8.5) ---------- */
function tabRiesgos(){
  const rs=S.sgc.riesgos.slice().sort((a,b)=>(b.prob*b.impacto)-(a.prob*a.impacto));
  const nivel=v=>v>=15?['Crítico','chip-rj']:v>=8?['Alto','chip-am']:v>=4?['Medio','chip-do']:['Bajo','chip-vd'];
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
    <div class="ayuda" style="margin:0">Identificación de riesgos del proceso con su probabilidad, impacto y control.
      La norma pide pensar en el riesgo <b>antes</b> de que ocurra el problema, no solo reaccionar.</div>
    <button class="btn btn-p" onclick="modalRiesgo()">+ Riesgo</button>
  </div>
  ${rs.length?`<div class="tarjeta"><table><thead><tr><th>Proceso</th><th>Riesgo identificado</th><th>Prob.</th><th>Impacto</th>
    <th>Nivel</th><th>Control establecido</th><th>Responsable</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rs.map(r=>{const v=r.prob*r.impacto,[n,c]=nivel(v);return `<tr>
      <td style="font-size:11.5px">${esc(r.proceso)}</td>
      <td style="font-size:11.5px;max-width:250px">${esc(r.descripcion)}</td>
      <td style="text-align:center">${r.prob}</td><td style="text-align:center">${r.impacto}</td>
      <td><span class="chip ${c}">${n} (${v})</span></td>
      <td style="font-size:11.5px;max-width:250px">${esc(r.control||'—')}</td>
      <td style="font-size:11.5px">${esc(r.responsable||'—')}</td>
      <td><span class="chip ${r.estado==='Controlado'?'chip-vd':'chip-am'}">${esc(r.estado||'Abierto')}</span></td>
      <td style="text-align:right"><button class="btn btn-g btn-min" onclick="modalRiesgo('${r.id}')">Editar</button></td></tr>`;}).join('')}
  </tbody></table></div>`:'<div class="vacio">Sin riesgos identificados.</div>'}
  <div class="aviso">Probabilidad e impacto se valoran de 1 a 5. El nivel es su producto:
    <b>1–3 bajo</b>, <b>4–7 medio</b>, <b>8–14 alto</b>, <b>15–25 crítico</b>. Los riesgos altos y críticos
    requieren un control documentado y verificado.</div>`;
}

function guardarRiesgo(id){
  const g=x=>document.getElementById(x).value.trim();
  if(!g('ri_desc')){toast('Describe el riesgo');return;}
  const d={proceso:g('ri_proc'),descripcion:g('ri_desc'),prob:Number(g('ri_prob')),impacto:Number(g('ri_imp')),
    control:g('ri_ctrl'),responsable:g('ri_resp'),estado:g('ri_estado'),verificacion:g('ri_verif')};
  const prev=id?S.sgc.riesgos.find(x=>x.id===id):null;
  if(prev)Object.assign(prev,d); else{d.id='RI-'+Date.now().toString(36);S.sgc.riesgos.push(d);}
  registrarSGC('Riesgo '+(prev?'actualizado':'identificado')+' en '+d.proceso+' — nivel '+(d.prob*d.impacto)+'.');
  guardar(true);cerrarModal();vSGC();toast('Riesgo guardado ✓');
}

/* =============== CAMPOS CON LISTA DE OPCIONES ===============
   Un análisis puede tener una lista cerrada (p. ej. Aspecto) o de selección
   múltiple (p. ej. Cilindros, donde puede haber varios tipos a la vez), con
   graduación por cada tipo encontrado. */
const GRADOS=['','Escasos','Moderados','Abundantes','1+','2+','3+','4+'];
function parseSeleccion(valor){
  // "Hialinos (Escasos), Granulosos finos (Moderados)" → {Hialinos:'Escasos', …}
  const sel={};
  String(valor||'').split(/\s*[,·]\s*/).filter(Boolean).forEach(t=>{
    const m=t.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if(m)sel[m[1].trim()]=m[2].trim(); else sel[t.trim()]='';
  });
  return sel;
}
function armarSeleccion(sel){
  return Object.entries(sel).filter(([k])=>k)
    .map(([k,g])=>g?`${k} (${g})`:k).join(', ');
}
let selOpc={};   // selección en curso dentro del modal
function modalOpciones(n,ei,pi){
  const o=S.ordenes.find(x=>x.numero===n), e=o.examenes[ei], p=e.params[pi];
  selOpc=parseSeleccion(p.valor);window.__pOpc=p;
  abrirModal(`
  <h3>${esc(p.nombre)}</h3>
  <p style="font-size:12.5px;color:var(--gris);margin-bottom:10px">
    ${p.multi?'Marca <b>todos los tipos observados</b> — pueden coexistir varios — y gradúa cada uno.'
             :'Elige una opción de la lista.'}
  </p>
  <div id="opc_lista">${listaOpciones(p)}</div>
  <div class="campo" style="margin-top:10px"><label>Texto que se imprimirá</label>
    <input id="opc_txt" value="${esc(p.valor||'')}" placeholder="Puedes escribir libremente si el hallazgo no está en la lista"></div>
  <div class="modal-pie">
    <button class="btn btn-g" onclick="modalResultados('${n}')">Cancelar</button>
    <button class="btn btn-p" onclick="guardarOpciones('${n}',${ei},${pi})">✓ Aplicar</button>
  </div>`,true);
}
function listaOpciones(p){
  const ops=p.opciones||[];
  return `<div class="opc-caja">
    ${ops.map((op,i)=>{
      const marcado=selOpc[op]!==undefined;
      return `<div class="opc-fila ${marcado?'marcada':''}">
        <label class="opc-nom">
          <input type="${p.multi?'checkbox':'radio'}" name="opcsel" ${marcado?'checked':''}
            onchange="alternarOpcion('${esc(op).replace(/'/g,"\\'")}',this.checked,${!!p.multi})">
          ${esc(op)}
        </label>
        ${(p.multi&&p.graduar!==false)?`<select class="opc-grado" ${marcado?'':'disabled'}
          onchange="graduarOpcion('${esc(op).replace(/'/g,"\\'")}',this.value)">
          ${GRADOS.map(g=>`<option value="${g}" ${selOpc[op]===g?'selected':''}>${g||'— sin graduar —'}</option>`).join('')}
        </select>`:''}
      </div>`;}).join('')}
  </div>`;
}
function alternarOpcion(op,marcado,multi){
  if(!multi){selOpc={};}
  // "Ausentes / No se observan" es excluyente: anula cualquier otro hallazgo
  const excluyente=/ausente|no se observan|negativ|normal/i.test(op);
  if(marcado){
    if(excluyente)selOpc={};
    else Object.keys(selOpc).forEach(k=>{if(/ausente|no se observan/i.test(k))delete selOpc[k];});
    selOpc[op]='';
  } else delete selOpc[op];
  refrescarOpciones();
}
function graduarOpcion(op,g){ if(selOpc[op]!==undefined){selOpc[op]=g;refrescarOpciones(true);} }
function refrescarOpciones(soloTexto){
  const t=document.getElementById('opc_txt');
  if(t)t.value=armarSeleccion(selOpc);
  if(soloTexto)return;
  const c=document.getElementById('opc_lista');
  if(c&&window.__pOpc)c.innerHTML=listaOpciones(window.__pOpc);
}
function guardarOpciones(n,ei,pi){
  const o=S.ordenes.find(x=>x.numero===n);
  o.examenes[ei].params[pi].valor=document.getElementById('opc_txt').value.trim();
  calcularFormulas(o.examenes[ei]);calcularLDLOrden(o);
  guardar();refrescarResultados(n);
}

/* =============== LECTURA DE ARCHIVOS: PDF, IMAGEN Y TEXTO ===============
   El PDF con capa de texto se lee directo. Si es un escaneo o una foto, se
   aplica reconocimiento óptico (OCR) dentro del navegador. Las librerías se
   descargan de internet la primera vez y quedan en caché.
   IMPORTANTE: el OCR puede equivocarse; el sistema SIEMPRE exige revisar la
   tabla de valores reconocidos antes de importarlos. */
const CDN={
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',

};
function cargarScript(url){
  return new Promise((ok,err)=>{
    if([...document.querySelectorAll('script')].some(s=>s.src===url))return ok();
    const s=document.createElement('script');
    s.src=url;s.onload=()=>ok();s.onerror=()=>err(new Error('sin conexión'));
    document.head.appendChild(s);
  });
}

async function importarArchivo(file,n,ei){
  if(!file)return;
  const t=document.getElementById('imp_txt');
  const nombre=file.name.toLowerCase();
  try{
    let texto='';
    if(/\.(txt|csv|tsv|dat|log)$/.test(nombre)||file.type.startsWith('text/')){
      estadoImp('Leyendo el archivo…');
      texto=await file.text();
    }
    else if(/\.pdf$/.test(nombre)||file.type==='application/pdf'){
      texto=await leerPDF(file);
    }
    else if(file.type.startsWith('image/')){
      estadoImp('Preparando el reconocimiento de la imagen…');
      texto=await reconocerImagen(await archivoAImagen(file));
    }
    else{ estadoImp(''); toast('Formato no soportado: usa PDF, imagen o texto'); return; }

    estadoImp('');
    if(!texto||!texto.trim()){toast('No se pudo extraer texto del archivo');return;}
    // Señal de OCR deficiente: muy pocas líneas con números reconocibles
    const lineasNum=texto.split(/\n/).filter(l=>/\d+[.,]?\d*/.test(l)).length;
    const ocrPobre=file.type.startsWith('image/')&&lineasNum<6;
    t.value=(t.value.trim()?t.value.trim()+'\n':'')+texto.trim();
    previewImportar(n,ei);
    const r=parsearResultados(t.value,S.ordenes.find(x=>x.numero===n).examenes[ei].params);
    const cuantos=Object.keys(r.asignados).length;
    if(!cuantos&&ocrPobre)
      toast('La foto no se leyó bien. Toma la imagen de frente, con buena luz y que el reporte llene la pantalla; o carga el PDF del equipo.');
    else toast(cuantos+' análisis reconocidos · revísalos antes de importar');
  }catch(e){
    estadoImp('');
    toast(e.message==='sin conexión'
      ? 'Se necesita internet la primera vez para leer PDF o imágenes. Mientras tanto, pega el texto.'
      : 'No se pudo leer el archivo: '+e.message);
  }
}
async function leerPDF(file){
  estadoImp('Cargando el lector de PDF…');
  await cargarScript(CDN.pdf);
  const lib=window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc=CDN.pdfWorker;
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let texto='';
  for(let i=1;i<=pdf.numPages;i++){
    estadoImp('Leyendo página '+i+' de '+pdf.numPages+'…',i/pdf.numPages);
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    // Reconstruir renglones agrupando por posición vertical
    const lineas={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (lineas[y]=lineas[y]||[]).push({x:it.transform[4],s:it.str});
    });
    texto+=Object.keys(lineas).sort((a,b)=>b-a)
      .map(y=>lineas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim())
      .filter(Boolean).join('\n')+'\n';
  }
  if(texto.replace(/\s/g,'').length>40)return texto;   // el PDF traía texto
  // PDF escaneado: se rasteriza cada página y se aplica OCR
  estadoImp('El PDF es un escaneo; se aplicará reconocimiento óptico…');
  let acum='';
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);
    const vp=pg.getViewport({scale:3.2});     // alta resolución: el OCR mejora mucho
    const cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    acum+=await reconocerImagen(cv,'Página '+i+' de '+pdf.numPages)+'\n';
  }
  return acum;
}
function archivoAImagen(file){
  return new Promise((ok,err)=>{
    const img=new Image();
    img.onload=()=>ok(img);
    img.onerror=()=>err(new Error('imagen ilegible'));
    img.src=URL.createObjectURL(file);
  });
}
/* Prepara la imagen antes del OCR: escala de grises, más contraste y tamaño
   suficiente. Sin esto, una foto de celular produce texto ilegible. */
function prepararImagen(fuente){
  const anchoOrig=fuente.naturalWidth||fuente.width;
  const altoOrig=fuente.naturalHeight||fuente.height;
  // El OCR necesita ~1800-2600 px de ancho; se escala hasta ese rango
  const escala=Math.min(4,Math.max(1,2200/Math.max(1,anchoOrig)));
  const cv=document.createElement('canvas');
  cv.width=Math.round(anchoOrig*escala);
  cv.height=Math.round(altoOrig*escala);
  const cx=cv.getContext('2d');
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  cx.drawImage(fuente,0,0,cv.width,cv.height);
  try{
    const im=cx.getImageData(0,0,cv.width,cv.height);
    const d=im.data;
    // Gris ponderado + realce de contraste alrededor del punto medio
    for(let i=0;i<d.length;i+=4){
      let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      g=(g-128)*1.55+128+8;                    // contraste y leve aclarado del papel
      g=g<0?0:g>255?255:g;
      d[i]=d[i+1]=d[i+2]=g;
    }
    cx.putImageData(im,0,0);
  }catch(e){/* si el lienzo está protegido, se usa la imagen sin realce */}
  return cv;
}
async function reconocerImagen(fuente,etiqueta){
  estadoImp('Cargando el reconocedor de texto…');
  await cargarScript(CDN.ocr);
  const pre=prepararImagen(fuente);
  estadoImp((etiqueta?etiqueta+' · ':'')+'Reconociendo texto… la primera vez tarda más',0);
  const worker=await Tesseract.createWorker(['spa','eng'],1,{
    logger:m=>{ if(m.status==='recognizing text')estadoImp((etiqueta?etiqueta+' · ':'')+'Reconociendo texto…',m.progress); }
  });
  await worker.setParameters({
    tessedit_pageseg_mode:'6',        // bloque uniforme de texto: adecuado para tablas
    preserve_interword_spaces:'1'
  });
  const {data}=await worker.recognize(pre);
  await worker.terminate();
  return data.text||'';
}

/* =============== BASE DE IMPRESIÓN DE ALTA CALIDAD =============== */
/* El navegador compone en RGB y el driver convierte a CMYK. Esta base garantiza que
   la conversión sea fiel: fuerza la reproducción exacta de color, usa negro puro (K)
   para texto y filetes, evita colores fuera del gamut CMYK y preserva la resolución
   de logo, sello y códigos de barras. */
const cssBaseImpresion=`
 /* Ningún dato del informe se convierte en enlace: los teléfonos y números
    de identidad deben verse como texto normal, no en azul subrayado. */
 a,a:link,a:visited{color:inherit !important;text-decoration:none !important}
 *,*::before,*::after{
   -webkit-print-color-adjust:exact !important;
   print-color-adjust:exact !important;
   color-adjust:exact !important;
 }
 html,body{
   -webkit-font-smoothing:antialiased;
   text-rendering:geometricPrecision;
 }
 /* Negro puro para texto y filetes: el driver lo resuelve con la plancha K, sin
    mezcla de CMY, evitando bordes con halo de color y texto "sucio" */
 body,td,th,p,div,span,b,h1,h2,h3{color:#000}
 /* Imágenes y vectores a máxima resolución (logo, sello, código de barras) */
 img{image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
 svg{shape-rendering:geometricPrecision}
 svg.codigo{shape-rendering:crispEdges}
 /* Evitar cortes feos entre páginas */
 table{page-break-inside:auto}
 tr{page-break-inside:avoid;page-break-after:auto}
 thead{display:table-header-group}
 tfoot{display:table-footer-group}
 h1,h2,h3,.area,.ex-izq{page-break-after:avoid}
 .firma-bloque,.pie-inst,.caja-tot{page-break-inside:avoid}
 @media print{
   body{margin:0}
   .hoja,.pagina{box-shadow:none !important}
 }
`;

/* Nombre de archivo seguro: sin tildes, espacios ni signos que estorben
   al guardar o al enviar por WhatsApp. */
function nombreArchivo(...partes){
  return partes.filter(Boolean).map(p=>String(p)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // quita tildes
    .replace(/[^a-zA-Z0-9]+/g,' ').trim()
    .replace(/\s+/g,'_')).join('_').slice(0,120);
}
/* Arma "Orden_Nombre_Fecha" a partir de una orden */
function nombreDeOrden(o,prefijo){
  if(!o)return nombreArchivo(prefijo,hoy());
  const p=S.pacientes.find(x=>x.codigo===o.pacCodigo);
  return nombreArchivo(prefijo,o.numero,p?p.nombre:'',o.fecha||hoy());
}
function ventanaImpresion(html,css,nombre){
  volcarEstado();
  css=cssBaseImpresion+'\n'+cssCabeceraDoc+'\n'+css+(modoAplanado?'\n'+cssAplanado:'');   // base y encabezado comunes
  if(capturaImp){capturaImp.html=html;capturaImp.css=css;capturaImp.nombre=nombre||'';return;}
  // Iframe oculto: evita bloqueadores de ventanas emergentes (popup blockers)
  const previo=document.getElementById('marco-imp');if(previo)previo.remove();
  const fr=document.createElement('iframe');
  fr.id='marco-imp';
  fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(fr);
  const doc=fr.contentDocument||fr.contentWindow.document;
  doc.open();
  // Chrome, Edge y Safari usan el <title> como nombre propuesto del archivo PDF
  const tituloDoc = nombre || 'Documento';
  // format-detection evita que iOS y Chrome conviertan teléfonos y números
  // de identidad en enlaces azules subrayados dentro del PDF
  doc.write('<!DOCTYPE html><html><head><meta charset="UTF-8">'+
    '<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">'+
    '<title>'+esc(tituloDoc)+'</title>'+
   '<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">'+
   '<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>'+
   '<style>'+css+'</style></head><body>'+html+'</body></html>');
  doc.close();
  const lanzar=()=>{
    // Al imprimir desde un iframe, el navegador propone como nombre de archivo
    // el título de LA PÁGINA PRINCIPAL, no el del documento interno.
    // Se cambia mientras dura el diálogo y se restaura después.
    const tituloPrevio=document.title;
    if(nombre)document.title=nombre;
    const restaurar=()=>{document.title=tituloPrevio;};
    try{
      const w=fr.contentWindow;
      try{w.document.querySelectorAll('svg.codigo').forEach(s=>{
        if(w.JsBarcode)w.JsBarcode(s,s.dataset.valor,{format:'CODE128',displayValue:false,height:28,margin:0,width:1.4});
        else s.outerHTML='<b style="font-size:8pt">'+s.dataset.valor+'</b>';
      });}catch(e){}
      // El título vuelve a su valor cuando se cierra el diálogo de impresión
      try{
        w.addEventListener('afterprint',restaurar,{once:true});
        window.addEventListener('afterprint',restaurar,{once:true});
      }catch(e){}
      // Redes de seguridad: si el navegador no dispara 'afterprint'
      // (pasa en algunos móviles), el título vuelve igual.
      setTimeout(restaurar,3000);
      window.addEventListener('focus',restaurar,{once:true});
      w.focus();w.print();
    }catch(e){
      restaurar();
      toast('No se pudo abrir la impresión en esta vista. Descarga el archivo y ábrelo en Chrome.');
    }
  };
  if(fr.contentWindow.document.readyState==='complete')setTimeout(lanzar,600);
  else fr.onload=()=>setTimeout(lanzar,600);
}

}

 /* Safari en iPhone deja menos área imprimible que Chrome de escritorio.
    228 mm cabe en todos: carta (279) menos márgenes (16) menos el encabezado
    que agrega el navegador (~20) deja unos 243 mm útiles. */
